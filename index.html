class LevelSelectScene extends Phaser.Scene {
  constructor() { super('LevelSelect'); }
  create() {
    useCam(this);
    this.cameras.main.fadeIn(250);
    this.cameras.main.setBackgroundColor('#0d3b24');
    hi(this.add.image(0, 0, 'backdrop')).setOrigin(0);
    truckBorder(this);
    glossyTitle(this.add.text(GAME_WIDTH / 2, 26, 'SELECT LEVEL', TXT(20, '#ffd54f', { fontStyle: 'bold' })).setOrigin(0.5));
    const save = SaveManager.load();
    this.save = save;
    this.index = Math.max(0, LEVEL_ORDER.filter(id => save.unlocked.includes(id)).length - 1);

    this.cards = LEVEL_ORDER.map((id, i) => {
      const L = LEVELS[id];
      const x = 90 + i * 150;
      const unlocked = save.unlocked.includes(id);
      buildLevelArt(this, L);
      const top = 58, cw = 132, ch = 120;
      this.add.image(x, top + ch / 2, `sky-${id}`).setDisplaySize(cw, ch);
      const farT = hiTile(this, x - cw / 2, top + ch - 40, cw * 2, 150, `far-${id}`).setOrigin(0, 1).setScale(0.5);
      const midH = this.textures.get(`mid-${id}`).getSourceImage().height / S;
      hiTile(this, x - cw / 2, top + ch - 30, cw * 2, midH, `mid-${id}`).setOrigin(0, 1).setScale(0.5);
      hiTile(this, x - cw / 2, top + ch - 34, cw, 8, `gtop-${id}`).setOrigin(0).setTileScale(0.5 / S);
      hiTile(this, x - cw / 2, top + ch - 26, cw, 26, `gfill-${id}`).setOrigin(0).setTileScale(0.5 / S);
      if (themeOf(L) === 'karachi') farT.y = top + 62;
      const card = this.add.rectangle(x, top + ch / 2, cw, ch, 0x000000, unlocked ? 0.001 : 0.6)
        .setStrokeStyle(3, 0x2e7d32).setInteractive({ useHandCursor: true });
      this.add.text(x, top + 12, `WORLD ${L.world}`, TXT(9, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 3 })).setOrigin(0.5);
      this.add.text(x, top + 32, L.name, TXT(9, '#ffffff', { fontStyle: 'bold', align: 'center', stroke: '#000', strokeThickness: 3, wordWrap: { width: 124 } })).setOrigin(0.5);
      const stars = save.stars[id] || 0;
      if (unlocked) {
        for (let k = 0; k < 3; k++) hi(this.add.image(x - 18 + k * 18, top + 62, 'star')).setAlpha(k < stars ? 1 : 0.3);
      } else this.add.text(x, top + 62, 'LOCKED', TXT(12, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 3 })).setOrigin(0.5);
      this.add.text(x, top + ch - 13, unlocked ? `BEST ${save.best[id] || 0}` : '', TXT(9, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 3 })).setOrigin(0.5);
      card.on('pointerdown', () => {
        Sfx.init();
        if (!unlocked) return Sfx.hurt();
        if (this.index === i) this.start(); else { this.index = i; this.refresh(); Sfx.coin(); }
      });
      return { card, unlocked };
    });

    makeButton(this, GAME_WIDTH / 2 - 65, 222, '< HEROES', () => this.scene.start('CharacterSelect'), 100);
    makeButton(this, GAME_WIDTH / 2 + 65, 222, 'START >', () => this.start(), 100);
    const hero = HEROES.find(h => h.id === save.hero) || HEROES[0];
    this.add.text(GAME_WIDTH / 2, 248, `Playing as ${hero.name}`, TXT(9, '#a5d6a7')).setOrigin(0.5);

    const kb = this.input.keyboard;
    kb.on('keydown-LEFT', () => this.move(-1));
    kb.on('keydown-RIGHT', () => this.move(1));
    kb.on('keydown-A', () => this.move(-1));
    kb.on('keydown-D', () => this.move(1));
    kb.on('keydown-ENTER', () => this.start());
    kb.on('keydown-SPACE', () => this.start());
    kb.on('keydown-ESC', () => this.scene.start('CharacterSelect'));
    this.refresh();
  }
  move(d) {
    const n = this.index + d;
    if (n < 0 || n >= LEVEL_ORDER.length || !this.cards[n].unlocked) return;
    this.index = n; Sfx.coin(); this.refresh();
  }
  refresh() {
    this.cards.forEach((c, i) => c.card.setStrokeStyle(3, i === this.index ? 0xffd54f : 0x2e7d32));
  }
  start() {
    if (!this.cards[this.index].unlocked) return;
    this.registry.set({ score: 0, lives: START_LIVES, jalebis: 0 });
    this.scene.start('Game', { levelId: LEVEL_ORDER[this.index] });
  }
}

class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init(data) {
    this.levelId = data.levelId || '1-1';
    this.respawnX = data.respawnX || null;
    this.L = LEVELS[this.levelId];
    const heroId = SaveManager.load().hero;
    this.hero = HEROES.find(h => h.id === heroId) || HEROES[0];
  }

  create() {
    useCam(this);
    const L = this.L;
    const W = L.width * TILE;
    const gt = L.groundTop * TILE;
    this.solid = new Set();
    this.timeLeft = LEVEL_TIME;
    this.stats = { jalebis: 0, enemies: 0, stars: new Set() };
    this.ending = false;
    this.checkpointHit = !!this.respawnX;

    buildLevelArt(this, L);
    this.cameras.main.fadeIn(250);

    /* world + camera */
    this.physics.world.setBounds(0, 0, W, WORLD_H);
    this.physics.world.setBoundsCollision(true, true, false, false);
    this.cameras.main.setBackgroundColor(L.sky);
    this.levelW = W;

    this.buildBackground();
    this.fx = new FX(this, { lahore: 0xd8b48a, karachi: 0xf1deb0, thar: 0xf0c98a }[this.themeName]);

    /* solid ground */
    this.groundGroup = this.physics.add.staticGroup();
    L.ground.forEach(([sx, len]) => {
      const x = sx * TILE, w = len * TILE, h = CAM_H + 32 - gt;
      hiTile(this, x, gt, w, TILE, `gtop-${L.id}`).setOrigin(0).setDepth(2);
      hiTile(this, x, gt + TILE, w, h - TILE, `gfill-${L.id}`).setOrigin(0).setDepth(2);
      const z = this.add.zone(x + w / 2, gt + h / 2, w, h);
      this.physics.add.existing(z, true);
      this.groundGroup.add(z);
      for (let c = sx; c < sx + len; c++) for (let r = L.groundTop; r < L.groundTop + 6; r++) this.solid.add(`${c},${r}`);
    });

    /* one-way platforms */
    this.platformGroup = this.physics.add.staticGroup();
    L.platforms.forEach(([sx, row, len]) => {
      const x = sx * TILE, y = row * TILE, w = len * TILE;
      hiTile(this, x, y, w, TILE, `plat-${L.id}`).setOrigin(0).setDepth(2);
      hi(this.add.image(x + w / 2, y + 15, 'shadow'), w / 16).setAlpha(0.35).setDepth(1.9);   // soft shadow under the ledge
      const z = this.add.zone(x + w / 2, y + TILE / 2, w, TILE);
      this.physics.add.existing(z, true);
      z.body.checkCollision.down = false;
      z.body.checkCollision.left = false;
      z.body.checkCollision.right = false;
      this.platformGroup.add(z);
      for (let c = sx; c < sx + len; c++) this.solid.add(`${c},${row}`);
    });

    /* matka blocks */
    this.matkas = this.physics.add.staticGroup();
    L.matkas.forEach(([tx, ty], i) => {
      const m = hi(this.matkas.create(tx * TILE + 8, ty * TILE + 8, 'matka')).setDepth(3).refreshBody();
      m.used = false;
      m.idx = i;
      this.solid.add(`${tx},${ty}`);
    });

    /* collectibles */
    this.coins = this.physics.add.staticGroup();
    L.coins.forEach(([tx, ty]) => {
      const c = hi(this.coins.create(tx * TILE + 8, ty * TILE + 8, 'jalebi')).setDepth(4).refreshBody();
      this.tweens.add({ targets: c, scaleX: 0.35 / S, duration: 460, yoyo: true, repeat: -1, ease: 'Sine.inOut', delay: (tx * 37) % 400 });
    });
    this.starsGroup = this.physics.add.staticGroup();
    L.stars.forEach(([tx, ty], i) => {
      const s = hi(this.starsGroup.create(tx * TILE + 8, ty * TILE + 8, 'star')).setDepth(4).refreshBody();
      s.idx = i;
      this.tweens.add({ targets: s, angle: 360, duration: 2400, repeat: -1 });
    });
    this.items = this.physics.add.group({ allowGravity: false, immovable: true });

    /* checkpoint + flag */
    const cpX = L.checkpoint * TILE + 8;
    this.checkpoint = hi(this.add.image(cpX, gt, this.checkpointHit ? 'cp-on' : 'cp-off')).setOrigin(0.25, 1).setDepth(3);
    this.cpZone = this.add.zone(cpX, gt / 2, 16, gt);
    this.physics.add.existing(this.cpZone, true);
    const fX = L.flag * TILE + 8;
    hi(this.add.image(fX, gt, 'pole')).setOrigin(0.5, 1).setDepth(3);
    this.flagSprite = hi(this.add.sprite(fX + 2, gt - 84, 'pkflag', 0)).setOrigin(0, 0.5).setDepth(3).play('pkflag-move');
    this.flagZone = this.add.zone(fX, gt / 2, 10, gt);
    this.physics.add.existing(this.flagZone, true);

    /* enemies */
    this.shadows = [];
    this.walkers = this.physics.add.group({ runChildUpdate: true });
    this.flyers = this.physics.add.group({ runChildUpdate: true, allowGravity: false });
    L.enemies.forEach(e => {
      const Cls = ENEMY_TYPES[e.t];
      if (!Cls) return;
      if (this.respawnX && e.x * TILE < this.respawnX + 40) return; // keep checkpoint start fair
      const x = e.x * TILE + 8;
      if (e.t === 'goon') { const g = new Cls(this, x, gt - 8); this.walkers.add(g); this.addShadow(g, 0.95); }
      else {
        const en = new Cls(this, x, (e.y || 9) * TILE + 8);
        this.flyers.add(en);
        en.body.setAllowGravity(false);
        this.addShadow(en, 0.75);
      }
    });

    /* player */
    this.inputMgr = new InputManager(this);
    const startX = this.respawnX || 6 * TILE;   // clear of the on-screen buttons at level start
    this.player = new Player(this, startX, gt - 24, this.hero, this.inputMgr);
    this.camFollow = true;
    this.cameras.main.scrollX = Phaser.Math.Clamp(this.player.x - GAME_WIDTH * 0.4, 0, W - GAME_WIDTH);
    this.addShadow(this.player, 1.1);
    // camera runs after physics has moved the sprites, so hero and world never drift apart
    this.events.on('postupdate', this.updateCamera, this);

    /* cricket balls (object pool) */
    this.balls = this.physics.add.group({ maxSize: 3 });

    /* colliders & overlaps */
    const solids = [this.groundGroup, this.platformGroup, this.matkas];
    solids.forEach(s => {
      this.physics.add.collider(this.walkers, s);
      this.physics.add.collider(this.balls, s, b => this.ballBounce(b));
    });
    this.physics.add.collider(this.player, this.groundGroup);
    this.physics.add.collider(this.player, this.platformGroup);
    this.physics.add.collider(this.player, this.matkas, (p, m) => this.hitMatka(p, m));
    this.physics.add.overlap(this.player, [this.walkers, this.flyers], (p, e) => this.touchEnemy(p, e));
    this.physics.add.overlap(this.balls, [this.walkers, this.flyers], (b, e) => this.ballHit(b, e));
    this.physics.add.overlap(this.player, this.coins, (p, c) => this.getCoin(c));
    this.physics.add.overlap(this.player, this.starsGroup, (p, s) => this.getStar(s));
    this.physics.add.overlap(this.player, this.items, (p, it) => this.getItem(it));
    this.physics.add.overlap(this.player, this.cpZone, () => this.reachCheckpoint());
    this.physics.add.overlap(this.player, this.flagZone, () => this.reachFlag());

    /* HUD + level intro */
    this.registry.set({ time: LEVEL_TIME, levelName: L.name, levelId: L.id, starsGot: 0, power: '' });
    this.scene.launch('HUD', { inputMgr: this.inputMgr });
    this.scene.bringToTop('HUD');
    this.showBanner(`${L.id}  ${L.name}`);
    if (IS_TOUCH && !this.respawnX && L.id === '1-1') {
      const hint = this.add.text(GAME_WIDTH / 2, 96, 'Tip: tap anywhere on the right side to jump',
        TXT(9, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 3 })).setOrigin(0.5).setScrollFactor(0).setDepth(50);
      this.tweens.add({ targets: hint, alpha: 0, delay: 4000, duration: 600, onComplete: () => hint.destroy() });
    }

    this.keyPause = [this.inputMgr.keys.ESC, this.inputMgr.keys.P];
    this.events.on('resume', () => { window.__resetTouch(); document.body.classList.add('playing'); });
    this.events.on('pause', () => { window.__resetTouch(); document.body.classList.remove('playing'); });
    document.body.classList.add('playing');
    this.events.once('shutdown', () => { document.body.classList.remove('playing'); window.__resetTouch(); });

    if (EXPOSE) window.__game = this;
  }

  buildBackground() {
    const L = this.L, gt = L.groundTop * TILE, th = themeOf(L);
    this.themeName = th;
    hi(this.add.image(0, 0, `sky-${L.id}`)).setOrigin(0).setScrollFactor(0).setDepth(-10);
    hi(this.add.image(400, th === 'thar' ? 50 : 40, 'sun'), th === 'thar' ? 1.9 : 1.4).setScrollFactor(0).setDepth(-9);

    // clouds (and kites over Lahore) drift with slow parallax
    for (let i = 0; i < Math.ceil(L.width / 18); i++) {
      const x = i * 280 + (i * 97) % 140, y = 16 + (i * 53) % 52;
      hi(this.add.image(x, y, 'cloud'), i % 2 ? 1 : 0.7).setScrollFactor(0.1 + (i % 3) * 0.05).setDepth(-8)
        .setAlpha(th === 'thar' ? 0.55 : 0.95);
      if (th === 'lahore' && i % 2 === 0) {
        const k = hi(this.add.image(x + 110, y + 34, 'patang')).setScrollFactor(0.22).setDepth(-7.5)
          .setTint([0xffffff, 0xa5d6a7, 0x90caf9, 0xf8bbd0][i % 4]);
        this.tweens.add({ targets: k, y: k.y - 8, angle: 12, duration: 1400 + i * 90, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
      }
    }

    const layer = (key, bottom, depth) => {
      if (!this.textures.exists(key)) return null;
      const h = this.textures.get(key).getSourceImage().height / S;
      return hiTile(this, 0, bottom - h, GAME_WIDTH, h, key).setOrigin(0).setScrollFactor(0).setDepth(depth);
    };
    this.far = layer(`far-${L.id}`, th === 'karachi' ? gt - 54 : gt + 22, -7);
    const pit = { lahore: 0x4a2f2a, karachi: 0x1d5f85, thar: 0xa8733f }[th];
    this.add.rectangle(0, gt + 4, GAME_WIDTH, CAM_H - gt, pit).setOrigin(0).setScrollFactor(0).setDepth(-4.5);
    this.add.rectangle(0, gt + 4, GAME_WIDTH, 6, 0x000000, 0.18).setOrigin(0).setScrollFactor(0).setDepth(-4.4);
    this.mid = layer(`mid-${L.id}`, gt + (th === 'lahore' ? 6 : 12), -6);
    this.near = layer(`near-${L.id}`, gt + 4, -5);
    hi(this.add.image(0, 0, 'vignette')).setOrigin(0).setScrollFactor(0).setDepth(45);
  }

  /** Mario-style camera: the hero can move freely inside a window in the middle of the
      screen; the view only scrolls (smoothly) when they push past its edges. */
  updateCamera(time, delta) {
    this.updateShadows();
    const cam = this.cameras.main, p = this.player;
    if (this.camFollow && p) {
      const winL = cam.scrollX + GAME_WIDTH * 0.36, winR = cam.scrollX + GAME_WIDTH * 0.5;
      let target = cam.scrollX;
      if (p.x > winR) target = p.x - GAME_WIDTH * 0.5;
      else if (p.x < winL) target = p.x - GAME_WIDTH * 0.36;
      target = Phaser.Math.Clamp(target, 0, this.levelW - GAME_WIDTH);
      const k = 1 - Math.pow(0.8, Math.min(delta, 50) / 16.67);
      cam.scrollX += (target - cam.scrollX) * k;
      if (Math.abs(target - cam.scrollX) < 0.05) cam.scrollX = target;
      cam.scrollY = 0;
    }
    if (this.far) this.far.tilePositionX = cam.scrollX * 0.12;
    if (this.mid) this.mid.tilePositionX = cam.scrollX * 0.3 + (this.themeName === 'karachi' ? time * 0.004 : 0);
    if (this.near) this.near.tilePositionX = cam.scrollX * 0.55;
  }

  /** soft shadow on the ground beneath a character; shrinks and fades as it rises */
  addShadow(target, k) {
    const sh = hi(this.add.image(target.x, target.y, 'shadow'), k).setDepth(5).setVisible(false);
    sh.target = target; sh.baseK = k;
    this.shadows.push(sh);
  }
  updateShadows() {
    this.shadows = this.shadows.filter(sh => {
      const t = sh.target;
      if (!t.active) { sh.destroy(); return false; }
      if (!t.body || !t.body.enable || t.dead || t.alive === false) { sh.setVisible(false); return true; }
      const col = Math.floor(t.x / TILE);
      let floor = null;
      for (let row = Math.max(0, Math.floor((t.body.bottom - 2) / TILE)); row < 18; row++) {
        if (this.solid.has(`${col},${row}`)) { floor = row * TILE; break; }
      }
      if (floor === null) { sh.setVisible(false); return true; }
      const k = Phaser.Math.Clamp(1 - (floor - t.body.bottom) / 120, 0.35, 1);
      sh.setVisible(true).setPosition(t.x, floor + 0.6).setScale(sh.baseK * k / S).setAlpha(k);
      return true;
    });
  }

  isSolidAt(px, py) {
    return this.solid.has(`${Math.floor(px / TILE)},${Math.floor(py / TILE)}`);
  }

  showBanner(text) {
    const t = this.add.text(GAME_WIDTH / 2, 70, text, TXT(14, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }))
      .setOrigin(0.5).setScrollFactor(0).setDepth(50);
    this.tweens.add({ targets: t, alpha: 0, delay: 1400, duration: 500, onComplete: () => t.destroy() });
  }

  floatText(x, y, str, color = '#ffffff') {
    const t = this.add.text(x, y, str, TXT(8, color, { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 })).setOrigin(0.5).setDepth(40);
    this.tweens.add({ targets: t, y: y - 18, alpha: 0, duration: 700, onComplete: () => t.destroy() });
  }

  addScore(n) { this.registry.inc('score', n); }

  /* ---------- interactions ---------- */
  touchEnemy(p, e) {
    if (!e.alive || p.dead || this.ending) return;
    const falling = p.body.velocity.y > 0 && p.body.bottom <= e.body.top + 10;
    if (falling) {
      e.stomp();
      p.body.setVelocityY(this.inputMgr.jumpHeld ? -360 : -240);
      this.stats.enemies++;
      this.addScore(100);
      this.floatText(e.x, e.y - 8, '100');
      Sfx.stomp();
    } else {
      p.hurt(this.time.now);
    }
  }

  hitMatka(p, m) {
    if (m.used || this.ending) return;
    const fromBelow = (p.body.touching.up || p.body.blocked.up) && p.body.top >= m.body.bottom - 4 &&
      Math.abs(p.x - m.x) < 14;
    if (!fromBelow) return;
    m.used = true;
    m.setTexture('matka-used');
    this.fx.spark(m.x, m.y - 8, 6);
    this.tweens.add({ targets: m, y: m.y - 5, duration: 70, yoyo: true });
    const kind = !p.isBig ? 'samosa' : ['ball', 'chai', 'patang'][m.idx % 3];
    const it = hi(this.items.create(m.x, m.y, kind)).setDepth(2);
    it.kind = kind;
    it.body.enable = false;
    this.tweens.add({ targets: it, y: m.y - 16, duration: 300, onComplete: () => {
      if (!it.active) return;
      it.body.enable = true;
      this.tweens.add({ targets: it, y: it.y - 3, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    } });
    Sfx.coin();
  }

  getItem(it) {
    if (!it.active) return;
    const p = this.player;
    const now = this.time.now;
    const label = { samosa: 'SAMOSA! BIG', chai: 'CHAI! SPEED', patang: 'PATANG! GLIDE', ball: 'CRICKET BALL! (J)' }[it.kind];
    if (it.kind === 'samosa') p.grow();
    if (it.kind === 'chai') p.speedUntil = now + 10000;
    if (it.kind === 'patang') p.glideUntil = now + 10000;
    if (it.kind === 'ball') { p.hasBall = true; if (!p.isBig) p.grow(); }
    this.floatText(it.x, it.y - 10, label, '#ffd54f');
    this.fx.spark(p.x, p.y, 14);
    it.destroy();
    Sfx.power();
  }

  getCoin(c) {
    c.disableBody(true, true);
    this.fx.spark(c.x, c.y, 5);
    this.stats.jalebis++;
    this.addScore(10);
    this.registry.inc('jalebis', 1);
    if (this.registry.get('jalebis') >= 100) {
      this.registry.inc('jalebis', -100);
      this.registry.inc('lives', 1);
      this.floatText(this.player.x, this.player.y - 20, '1UP!', '#76ff03');
      Sfx.power();
    } else Sfx.coin();
  }

  getStar(s) {
    s.disableBody(true, true);
    this.fx.spark(s.x, s.y, 18);
    this.stats.stars.add(s.idx);
    this.registry.set('starsGot', this.stats.stars.size);
    this.addScore(1000);
    this.floatText(s.x, s.y - 10, 'TAARA! 1000', '#ffd54f');
    Sfx.star();
  }

  reachCheckpoint() {
    if (this.checkpointHit) return;
    this.checkpointHit = true;
    this.respawnX = this.L.checkpoint * TILE + 8;
    this.checkpoint.setTexture('cp-on');
    this.fx.spark(this.checkpoint.x + 6, this.checkpoint.y - 30, 12);
    this.floatText(this.checkpoint.x, this.checkpoint.y - 44, 'CHECKPOINT', '#76ff03');
    Sfx.power();
  }

  throwBall(p) {
    const b = this.balls.get(p.x + p.facing * 10, p.y - 2, 'ball');
    if (!b) return;
    hi(b);
    b.setActive(true).setVisible(true).setDepth(9);
    b.body.enable = true;
    b.body.reset(p.x + p.facing * 10, p.y - 2);
    b.body.setAllowGravity(true);
    b.body.setCircle(4 * S, 1 * S, 1 * S);
    b.setBounce(0.65, 0.65);
    const speed = p.hero.ability === 'fastThrow' ? 340 : 280;
    b.setVelocity(p.facing * speed, -80);
    b.dir = p.facing;
    b.dieAt = this.time.now + 1600;
    Sfx.throwB();
  }

  ballBounce(b) {
    if (b.body.blocked.left || b.body.blocked.right) this.killBall(b);
    else if (b.body.blocked.down) b.setVelocityY(-200);
  }

  ballHit(b, e) {
    if (!b.active || !e.alive) return;
    e.knockOut(b.dir);
    this.killBall(b);
    this.stats.enemies++;
    this.addScore(100);
    this.floatText(e.x, e.y - 8, '100');
    Sfx.stomp();
  }

  killBall(b) {
    b.setActive(false).setVisible(false);
    b.body.enable = false;
  }

  playerDie() {
    const p = this.player;
    if (p.dead || this.ending) return;
    p.dead = true;
    p.body.enable = false;
    p.setAlpha(1).setFrame(7).anims.stop();
    Sfx.hurt();
    this.camFollow = false;
    this.tweens.add({ targets: p, y: p.y - 40, duration: 350, ease: 'Quad.out',
      onComplete: () => this.tweens.add({ targets: p, y: p.y + 320, duration: 800, ease: 'Quad.in' }) });
    this.time.delayedCall(1500, () => {
      this.registry.inc('lives', -1);
      if (this.registry.get('lives') <= 0) {
        this.scene.stop('HUD');
        this.scene.start('GameOver', { levelId: this.levelId });
      } else {
        this.scene.restart({ levelId: this.levelId, respawnX: this.checkpointHit ? this.respawnX : null });
      }
    });
  }

  reachFlag() {
    if (this.ending || this.player.dead) return;
    this.ending = true;
    const p = this.player;
    p.frozen = true;
    p.body.setVelocity(0, 0).setAcceleration(0, 0);
    p.setAlpha(1);
    Sfx.flag();
    this.fx.confetti(this.flagSprite.x + 14, this.flagSprite.y, 50);
    this.time.delayedCall(500, () => this.fx.confetti(p.x, p.y - 20, 40));
    const timeLeft = Math.max(0, Math.floor(this.timeLeft));
    const levelPts = levelScore({ jalebis: this.stats.jalebis, enemies: this.stats.enemies, timeLeft, stars: this.stats.stars.size });
    this.addScore(timeLeft * 5);
    SaveManager.complete(this.levelId, levelPts, this.stats.stars.size, this.L.next);
    this.time.delayedCall(1800, () => {
      this.scene.stop('HUD');
      this.scene.start('LevelComplete', {
        levelId: this.levelId, jalebis: this.stats.jalebis, enemies: this.stats.enemies,
        timeLeft, stars: this.stats.stars.size, levelPts
      });
    });
  }

  update(time, delta) {
    this.inputMgr.update();
    const p = this.player;

    if (!this.ending && !p.dead) {
      if (this.keyPause.some(k => Phaser.Input.Keyboard.JustDown(k)) || this.inputMgr.pausePressed) {
        this.inputMgr.pausePressed = false;
        this.scene.launch('Pause');
        this.scene.pause();
        return;
      }
      this.timeLeft -= delta / 1000;
      this.registry.set('time', Math.max(0, Math.ceil(this.timeLeft)));
      if (this.timeLeft <= 0) this.playerDie();
      if (p.y > CAM_H + 24) this.playerDie();
    }
    p.update(time, delta);

    // power-up label for the HUD
    const pw = [];
    if (p.canThrow()) pw.push('BALL');
    if (time < p.speedUntil) pw.push(`CHAI ${Math.ceil((p.speedUntil - time) / 1000)}`);
    if (time < p.glideUntil) pw.push(`PATANG ${Math.ceil((p.glideUntil - time) / 1000)}`);
    this.registry.set('power', pw.join('  '));

    // balls lifetime
    this.balls.getChildren().forEach(b => { if (b.active && (time > b.dieAt || b.y > CAM_H + 20)) this.killBall(b); });

    // performance watchdog: if frames drop for ~2 s, render at a lighter scale
    const now = performance.now();
    if (!this.fpsWatch) this.fpsWatch = { since: now + 1500, lowFrom: 0 };
    if (now > this.fpsWatch.since && Z > 1 && !Z_FORCED) {
      if (this.game.loop.actualFps >= 45) this.fpsWatch.lowFrom = 0;
      else if (!this.fpsWatch.lowFrom) this.fpsWatch.lowFrom = now;
      else if (now - this.fpsWatch.lowFrom > 2000) {
        setRenderScale(this.game, Z - 1);
        this.fpsWatch = { since: now + 2500, lowFrom: 0 };
      }
    }

  }
}

class HUDScene extends Phaser.Scene {
  constructor() { super('HUD'); }
  init(data) { this.inputMgr = data.inputMgr; }
  create() {
    useCam(this);
    const g = this.add.graphics();
    g.fillStyle(0x01411c, 0.95).fillRect(0, 0, GAME_WIDTH, 22);
    g.fillStyle(0xffd54f, 1).fillRect(0, 22, GAME_WIDTH, 1);
    const cols = [0xe91e63, 0xffd54f, 0x00bcd4, 0x8bc34a];
    for (let i = 0; i < GAME_WIDTH; i += 10) g.fillStyle(cols[(i / 10) % 4], 0.9).fillTriangle(i, 23, i + 10, 23, i + 5, 27);

    const s = TXT(9, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 });
    const heroId = SaveManager.load().hero;
    hi(this.add.image(0, -1, heroId, 0)).setOrigin(0).setCrop(5 * S, 0, 14 * S, 13 * S);
    this.livesT = this.add.text(21, 6, '', s);
    this.scoreT = this.add.text(52, 6, '', s);
    hi(this.add.image(156, 11, 'jalebi'));
    this.coinT = this.add.text(165, 6, '', s);
    this.starImgs = [0, 1, 2].map(i => hi(this.add.image(214 + i * 15, 11, 'star'), 0.85));
    this.levelT = this.add.text(268, 6, '', TXT(9, '#c8e6c9', { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }));
    this.timeT = this.add.text(GAME_WIDTH - 98, 6, '', s);
    this.powerT = this.add.text(8, 30, '', TXT(8, '#80deea', { fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }));

    const pauseBtn = this.add.text(GAME_WIDTH - 8, 4, 'II', TXT(11, '#01411c', { fontStyle: 'bold', backgroundColor: '#ffd54f', padding: { x: 4, y: 1 } }))
      .setOrigin(1, 0).setInteractive({ useHandCursor: true });
    pauseBtn.on('pointerdown', () => { if (this.inputMgr) this.inputMgr.pausePressed = true; });
    if (IS_TOUCH && this.scale.fullscreen.available) {
      const fs = this.add.text(GAME_WIDTH - 34, 4, '⛶', TXT(11, '#01411c', { fontStyle: 'bold', backgroundColor: '#ffd54f', padding: { x: 3, y: 1 } }))
        .setOrigin(1, 0).setInteractive({ useHandCursor: true });
      fs.on('pointerup', () => { if (this.scale.isFullscreen) this.scale.stopFullscreen(); else goFullscreen(this); });
      this.timeT.x -= 22;
    }


  }

  update() {
    const r = this.registry;
    this.scoreT.setText(String(r.get('score') || 0).padStart(7, '0'));
    this.coinT.setText(`x${r.get('jalebis') || 0}`);
    const got = r.get('starsGot') || 0;
    this.starImgs.forEach((im, i) => im.setAlpha(i < got ? 1 : 0.28));
    this.livesT.setText(`x${r.get('lives')}`);
    this.levelT.setText(`WORLD ${r.get('levelId')}`);
    const t = r.get('time');
    this.timeT.setText(`TIME ${t}`).setColor(t <= 50 ? '#ff8a80' : '#ffffff');
    this.powerT.setText(r.get('power') || '');
  }
}

class PauseScene extends Phaser.Scene {
  constructor() { super('Pause'); }
  create() {
    useCam(this);
    this.add.rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.6).setOrigin(0);
    glossyTitle(this.add.text(GAME_WIDTH / 2, 70, 'PAUSED', TXT(28, '#ffd54f', { fontStyle: 'bold' })).setOrigin(0.5));
    makeButton(this, GAME_WIDTH / 2, 120, 'RESUME', () => this.resumeGame(), 140);
    makeButton(this, GAME_WIDTH / 2, 150, Sfx.muted ? 'SOUND: OFF' : 'SOUND: ON', () => {
      Sfx.muted = !Sfx.muted;
      const d = SaveManager.load(); d.muted = Sfx.muted; SaveManager.save(d);
      this.scene.restart();
    }, 140);
    makeButton(this, GAME_WIDTH / 2, 180, 'QUIT TO LEVELS', () => {
      this.scene.stop('HUD'); this.scene.stop('Game'); this.scene.start('LevelSelect');
    }, 140);
    this.input.keyboard.on('keydown-ESC', () => this.resumeGame());
    this.input.keyboard.on('keydown-P', () => this.resumeGame());
    this.input.keyboard.on('keydown-ENTER', () => this.resumeGame());
  }
  resumeGame() { this.scene.resume('Game'); this.scene.stop(); }
}

class LevelCompleteScene extends Phaser.Scene {
  constructor() { super('LevelComplete'); }
  init(d) { this.d = d; }
  create() {
    useCam(this);
    this.cameras.main.fadeIn(250);
    const d = this.d;
    const L = LEVELS[d.levelId];
    const last = !L.next;
    this.cameras.main.setBackgroundColor('#01411c');
    hi(this.add.image(0, 0, 'backdrop')).setOrigin(0);
    truckBorder(this);
    glossyTitle(this.add.text(GAME_WIDTH / 2, 36, last ? 'KITE RECOVERED!' : 'SHABAASH!', TXT(28, '#ffd54f', { fontStyle: 'bold', stroke: '#000', strokeThickness: 5 })).setOrigin(0.5));
    this.add.text(GAME_WIDTH / 2, 62, `${L.id}  ${L.name} complete`, TXT(10)).setOrigin(0.5);
    const lines = [
      ['Jalebis', `${d.jalebis} x 10`, d.jalebis * 10],
      ['Enemies', `${d.enemies} x 100`, d.enemies * 100],
      ['Time left', `${d.timeLeft} x 5`, d.timeLeft * 5],
      ['Taaray', `${d.stars} x 1000`, d.stars * 1000]
    ];
    lines.forEach(([a, b, c], i) => {
      const y = 88 + i * 18;
      this.add.text(120, y, a, TXT(10)).setOrigin(0, 0.5);
      this.add.text(250, y, b, TXT(10, '#c8e6c9')).setOrigin(0.5);
      this.add.text(360, y, String(c), TXT(10, '#ffd54f', { fontStyle: 'bold' })).setOrigin(1, 0.5);
    });
    this.add.text(120, 170, 'LEVEL SCORE', TXT(11, '#ffffff', { fontStyle: 'bold' })).setOrigin(0, 0.5);
    this.add.text(360, 170, String(d.levelPts), TXT(11, '#ffd54f', { fontStyle: 'bold' })).setOrigin(1, 0.5);
    if (last) this.add.text(GAME_WIDTH / 2, 192, 'The festival sky is colourful again. Thank you, hero!', TXT(9, '#80deea')).setOrigin(0.5);

    const next = () => {
      if (last) this.scene.start('LevelSelect');
      else this.scene.start('Game', { levelId: L.next });
    };
    makeButton(this, GAME_WIDTH / 2 - 70, 226, 'LEVELS', () => this.scene.start('LevelSelect'), 110);
    makeButton(this, GAME_WIDTH / 2 + 70, 226, last ? 'FINISH' : 'NEXT >', next, 110);
    this.input.keyboard.once('keydown-ENTER', next);
    this.input.keyboard.once('keydown-SPACE', next);
  }
}

class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOver'); }
  init(d) { this.d = d; }
  create() {
    useCam(this);
    this.cameras.main.fadeIn(250);
    this.cameras.main.setBackgroundColor('#1a1a1a');
    glossyTitle(this.add.text(GAME_WIDTH / 2, 80, 'GAME OVER', TXT(32, '#e53935', { fontStyle: 'bold', stroke: '#000', strokeThickness: 5 })).setOrigin(0.5), '#ffd0c8', '#ff6f60', '#e53935', '#8e0000');
    this.add.text(GAME_WIDTH / 2, 116, `Final score: ${this.registry.get('score') || 0}`, TXT(12)).setOrigin(0.5);
    this.add.text(GAME_WIDTH / 2, 136, 'Himmat na haaro! Try again.', TXT(10, '#a5d6a7')).setOrigin(0.5);
    const retry = () => {
      this.registry.set({ score: 0, lives: START_LIVES, jalebis: 0 });
      this.scene.start('Game', { levelId: this.d.levelId });
    };
    makeButton(this, GAME_WIDTH / 2 - 70, 190, 'RETRY', retry, 110);
    makeButton(this, GAME_WIDTH / 2 + 70, 190, 'LEVELS', () => this.scene.start('LevelSelect'), 110);
    this.input.keyboard.once('keydown-ENTER', retry);
    this.input.keyboard.once('keydown-SPACE', retry);
  }
}

/* ------------------------------ 12. BOOTSTRAP ----------------------------- */
const fontsReady = document.fonts && document.fonts.load
  ? Promise.race([Promise.all([document.fonts.load('800 16px "Baloo 2"'), document.fonts.load('600 16px "Baloo 2"')]), new Promise(r => setTimeout(r, 1500))])
  : Promise.resolve();
let game;
fontsReady.catch(() => {}).then(() => { game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: GAME_WIDTH * Z,
  height: GAME_HEIGHT * Z,
  pixelArt: false,
  antialias: true,
  backgroundColor: '#0b0f14',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, fullscreenTarget: 'app' },
  physics: { default: 'arcade', arcade: { gravity: { y: GRAVITY }, debug: DEBUG } },
  input: { gamepad: true, activePointers: 4 },
  scene: [BootScene, MenuScene, CharacterSelectScene, LevelSelectScene, GameScene, HUDScene,
          PauseScene, LevelCompleteScene, GameOverScene]
});
  startGameHooks();
});
function startGameHooks() {
if (EXPOSE) window.__phaser = game;

// Keep the game exactly the size of the *visible* screen (mobile address bars change it).
function fitToScreen() {
  const el = document.getElementById('game');
  const vv = window.visualViewport;
  el.style.width = Math.round(vv ? vv.width : window.innerWidth) + 'px';
  el.style.height = Math.round(vv ? vv.height : window.innerHeight) + 'px';
  if (!game) return;
  if (game.canvas && game.isBooted) game.scale.refresh();
  // size the touch buttons to fit the empty strips beside the game where possible
  const w = vv ? vv.width : window.innerWidth, h = vv ? vv.height : window.innerHeight;
  const short = Math.min(w, h);
  const size = Math.max(64, Math.min(96, short * 0.21));          // ~76px on a typical phone
  const pad = document.getElementById('pad');
  pad.style.setProperty('--s', Math.round(size) + 'px');
  pad.style.setProperty('--m', Math.round(Math.max(16, short * 0.05)) + 'px');
  if (window.__measurePad) requestAnimationFrame(window.__measurePad);
}
window.addEventListener('resize', fitToScreen);
window.addEventListener('orientationchange', () => setTimeout(fitToScreen, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitToScreen);
game.events.once('ready', fitToScreen);
fitToScreen();
}
</script>

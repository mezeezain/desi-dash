               font-family: monospace; -webkit-tap-highlight-color: transparent;
               -webkit-user-select:none; user-select:none; }
  /* 100dvh = the height actually visible (excludes the mobile browser's address bar).
     JS below also sets the exact pixel size, for browsers without dvh support. */
  #app { position:fixed; inset:0; background:#0b0f14; }
  #game { position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh;
          display:flex; align-items:center; justify-content:center; }
  canvas { touch-action: none; }
  #rotate { display:none; position:fixed; inset:0; z-index:10; background:#01411c; color:#ffd54f;
            font: bold 20px monospace; text-align:center; flex-direction:column;
            align-items:center; justify-content:center; gap:18px; padding:24px; }
  #rotate .icon { font-size:64px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%,30% { transform: rotate(0deg); } 60%,100% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display:flex; } }

  /* On-screen controls: big, well-spaced, semi-transparent buttons anchored to the
     bottom corners where thumbs rest. --s is set from the screen height in JS. */
  #pad { display:none; position:fixed; inset:0; pointer-events:none; z-index:5;
         --s: 76px; --m: 18px; }
  body.touch.playing #pad { display:block; }
  #pad .grp { position:absolute; bottom: calc(var(--m) + env(safe-area-inset-bottom)); display:flex;
              align-items:flex-end; pointer-events:auto; }
  #pad .l { left: calc(var(--m) + env(safe-area-inset-left)); gap: calc(var(--s) * 0.38); }
  #pad .r { right: calc(var(--m) + env(safe-area-inset-right)); gap: calc(var(--s) * 0.3); }
  #pad .b { width:var(--s); height:var(--s); border-radius:50%; box-sizing:border-box;
            border:3px solid rgba(255,255,255,0.85); background:rgba(0,0,0,0.30);
            box-shadow: 0 3px 10px rgba(0,0,0,0.35);

   DESI DASH — MVP prototype
   Sections: constants → data → textures → audio → save → entities →
             systems → scenes → bootstrap

/* ------------------------------ 1. CONSTANTS ------------------------------ */
const TILE            = 16;
const GAME_WIDTH      = 480;
const GAME_HEIGHT     = 270;
const GRAVITY         = 1050;
const COYOTE_MS       = 120;
const JUMP_BUFFER_MS  = 160;
const MAX_FALL_SPEED  = 600;
const START_LIVES     = 3;

const WORLD_H         = 400;   // physics bounds (deeper than camera so falls kill)
const CAM_H           = 272;

const VERSION = '202610262016';
// If the phone is showing an old cached copy, reload once with the new version in the URL
// (a new URL bypasses GitHub Pages' 10-minute cache).
(function checkForUpdate() {
  if (location.protocol === 'file:') return;
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = (v || '').trim();
    const params = new URLSearchParams(location.search);
    if (v && v !== VERSION && params.get('v') !== v) { params.set('v', v); location.replace(location.pathname + '?' + params.toString()); }
  }).catch(() => {});
})();
const DEBUG = new URLSearchParams(location.search).has('debug');
const EXPOSE = DEBUG || new URLSearchParams(location.search).has('test');
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window
  || new URLSearchParams(location.search).has('touch');

/** Render scale: the game logic stays 480x270, but it is drawn 2-4x larger so movement
    is smooth on big, high-density screens (each world pixel moves in finer steps). */
const Z_FORCED = parseInt(new URLSearchParams(location.search).get('z'), 10) > 0;
let Z = (() => {
  const forced = parseInt(new URLSearchParams(location.search).get('z'), 10);
  if (forced >= 1 && forced <= 4) return forced;
  const dpr = window.devicePixelRatio || 1;
  const fit = Math.min(window.innerWidth * dpr / GAME_WIDTH, window.innerHeight * dpr / GAME_HEIGHT);
  return Math.max(2, Math.min(IS_TOUCH ? 3 : 4, Math.round(fit)));
})();
/** every scene draws in 480x270 world units through a zoomed camera anchored top-left */
function useCam(scene) { return scene.cameras.main.setOrigin(0, 0).setZoom(Z).setRoundPixels(true); }
/** drop to a lighter render scale on devices that can't keep up (game logic is unaffected) */
function setRenderScale(game, z) {
  if (z === Z) return;
  Z = z;
  game.scale.setGameSize(GAME_WIDTH * Z, GAME_HEIGHT * Z);
  game.scene.getScenes(true).forEach(sc => useCam(sc));
}

/** Touch button state, shared by the HTML pad and the InputManager */
const TOUCH = { left: false, right: false, jump: false, action: false };
// presses latched until the game reads them, so a tap shorter than one frame is never lost
const TOUCH_TAP = { jump: false, action: false };
const TOUCH_META = { dirSince: 0, jumpHoldUntil: 0 };
(function setupPad() {
  if (IS_TOUCH) document.body.classList.add('touch');
  const held = new Map();                       // pointerId -> button key
  let buttons = [];                             // cached centres/radii of the visible buttons
  const measure = () => {
    buttons = [...document.querySelectorAll('#pad [data-k]')].map(el => {
      const r = el.getBoundingClientRect();
      return { el, k: el.dataset.k, x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 };
    }).filter(b => b.r > 0);
  };
  window.__measurePad = measure;
  /** nearest button whose generous touch zone (1.6x its radius) contains the point;
      anywhere else on the right half of the screen (below the score bar) is a jump */
  const keyAt = (x, y) => {
    if (!buttons.length) measure();
    let best = null, bestD = Infinity;
    for (const b of buttons) {
      const d = Math.hypot(x - b.x, y - b.y) / b.r;
      if (d < 1.6 && d < bestD) { best = b.k; bestD = d; }
    }
    if (!best && x > window.innerWidth * 0.5 && y > window.innerHeight * 0.16) best = 'jump';
    return best;
  };
  const sync = () => {
    const was = { ...TOUCH };
    Object.keys(TOUCH).forEach(k => { TOUCH[k] = false; });
    held.forEach(k => { if (k) TOUCH[k] = true; });
    const now = performance.now();
    if (TOUCH.jump && !was.jump) { TOUCH_TAP.jump = true; TOUCH_META.jumpHoldUntil = now + 320; } // every tap = same full jump
    if (TOUCH.action && !was.action) TOUCH_TAP.action = true;
    const dir = TOUCH.left || TOUCH.right, wasDir = was.left || was.right;
    if (dir && (!wasDir || TOUCH.left !== was.left)) TOUCH_META.dirSince = now;
    const pressedNew = Object.keys(TOUCH).some(k => TOUCH[k] && !was[k]);
    if (pressedNew && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) { } }
    buttons.forEach(b => b.el.classList.toggle('on', TOUCH[b.k]));
  };
  const down = e => {
    if (!document.body.classList.contains('playing')) return;
    measure();
    const k = keyAt(e.clientX, e.clientY);
    if (!k) return;
    held.set(e.pointerId, k); sync();
    e.preventDefault(); e.stopPropagation();
  };
  const move = e => {
    if (!held.has(e.pointerId)) return;
    const k = keyAt(e.clientX, e.clientY);
    // sticky: keep the current button when the thumb drifts off it; switch only onto another button
    if (k && k !== held.get(e.pointerId)) { held.set(e.pointerId, k); sync(); }
    e.preventDefault();
  };
  const end = e => { if (held.delete(e.pointerId)) sync(); };
  document.addEventListener('pointerdown', down, { capture: true, passive: false });
  document.addEventListener('pointermove', move, { capture: true, passive: false });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => document.addEventListener(t, end, true));
  // safety net: a touchend with no fingers left means nothing is held
  document.addEventListener('touchend', e => { if (e.touches.length === 0 && held.size) { held.clear(); sync(); } }, true);
  window.addEventListener('blur', () => { held.clear(); sync(); });
  document.addEventListener('contextmenu', e => { if (held.size || keyAt(e.clientX, e.clientY)) e.preventDefault(); });
  window.__resetTouch = () => { held.clear(); sync(); TOUCH_TAP.jump = TOUCH_TAP.action = false; };
})();

/** On phones: go fullscreen (hides the browser bar) and lock to landscape where supported.
    Must be called from a pointerup handler, since browsers only allow it after a tap. */
function goFullscreen(scene) {
  if (!IS_TOUCH || !scene.scale.fullscreen.available || scene.scale.isFullscreen) return;
  scene.scale.once('enterfullscreen', () => {
    try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) { }
  });
  try { scene.scale.startFullscreen(); } catch (e) { }
}

/* ------------------------------ 3. ART (procedural, hi-res, 3D-shaded) ----- */
/* Everything is drawn in code, so the game needs no image files. Textures are painted
   at S x the world size (S texels per world pixel) with gradients, bevels and highlights,
   then displayed at 1/S scale, so sizes and hitboxes in the world never change. */

const S = 3;
const OUT = '#2b1a12';                         // warm dark outline colour

/* ---- colour helpers ---- */
function hexRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
/** lighten (f > 0) or darken (f < 0) a hex colour, returns hex */
function lit(hex, f) {
  const m = v => Math.max(0, Math.min(255, Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f))));
  return '#' + hexRgb(hex).map(v => m(v).toString(16).padStart(2, '0')).join('');
}
const shade = lit;
function mix(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a) { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function rng(seed) {                            // deterministic random (mulberry32)
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---- canvas helpers (all coordinates in world pixels; the context is pre-scaled) ---- */
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function prep(x) { x.lineJoin = 'round'; x.lineCap = 'round'; return x; }
function hiArt(w, h, draw) {
  const c = newCanvas(Math.round(w * S), Math.round(h * S));
  const x = prep(c.getContext('2d'));
  x.scale(S, S);
  draw(x, w, h);
  return c;
}
function makeTex(scene, key, w, h, draw) {     // hi-res texture in the texture manager
  if (scene.textures.exists(key)) return;
  scene.textures.addCanvas(key, hiArt(w, h, draw));
}
function addSheet(scene, key, fw, fh, frames) {
  if (scene.textures.exists(key)) return;
  const W = Math.round(fw * S), H = Math.round(fh * S);
  const t = scene.textures.createCanvas(key, W * frames.length, H);
  const ctx = t.getContext();
  frames.forEach((f, i) => { ctx.drawImage(f, i * W, 0); t.add(i, 0, i * W, 0, W, H); });
  t.refresh();
}
function addImage(scene, key, canvas) { if (!scene.textures.exists(key)) scene.textures.addCanvas(key, canvas); }

const LG = (x, x0, y0, x1, y1, stops) => { const g = x.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
const RG = (x, cx, cy, r, stops, fx = cx, fy = cy, fr = 0) => { const g = x.createRadialGradient(fx, fy, fr, cx, cy, r); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
function rrect(x, X, Y, W, H, R) {
  R = Math.min(R, W / 2, H / 2);
  x.beginPath();
  x.moveTo(X + R, Y); x.lineTo(X + W - R, Y); x.quadraticCurveTo(X + W, Y, X + W, Y + R);
  x.lineTo(X + W, Y + H - R); x.quadraticCurveTo(X + W, Y + H, X + W - R, Y + H);
  x.lineTo(X + R, Y + H); x.quadraticCurveTo(X, Y + H, X, Y + H - R);
  x.lineTo(X, Y + R); x.quadraticCurveTo(X, Y, X + R, Y); x.closePath();
}
function paint(x, fill, lw = 0.7, stroke = OUT) {
  x.fillStyle = fill; x.fill();
  if (lw) { x.lineWidth = lw; x.strokeStyle = stroke; x.stroke(); }
}
function ellipse(x, cx, cy, rx, ry, fill, lw = 0.7, stroke = OUT) {
  x.beginPath(); x.ellipse(cx, cy, Math.max(0.01, rx), Math.max(0.01, ry), 0, 0, Math.PI * 2); paint(x, fill, lw, stroke);
}
/** rounded limb: outlined thick line with a left-lit cylinder gradient */
function limb(x, x0, y0, x1, y1, w, col) {
  x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1);
  x.strokeStyle = OUT; x.lineWidth = w + 1.2; x.stroke();
  const mx = (x0 + x1) / 2;
  x.strokeStyle = LG(x, mx - w / 2, 0, mx + w / 2, 0, [[0, lit(col, 0.28)], [0.45, col], [1, lit(col, -0.28)]]);
  x.lineWidth = w; x.stroke();
}
/** sphere shading: light from the top-left */
const sphere = (x, cx, cy, r, col) => RG(x, cx, cy, r, [[0, lit(col, 0.55)], [0.35, lit(col, 0.12)], [0.8, col], [1, lit(col, -0.35)]], cx - r * 0.38, cy - r * 0.42, r * 0.05);
const gloss = (x, cx, cy, rx, ry, a = 0.55) => { x.beginPath(); x.ellipse(cx, cy, rx, ry, -0.5, 0, Math.PI * 2); x.fillStyle = `rgba(255,255,255,${a})`; x.fill(); };

/* ---- heroes ---- */
const FW = 24, FH = 32, HERO_FRAMES = 8;

const HERO_STYLE = {
  ali:     { cut: 'short', cap: 'cricket', bat: true, trim: '#fdd835' },
  ayesha:  { cut: 'long', dupatta: true, girl: true, dupattaColor: '#fff3e0' },
  hamza:   { cut: 'long', cap: 'topi', top: '#ece4d4', vest: '#37474f' },
  zara:    { cut: 'long', dupatta: true, ajrak: true, girl: true },
  bilal:   { cut: 'mid', cap: 'pakol', buttons: true },
  mahnoor: { cut: 'mid', dupatta: true, girl: true }
};

function drawHero(p, s, frame) {
  return hiArt(FW, FH, x => {
    const sk = p.skin, top = s.top || p.top, bot = p.bottom, hair = p.hair;
    const dup = s.ajrak ? '#b71c1c' : (s.dupattaColor || p.scarf || top);

    // pose per frame
    let lb = 0, lf = 0, yb = 0, yf = 0, b = 0, aB = 0, aF = 0, sway = 0, armUp = false, armsOut = false;
    switch (frame) {
      case 1: b = 0.6; break;
      case 2: lb = -2; lf = 2; aB = 1.2; aF = -1.2; sway = 1; break;
      case 3: yb = -1; b = -0.7; break;
      case 4: lb = 2; lf = -2; aB = -1.2; aF = 1.2; sway = -1; break;
      case 5: yf = -1; b = -0.7; break;
      case 6: lb = -1; lf = 2.5; yf = -3; armUp = true; sway = 2; break;
      case 7: lb = -2; lf = 2; yb = -1; armsOut = true; sway = -2; break;
    }
    const cutY = s.cut === 'long' ? 24.6 : s.cut === 'mid' ? 22.6 : 21.4;
    const hx = 12.2, hy = 7.6 + b;                        // head centre

    /* --- behind the body --- */
    if (s.girl) {                                          // long hair down the back
      x.beginPath();
      x.moveTo(8.2, 5 + b);
      x.bezierCurveTo(5.2, 9 + b, 5.6 - sway * 0.4, 15 + b, 6.4 - sway * 0.6, 19.4 + b);
      x.quadraticCurveTo(8.6, 20.6 + b, 10.4, 18.6 + b);
      x.lineTo(10.6, 6 + b); x.closePath();
      paint(x, LG(x, 5, 0, 11, 0, [[0, lit(hair, 0.18)], [1, lit(hair, -0.2)]]));
    }
    if (s.bat) {                                           // cricket bat slung on the back
      x.save(); x.translate(6.4, 16.5 + b); x.rotate(-0.42);
      rrect(x, -1.4, -5.5, 2.8, 10.5, 1.1); paint(x, LG(x, -1.4, 0, 1.4, 0, [[0, '#f6dfb2'], [0.5, '#e2c08d'], [1, '#b8925a']]), 0.6);
      rrect(x, -0.6, -10.2, 1.2, 4.9, 0.5); paint(x, '#4e342e', 0.5);
      x.restore();
    }
    if (s.dupatta) {                                       // dupatta tail flowing behind
      x.beginPath();
      x.moveTo(7.8, 12.6 + b);
      x.bezierCurveTo(5.2 - sway, 15 + b, 4.6 - sway * 1.4, 19 + b, 3.6 - sway * 1.6, 22.4 + b);
      x.lineTo(6.0 - sway, 22.6 + b);
      x.bezierCurveTo(6.4, 19 + b, 7.6, 16 + b, 9.4, 13.4 + b);
      x.closePath();
      paint(x, LG(x, 3, 0, 9, 0, [[0, lit(dup, -0.25)], [1, lit(dup, 0.1)]]), 0.6);
    }

    /* --- back arm + legs --- */
    if (armsOut) limb(x, 8.4, 13.8 + b, 4.6, 13.2 + b, 2.4, lit(top, -0.22));
    else limb(x, 8.4, 13.8 + b, 7.4 + aB * 0.4, 18.6 + b + aB, 2.4, lit(top, -0.22));
    ellipse(x, armsOut ? 4.0 : 7.3 + aB * 0.4, armsOut ? 13.2 + b : 19.6 + b + aB, 1.2, 1.2, lit(sk, -0.15), 0.5);

    const legBack = lit(bot, -0.2);
    limb(x, 10.6 + lb * 0.4, 21.2, 10.6 + lb, 28.4 + yb, 3.2, legBack);
    ellipse(x, 11.2 + lb, 29.9 + yb, 2.5, 1.25, LG(x, 0, 28.6 + yb, 0, 31.2 + yb, [[0, lit(p.shoe, 0.1)], [1, lit(p.shoe, -0.45)]]), 0.55);
    limb(x, 13.6 + lf * 0.4, 21.2, 13.6 + lf, 28.4 + yf, 3.2, bot);
    ellipse(x, 14.3 + lf, 29.9 + yf, 2.6, 1.3, LG(x, 0, 28.6 + yf, 0, 31.2 + yf, [[0, lit(p.shoe, 0.35)], [1, lit(p.shoe, -0.3)]]), 0.55);
    gloss(x, 13.4 + lf, 29.3 + yf, 0.9, 0.35, 0.6);

    /* --- torso (kameez / shirt) --- */
    const flare = s.cut === 'long' ? 1.3 : 0.5;
    x.beginPath();
    x.moveTo(8.0, 12.4 + b);
    x.quadraticCurveTo(12.2, 11.4 + b, 16.4, 12.4 + b);
    x.lineTo(16.6 + flare, cutY + b * 0.5);
    x.quadraticCurveTo(12.2, cutY + 0.9 + b * 0.5, 7.8 - flare, cutY + b * 0.5);
    x.closePath();
    paint(x, LG(x, 7, 0, 17.5, 0, [[0, lit(top, 0.3)], [0.35, lit(top, 0.08)], [0.75, top], [1, lit(top, -0.3)]]), 0.7);
    x.save(); x.clip();
    x.fillStyle = LG(x, 0, 12 + b, 0, cutY, [[0, 'rgba(255,255,255,0.18)'], [0.3, 'rgba(255,255,255,0)'], [1, 'rgba(0,0,0,0.12)']]);
    x.fillRect(6, 11 + b, 13, cutY - 10);
    if (s.cut === 'long') { x.strokeStyle = rgba(lit(top, -0.35), 0.6); x.lineWidth = 0.45; x.beginPath(); x.moveTo(10.4, 17 + b); x.lineTo(9.6, cutY); x.moveTo(14.6, 17 + b); x.lineTo(15.4, cutY); x.stroke(); }
    if (s.trim) { x.fillStyle = s.trim; x.fillRect(6, cutY - 1.2 + b * 0.5, 13, 0.9); }
    if (s.vest) {
      x.fillStyle = LG(x, 7, 0, 17, 0, [[0, lit(s.vest, 0.3)], [0.5, s.vest], [1, lit(s.vest, -0.3)]]);
      x.fillRect(7.6, 12 + b, 3.8, 10); x.fillRect(13.2, 12 + b, 3.8, 10);
      x.fillStyle = '#d4af37'; x.fillRect(11.2, 12.6 + b, 0.35, 9); x.fillRect(13.2, 12.6 + b, 0.35, 9);
    }
    x.restore();
    // neckline
    x.beginPath(); x.moveTo(11.0, 12.1 + b); x.lineTo(12.2, 14.4 + b); x.lineTo(13.4, 12.1 + b); x.closePath();
    paint(x, s.trim || lit(sk, -0.05), 0.4);
    if (s.trim) ellipse(x, 13.5, 16 + b, 1.0, 1.0, '#ffffff', 0.4);   // cricket badge
    if (s.buttons) for (let yy = 15; yy < 21; yy += 2) ellipse(x, 12.3, yy + b, 0.45, 0.45, lit(top, 0.45), 0.3);
    if (s.dupatta) {                                       // dupatta draped over the shoulders
      x.beginPath();
      x.moveTo(7.4, 12.4 + b); x.quadraticCurveTo(12.2, 14.6 + b, 16.8, 12.2 + b);
      x.lineTo(17.0, 14.0 + b); x.lineTo(16.2, 19.4 + b); x.lineTo(14.6, 19.2 + b); x.lineTo(15.0, 15.0 + b);
      x.quadraticCurveTo(11.6, 16.2 + b, 7.6, 14.2 + b); x.closePath();
      paint(x, LG(x, 7, 0, 17, 0, [[0, lit(dup, 0.25)], [0.6, dup], [1, lit(dup, -0.25)]]), 0.55);
      if (s.ajrak) {
        x.save(); x.clip();
        for (let i = 0; i < 9; i++) { ellipse(x, 7.8 + i * 1.2, 13.2 + b + (i % 2) * 0.6, 0.35, 0.35, '#1a237e', 0); ellipse(x, 15.6, 15.5 + b + i * 0.5, 0.25, 0.25, '#ffffff', 0); }
        x.restore();
      }
    }

    /* --- front arm --- */
    if (armUp) { limb(x, 16.2, 13.6 + b, 17.0, 8.2 + b, 2.5, top); ellipse(x, 17.1, 7.2 + b, 1.3, 1.3, sphere(x, 17.1, 7.2 + b, 1.3, sk), 0.5); }
    else if (armsOut) { limb(x, 16.2, 13.6 + b, 20.6, 12.8 + b, 2.5, top); ellipse(x, 21.6, 12.8 + b, 1.3, 1.3, sphere(x, 21.6, 12.8 + b, 1.3, sk), 0.5); }
    else { limb(x, 16.2, 13.6 + b, 16.8 + aF * 0.3, 18.6 + b + aF, 2.5, top); ellipse(x, 16.9 + aF * 0.3, 19.7 + b + aF, 1.3, 1.3, sphere(x, 16.9, 19.7 + b + aF, 1.3, sk), 0.5); }

    /* --- head --- */
    rrect(x, 11.2, 11 + b, 2.2, 2, 0.6); paint(x, lit(sk, -0.18), 0);                     // neck
    ellipse(x, hx, hy, 5.3, 5.1, RG(x, hx, hy, 5.6, [[0, lit(sk, 0.32)], [0.55, sk], [1, lit(sk, -0.25)]], hx - 1.8, hy - 2.2, 0.3), 0.75);
    if (!s.girl) ellipse(x, 8.4, hy + 0.6, 1.0, 1.3, lit(sk, -0.12), 0.5);                // ear
    // eyes looking right
    [[12.9, 0.95], [15.7, 0.8]].forEach(([ex, w]) => {
      ellipse(x, ex, hy + 0.4, w, 1.3, '#ffffff', 0.35);
      ellipse(x, ex + 0.25, hy + 0.55, w * 0.68, 0.95, '#2b1d16', 0);
      ellipse(x, ex + 0.05, hy + 0.05, 0.3, 0.3, '#ffffff', 0);
    });
    x.strokeStyle = lit(hair, 0.1); x.lineWidth = 0.55;
    x.beginPath(); x.moveTo(12.0, hy - 1.6); x.lineTo(13.6, hy - 1.9); x.moveTo(15.0, hy - 1.9); x.lineTo(16.4, hy - 1.6); x.stroke();
    x.strokeStyle = '#7b2b20'; x.lineWidth = 0.55; x.beginPath(); x.arc(14.7, hy + 2.0, 1.0, 0.25 * Math.PI, 0.8 * Math.PI); x.stroke();
    ellipse(x, 11.6, hy + 2.0, 0.85, 0.45, 'rgba(235,105,105,0.45)', 0);
    ellipse(x, 16.6, hy + 2.0, 0.6, 0.4, 'rgba(235,105,105,0.4)', 0);

    /* --- hair + caps --- */
    x.beginPath();
    x.moveTo(7.0, hy + 1.6);
    x.bezierCurveTo(6.4, hy - 4.6, 11.0, hy - 6.6, 15.4, hy - 4.6);
    x.quadraticCurveTo(17.6, hy - 3.4, 17.4, hy - 1.4);
    x.quadraticCurveTo(16.2, hy - 2.0, 15.6, hy - 2.8);               // fringe
    x.quadraticCurveTo(14.6, hy - 1.8, 13.4, hy - 2.6);
    x.quadraticCurveTo(11.6, hy - 1.8, 10.4, hy - 2.4);
    x.quadraticCurveTo(9.8, hy - 0.6, 9.6, hy + 1.4);
    x.closePath();
    paint(x, RG(x, 10.5, hy - 3.6, 7.5, [[0, lit(hair, 0.35)], [0.5, hair], [1, lit(hair, -0.3)]], 10, hy - 4.4, 0.4), 0.7);
    x.strokeStyle = rgba('#ffffff', 0.35); x.lineWidth = 0.6;
    x.beginPath(); x.arc(11.6, hy - 1.2, 3.6, 1.15 * Math.PI, 1.55 * Math.PI); x.stroke();          // hair shine
    if (s.girl) { x.beginPath(); x.moveTo(16.4, hy - 2.6); x.quadraticCurveTo(17.8, hy + 1, 17.0, hy + 3.4); x.lineTo(16.2, hy + 1); x.closePath(); paint(x, lit(hair, -0.05), 0.5); }

    if (s.cap === 'cricket') {
      x.beginPath(); x.ellipse(12.4, hy - 2.4, 5.6, 4.0, 0, Math.PI, 0); x.closePath();
      paint(x, RG(x, 12.4, hy - 3, 6, [[0, lit(p.cap, 0.4)], [0.6, p.cap], [1, lit(p.cap, -0.35)]], 10.6, hy - 5.2, 0.3), 0.7);
      x.beginPath(); x.ellipse(17.6, hy - 2.2, 3.4, 0.9, 0.05, 0, Math.PI * 2); paint(x, LG(x, 0, hy - 3, 0, hy - 1.2, [[0, lit(p.cap, 0.1)], [1, lit(p.cap, -0.45)]]), 0.6);
      ellipse(x, 12.4, hy - 6.3, 0.6, 0.45, lit(p.cap, -0.2), 0.4);
      ellipse(x, 13.2, hy - 4.2, 0.7, 0.55, '#ffffff', 0);
    } else if (s.cap === 'topi') {
      rrect(x, 7.2, hy - 7.0, 10.0, 4.6, 1.4);
      paint(x, LG(x, 7, 0, 17.2, 0, [[0, lit(p.cap, 0.35)], [0.5, p.cap], [1, lit(p.cap, -0.35)]]), 0.7);
      x.fillStyle = '#d4af37'; x.fillRect(7.4, hy - 3.5, 9.6, 0.8);
      for (let i = 0; i < 5; i++) ellipse(x, 8.4 + i * 2, hy - 5.2, 0.35, 0.35, '#e8c560', 0);
    } else if (s.cap === 'pakol') {
      rrect(x, 6.2, hy - 4.6, 12.2, 2.8, 1.4);
      paint(x, LG(x, 0, hy - 4.6, 0, hy - 1.8, [[0, lit(p.cap, 0.05)], [1, lit(p.cap, -0.4)]]), 0.7);
      x.beginPath(); x.ellipse(12.3, hy - 5.0, 6.4, 2.2, 0, 0, Math.PI * 2);
      paint(x, RG(x, 12.3, hy - 5, 6.5, [[0, lit(p.cap, 0.35)], [1, lit(p.cap, -0.15)]], 10.4, hy - 6, 0.3), 0.7);
    }
  });
}

/* ---- enemies ---- */

function drawKawwa(f) {    // house crow, faces right

/* ---- Pakistan flag (waving, shaded per column) ---- */
function drawPkFlag(phase) {
  const w = 30, h = 20;
  const flat = hiArt(w, h, x => {
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, 7.5, h);
    x.fillStyle = '#01411c'; x.fillRect(7.5, 0, w - 7.5, h);
    x.fillStyle = '#ffffff'; x.beginPath(); x.arc(19, 10, 6, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#01411c'; x.beginPath(); x.arc(21, 8.5, 5.2, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#ffffff'; x.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 1.1 : 2.6, a = -Math.PI / 2 + i * Math.PI / 5 + 0.5;
      const px = 23 + Math.cos(a) * r, py = 7 + Math.sin(a) * r;
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.fill();
  });
  return hiArt(w + 2, h + 6, o => {
    o.setTransform(1, 0, 0, 1, 0, 0);
    const cols = w * S;
    for (let c = 0; c < cols; c++) {
      const xw = c / S;
      const off = Math.sin(phase + xw * 0.32) * 2 * (xw / w) * S;
      const lt = Math.cos(phase + xw * 0.32);
      o.drawImage(flat, c, 0, 1, h * S, c, 3 * S + off, 1, h * S);
      o.fillStyle = lt > 0 ? `rgba(255,255,255,${lt * 0.16})` : `rgba(0,0,0,${-lt * 0.25})`;
      o.fillRect(c, 3 * S + off, 1, h * S);
    }
  });
}

/* ---- level tiles + backgrounds, themed per world ---- */
const THEMES = ['lahore', 'karachi', 'thar'];
const themeOf = L => THEMES[(L.world - 1) % THEMES.length];

/** a single bevelled brick/block: lit top-left edge, shadowed bottom-right edge */
function bevelBlock(x, X, Y, W, H, col, depth = 0.8) {
  x.fillStyle = LG(x, X, Y, X + W * 0.4, Y + H, [[0, lit(col, 0.12)], [1, lit(col, -0.08)]]);
  x.fillRect(X, Y, W, H);
  x.fillStyle = rgba('#ffffff', 0.3); x.fillRect(X, Y, W, depth * 0.6); x.fillRect(X, Y, depth * 0.5, H);
  x.fillStyle = rgba('#000000', 0.28); x.fillRect(X, Y + H - depth * 0.6, W, depth * 0.6); x.fillRect(X + W - depth * 0.5, Y, depth * 0.5, H);
}

function drawTiles(scene, L) {
  const th = themeOf(L), id = L.id;
  const r = rng(L.world * 77);
  if (th === 'lahore') {
    const bricks = (x, y0, rows) => {
      for (let row = 0; row < rows; row++) {
        const off = row % 2 ? 4 : 0;
        for (let bx = -off; bx < 16; bx += 8) bevelBlock(x, bx + 0.35, y0 + row * 4 + 0.35, 7.3, 3.3, ['#b4513a', '#c25d42', '#a84a34', '#bf5a3f'][Math.floor(r() * 4)]);
      }
    };
    makeTex(scene, `gtop-${id}`, 16, 16, x => {
      x.fillStyle = '#e3cfa9'; x.fillRect(0, 0, 16, 16); bricks(x, 5, 3);
      x.fillStyle = LG(x, 0, 0, 0, 5, [[0, '#f7e6c4'], [0.45, '#e2c391'], [1, '#b8915c']]); x.fillRect(0, 0, 16, 5);   // stone cornice
      x.fillStyle = rgba('#ffffff', 0.55); x.fillRect(0, 0, 16, 0.6);
      x.fillStyle = rgba('#000000', 0.35); x.fillRect(0, 4.4, 16, 0.6);
      x.fillStyle = rgba('#000000', 0.12); x.fillRect(0, 5, 16, 1.2);
    });
    makeTex(scene, `gfill-${id}`, 16, 16, x => { x.fillStyle = '#d6c09a'; x.fillRect(0, 0, 16, 16); bricks(x, 0, 4); });
    makeTex(scene, `plat-${id}`, 16, 16, x => {               // carved wooden jharoka ledge
      x.fillStyle = LG(x, 0, 0, 0, 5.5, [[0, '#c48a5a'], [0.25, '#9a6236'], [1, '#5e3519']]); x.fillRect(0, 0, 16, 5.5);
      x.fillStyle = rgba('#ffffff', 0.4); x.fillRect(0, 0, 16, 0.6);
      x.fillStyle = rgba('#000000', 0.4); x.fillRect(0, 5.0, 16, 0.6);
      x.beginPath(); x.moveTo(2, 5.5); x.lineTo(14, 5.5); x.quadraticCurveTo(11, 8, 9.2, 12.6); x.lineTo(6.8, 12.6); x.quadraticCurveTo(5, 8, 2, 5.5); x.closePath();
      paint(x, LG(x, 2, 0, 14, 0, [[0, '#8a5530'], [0.5, '#6d3f22'], [1, '#4a2914']]), 0.5);
      ellipse(x, 3.5, 2.6, 0.9, 0.9, sphere(x, 3.5, 2.6, 0.9, '#e0a43a'), 0.3);
      ellipse(x, 12.5, 2.6, 0.9, 0.9, sphere(x, 12.5, 2.6, 0.9, '#e0a43a'), 0.3);
    });
  } else if (th === 'karachi') {
    makeTex(scene, `gtop-${id}`, 16, 16, x => {
      x.fillStyle = LG(x, 0, 0, 0, 16, [[0, '#fff3d0'], [0.3, '#f1d9a0'], [0.4, '#d9b978'], [1, '#c9a564']]); x.fillRect(0, 0, 16, 16);
      x.fillStyle = rgba('#ffffff', 0.6); x.fillRect(0, 0, 16, 0.6);
      x.strokeStyle = rgba('#c49a55', 0.6); x.lineWidth = 0.4;
      for (let i = 0; i < 3; i++) { x.beginPath(); x.moveTo(r() * 6, 1.5 + i * 1.2); x.quadraticCurveTo(8, 1 + i * 1.2, 10 + r() * 6, 1.6 + i * 1.2); x.stroke(); }
      for (let i = 0; i < 14; i++) ellipse(x, r() * 16, 6 + r() * 10, 0.3, 0.3, r() > 0.5 ? '#b08a4a' : '#fff0c4', 0);
      if (r() > 0.3) { x.save(); x.translate(10, 11); x.rotate(0.4); ellipse(x, 0, 0, 1.4, 1.0, sphere(x, 0, 0, 1.4, '#f48fb1'), 0.3); x.restore(); }
    });
    makeTex(scene, `gfill-${id}`, 16, 16, x => {
      x.fillStyle = '#c9a564'; x.fillRect(0, 0, 16, 16);
      x.fillStyle = rgba('#000000', 0.07); x.fillRect(0, 6, 16, 4);
      x.fillStyle = rgba('#ffffff', 0.08); x.fillRect(0, 12, 16, 2);
      for (let i = 0; i < 12; i++) ellipse(x, r() * 16, r() * 16, 0.32, 0.32, r() > 0.5 ? '#a98748' : '#e2c891', 0);
    });
    makeTex(scene, `plat-${id}`, 16, 16, x => {               // glossy truck-art painted board
      rrect(x, 0, 0, 16, 6.6, 0.6);
      x.fillStyle = LG(x, 0, 0, 0, 6.6, [[0, '#26a69a'], [1, '#00695c']]); x.fill();
      x.fillStyle = '#fdd835'; x.fillRect(0, 1.6, 16, 0.8);
      x.fillStyle = '#e53935'; x.fillRect(0, 4.6, 16, 0.8);
      [[3.5, '#ffffff'], [8, '#f06292'], [12.5, '#ffffff']].forEach(([cx, c]) => ellipse(x, cx, 3.3, 0.9, 0.9, sphere(x, cx, 3.3, 0.9, c), 0.25));
      x.fillStyle = rgba('#ffffff', 0.35); x.fillRect(0, 0, 16, 0.7);
      x.fillStyle = rgba('#000000', 0.35); x.fillRect(0, 6.0, 16, 0.6);
      [[2.4], [12.4]].forEach(([px]) => { x.fillStyle = LG(x, px, 0, px + 1.8, 0, [[0, '#8d6e63'], [1, '#4e342e']]); x.fillRect(px, 6.6, 1.8, 6); });
    });
  } else {
    makeTex(scene, `gtop-${id}`, 16, 16, x => {
      x.fillStyle = '#c08f52'; x.fillRect(0, 0, 16, 16);
      x.fillStyle = LG(x, 0, 0, 0, 5, [[0, '#ffe3ad'], [1, '#e2b06c']]); x.fillRect(0, 0, 16, 5);
      x.strokeStyle = rgba('#b88446', 0.7); x.lineWidth = 0.4;
      x.beginPath(); x.moveTo(0, 2); x.quadraticCurveTo(8, 1.2, 16, 2); x.moveTo(0, 3.6); x.quadraticCurveTo(8, 2.8, 16, 3.6); x.stroke();
      x.fillStyle = rgba('#000000', 0.25); x.fillRect(0, 5, 16, 0.7);
      bevelBlock(x, 0.3, 6, 7.4, 4.7, '#c99558'); bevelBlock(x, 8.3, 6, 7.4, 4.7, '#bf8c4f');
      bevelBlock(x, -3.7, 11.2, 7.4, 4.5, '#c49152'); bevelBlock(x, 4.3, 11.2, 7.4, 4.5, '#cc9a5c'); bevelBlock(x, 12.3, 11.2, 7.4, 4.5, '#c49152');
    });
    makeTex(scene, `gfill-${id}`, 16, 16, x => {
      x.fillStyle = '#a87a42'; x.fillRect(0, 0, 16, 16);
      bevelBlock(x, 0.3, 0.3, 7.4, 7.4, '#c49152', 1); bevelBlock(x, 8.3, 0.3, 7.4, 7.4, '#bb894c', 1);
      bevelBlock(x, -3.7, 8.3, 7.4, 7.4, '#bf8c4f', 1); bevelBlock(x, 4.3, 8.3, 7.4, 7.4, '#c99558', 1); bevelBlock(x, 12.3, 8.3, 7.4, 7.4, '#bf8c4f', 1);
    });
    makeTex(scene, `plat-${id}`, 16, 16, x => {               // ancient baked-brick slab
      bevelBlock(x, 0.2, 0.2, 7.6, 3.6, '#c4703f'); bevelBlock(x, 8.2, 0.2, 7.6, 3.6, '#b8663a');
      bevelBlock(x, -3.8, 4.2, 7.6, 3.6, '#ad5e34'); bevelBlock(x, 4.2, 4.2, 7.6, 3.6, '#c4703f'); bevelBlock(x, 12.2, 4.2, 7.6, 3.6, '#ad5e34');
      x.beginPath(); x.moveTo(3, 8); x.lineTo(13, 8); x.lineTo(11, 10.6); x.lineTo(5, 10.6); x.closePath();
      paint(x, LG(x, 0, 8, 0, 10.6, [[0, '#8c4a28'], [1, '#5e2f17']]), 0.4);
    });
  }
}

/* silhouettes used by the backgrounds */
function drawPalm(x, px, py, s = 1) {
  x.beginPath(); x.moveTo(px - 1.6, py);
  x.quadraticCurveTo(px + 5 * s, py - 18 * s, px + 2 * s, py - 34 * s);
  x.lineTo(px + 4.2 * s, py - 34 * s); x.quadraticCurveTo(px + 7.4 * s, py - 18 * s, px + 1.6, py); x.closePath();
  paint(x, LG(x, px - 2, 0, px + 7 * s, 0, [[0, '#a07850'], [0.5, '#7b5a3a'], [1, '#4e3620']]), 0.6);
  const tx = px + 3 * s, ty = py - 34 * s;
  [[-15, 5], [-11, 10], [13, 6], [10, 11], [1, -6], [-5, 12], [5, 13]].forEach(([dx, dy], i) => {
    x.beginPath(); x.moveTo(tx, ty);
    x.quadraticCurveTo(tx + dx * 0.5 * s, ty + dy * 0.2 * s - 6 * s, tx + dx * s, ty + dy * s);
    x.quadraticCurveTo(tx + dx * 0.45 * s, ty + dy * 0.3 * s - 2.4 * s, tx, ty + 1.6 * s);
    paint(x, LG(x, tx, ty - 6 * s, tx + dx * s, ty + dy * s, [[0, '#66bb6a'], [1, i % 2 ? '#1b5e20' : '#2e7d32']]), 0.5);
  });
  ellipse(x, tx, ty + 1, 2 * s, 1.6 * s, sphere(x, tx, ty + 1, 2 * s, '#795548'), 0.4);
}
function drawCamel(x, px, py, col) {
  x.beginPath();
  x.moveTo(px, py - 8); x.quadraticCurveTo(px + 2, py - 15, px + 6, py - 16); x.quadraticCurveTo(px + 10, py - 18, px + 13, py - 13);
  x.lineTo(px + 16.5, py - 13); x.lineTo(px + 17, py - 21); x.quadraticCurveTo(px + 19, py - 24, px + 22.5, py - 21.5);
  x.lineTo(px + 22.5, py - 20); x.lineTo(px + 19.2, py - 19.6); x.lineTo(px + 19, py - 11); x.quadraticCurveTo(px + 18, py - 7, px + 15, py - 7);
  x.lineTo(px + 3, py - 7); x.closePath();
  paint(x, LG(x, 0, py - 22, 0, py - 6, [[0, lit(col, 0.25)], [1, lit(col, -0.25)]]), 0.6);
  [1.2, 4.2, 12, 15].forEach(dx => limb(x, px + dx, py - 7.5, px + dx + 0.3, py - 0.5, 1.4, lit(col, -0.1)));
  rrect(x, px + 3.4, py - 15, 10.6, 3, 1); paint(x, LG(x, 0, py - 15, 0, py - 12, [[0, '#ef5350'], [1, '#b71c1c']]), 0.5);
  for (let i = 0; i < 5; i++) ellipse(x, px + 4.6 + i * 2.1, py - 11.6, 0.5, 0.5, '#fdd835', 0.2);
}
function drawKikar(x, px, py, col) {
  limb(x, px, py, px + 0.6, py - 18, 1.8, '#5d4630');
  limb(x, px + 0.4, py - 12, px - 5, py - 19, 1, '#5d4630');
  limb(x, px + 0.5, py - 14, px + 6, py - 20, 1, '#5d4630');
  x.beginPath(); x.ellipse(px, py - 22, 14, 3.6, 0, 0, Math.PI * 2);
  paint(x, LG(x, 0, py - 26, 0, py - 18.5, [[0, lit(col, 0.3)], [1, lit(col, -0.3)]]), 0.6);
  x.beginPath(); x.ellipse(px + 1, py - 25, 9, 2.6, 0, 0, Math.PI * 2);
  paint(x, LG(x, 0, py - 28, 0, py - 22.5, [[0, lit(col, 0.45)], [1, col]]), 0.5);
}
/** 3D building: front face, darker side face and a lit roof */
function building(x, bx, by, bw, bh, col, depth = 5) {
  x.beginPath(); x.moveTo(bx + bw, by); x.lineTo(bx + bw + depth, by - depth * 0.6); x.lineTo(bx + bw + depth, by + bh); x.lineTo(bx + bw, by + bh); x.closePath();
  paint(x, LG(x, bx + bw, 0, bx + bw + depth, 0, [[0, lit(col, -0.3)], [1, lit(col, -0.42)]]), 0.5);
  x.beginPath(); x.moveTo(bx, by); x.lineTo(bx + depth, by - depth * 0.6); x.lineTo(bx + bw + depth, by - depth * 0.6); x.lineTo(bx + bw, by); x.closePath();
  paint(x, lit(col, 0.28), 0.5);
  x.beginPath(); x.rect(bx, by, bw, bh);
  paint(x, LG(x, bx, by, bx + bw, by + bh, [[0, lit(col, 0.14)], [1, lit(col, -0.1)]]), 0.5);
}

function buildLevelArt(scene, L) {
  const id = L.id, th = themeOf(L);
  if (scene.textures.exists(`sky-${id}`)) return;
  drawTiles(scene, L);
  const r = rng(L.world * 131);
  const skyTop = th === 'thar' ? '#f2a65a' : th === 'karachi' ? '#3d8fd1' : '#5a8fc8';
  const skyBot = th === 'thar' ? '#fff0c8' : th === 'karachi' ? '#cdeefc' : '#fbe8c8';
  const haze = th === 'thar' ? '#ffe2b0' : th === 'karachi' ? '#d8f1fb' : '#f5dcc0';

  makeTex(scene, `sky-${id}`, GAME_WIDTH, CAM_H, (x, w, h) => {
    x.fillStyle = LG(x, 0, 0, 0, h, [[0, skyTop], [0.65, mix(skyTop, skyBot, 0.7)], [1, skyBot]]); x.fillRect(0, 0, w, h);
    x.globalCompositeOperation = 'lighter';                     // soft sun rays
    for (let i = 0; i < 6; i++) {
      x.beginPath(); x.moveTo(400, 40);
      const a = 1.95 + i * 0.24, len = 260;
      x.lineTo(400 + Math.cos(a) * len, 40 + Math.sin(a) * len); x.lineTo(400 + Math.cos(a + 0.06) * len, 40 + Math.sin(a + 0.06) * len); x.closePath();
      x.fillStyle = LG(x, 400, 40, 400 + Math.cos(a) * len, 40 + Math.sin(a) * len, [[0, 'rgba(255,240,200,0.10)'], [1, 'rgba(255,240,200,0)']]); x.fill();
    }
    x.globalCompositeOperation = 'source-over';
  });

  const hazeOver = (x, w, h, a) => { x.fillStyle = LG(x, 0, 0, 0, h, [[0, rgba(haze, 0)], [1, rgba(haze, a)]]); x.fillRect(0, 0, w, h); };

  if (th === 'lahore') {
    makeTex(scene, `far-${id}`, 480, 150, (x, w, h) => {
      const col = '#9d8fc2', dk = '#857aaa', base = h - 14;
      x.fillStyle = LG(x, 0, base - 30, 0, h, [[0, lit(col, 0.1)], [1, col]]);
      for (let bx = 0; bx < w; bx += 12) x.fillRect(bx, h - 14 - Math.floor(r() * 14), 12, 40);
      // Minar-e-Pakistan: cylinder shading
      const mx = 330;
      const cyl = (yTop, hgt, half) => { x.fillStyle = LG(x, mx - half, 0, mx + half, 0, [[0, lit(col, 0.25)], [0.4, col], [1, dk]]); x.fillRect(mx - half, yTop, half * 2, hgt); };
      x.fillStyle = LG(x, mx - 26, 0, mx + 26, 0, [[0, lit(col, 0.2)], [1, dk]]); x.fillRect(mx - 26, base - 6, 52, 8); x.fillRect(mx - 18, base - 12, 36, 6);
      for (let y = 0; y < 110; y += 2) cyl(base - 12 - y - 2, 2.2, 8 - (y / 110) * 5);
      [30, 62, 92].forEach(y => cyl(base - 12 - y - 3, 3, 8.5 - (y / 110) * 5));
      x.beginPath(); x.arc(mx, base - 123, 5, Math.PI, 0); x.fillStyle = RG(x, mx, base - 124, 5, [[0, lit(col, 0.35)], [1, col]], mx - 2, base - 126, 0.3); x.fill();
      x.fillStyle = col; x.fillRect(mx - 0.5, base - 134, 1, 8);
      // Mughal-style monument
      const fx = 110;
      x.fillStyle = LG(x, fx - 40, 0, fx + 40, 0, [[0, lit(col, 0.15)], [1, dk]]); x.fillRect(fx - 40, base - 30, 80, 30);
      for (let i = -3; i <= 3; i++) { x.fillStyle = dk; x.fillRect(fx + i * 10 - 3, base - 22, 6, 16); x.beginPath(); x.arc(fx + i * 10, base - 22, 3, Math.PI, 0); x.fill(); }
      x.beginPath(); x.ellipse(fx, base - 44, 17, 16, 0, Math.PI, 0); x.fillStyle = RG(x, fx, base - 46, 18, [[0, lit(col, 0.35)], [1, col]], fx - 6, base - 54, 1); x.fill();
      x.fillStyle = col; x.fillRect(fx - 15, base - 44, 30, 14); x.fillRect(fx - 0.5, base - 66, 1, 8);
      [-28, 28].forEach(dx => { x.beginPath(); x.arc(fx + dx, base - 36, 6, Math.PI, 0); x.fillStyle = RG(x, fx + dx, base - 37, 6, [[0, lit(col, 0.3)], [1, col]], fx + dx - 2, base - 40, 0.2); x.fill(); x.fillStyle = col; x.fillRect(fx + dx - 5, base - 36, 10, 6); });
      [-44, 44].forEach(dx => { x.fillStyle = LG(x, fx + dx - 3, 0, fx + dx + 3, 0, [[0, lit(col, 0.2)], [1, dk]]); x.fillRect(fx + dx - 3, base - 72, 6, 72); x.beginPath(); x.arc(fx + dx, base - 72, 4, Math.PI, 0); x.fill(); x.fillStyle = dk; x.fillRect(fx + dx - 4, base - 52, 8, 2); });
      hazeOver(x, w, h, 0.55);
    });
    makeTex(scene, `mid-${id}`, 480, 110, (x, w, h) => {
      const cols = ['#d4805f', '#e4aa6c', '#c06a5c', '#e8c08e', '#d39470', '#b86b54', '#e59a74'];
      let bx = 0;
      while (bx < w) {
        let bw = 34 + Math.floor(r() * 32);
        if (w - bx - bw < 30) bw = w - bx - 5;
        const bh = 40 + Math.floor(r() * 50), col = cols[Math.floor(r() * cols.length)], y0 = h - bh;
        building(x, bx, y0, bw, bh + 2, col, 5);
        for (let cx = bx + 2; cx < bx + bw - 3; cx += 6) { x.fillStyle = lit(col, 0.12); x.fillRect(cx, y0 - 3, 3, 3); }
        for (let wy = y0 + 8; wy < h - 10; wy += 16)
          for (let wx = bx + 6; wx < bx + bw - 10; wx += 12) {
            const on = r() > 0.72;
            x.beginPath(); x.moveTo(wx, wy + 10); x.lineTo(wx, wy + 3); x.arc(wx + 3, wy + 3, 3, Math.PI, 0); x.lineTo(wx + 6, wy + 10); x.closePath();
            x.fillStyle = on ? RG(x, wx + 3, wy + 6, 6, [[0, '#fff2b0'], [1, '#f2a93b']]) : LG(x, 0, wy, 0, wy + 10, [[0, '#2b1b18'], [1, '#4f342c']]);
            x.fill(); x.lineWidth = 0.6; x.strokeStyle = lit(col, 0.3); x.stroke();
            x.fillStyle = lit(col, -0.25); x.fillRect(wx - 1, wy + 10, 8, 1.2);
          }
        if (bw > 44 && r() > 0.35) {                                       // jharoka balcony (3D box + dome)
          const jx = bx + Math.floor(bw / 2) - 8, jy = y0 + 18;
          rrect(x, jx, jy, 16, 12, 1); paint(x, LG(x, jx, 0, jx + 16, 0, [[0, '#9a6236'], [1, '#5e3519']]), 0.5);
          rrect(x, jx + 2.5, jy + 2.5, 11, 6.5, 0.5); paint(x, '#2e1c12', 0);
          rrect(x, jx - 1.5, jy + 12, 19, 2.4, 0.6); paint(x, '#b07a4e', 0.4);
          x.beginPath(); x.arc(jx + 8, jy, 8, Math.PI, 0); paint(x, RG(x, jx + 8, jy - 1, 8, [[0, '#c48a5a'], [1, '#6d3f22']], jx + 5, jy - 5, 0.5), 0.5);
        }
        if (r() > 0.5) { rrect(x, bx + 6, y0 - 10, 9, 8, 1.5); paint(x, LG(x, bx + 6, 0, bx + 15, 0, [[0, '#5f6e75'], [1, '#2f3b40']]), 0.4); }  // water tank
        bx += bw + 5;
      }
      hazeOver(x, w, h, 0.12);
    });
  } else if (th === 'karachi') {
    makeTex(scene, `far-${id}`, 480, 150, (x, w, h) => {
      const col = '#8eabc6';
      for (let bx = 0; bx < w;) {
        const bw = 14 + Math.floor(r() * 18), bh = 30 + Math.floor(r() * 70);
        if (bx + bw > 300 && bx < 420) { bx = 420; continue; }
        const ww = Math.min(bw, w - bx - 4);
        building(x, bx, h - bh, ww, bh, col, 3);
        x.fillStyle = 'rgba(220,240,255,0.55)';
        for (let wy = h - bh + 4; wy < h - 4; wy += 5) for (let wx = bx + 2; wx < bx + ww - 2; wx += 4) if (r() > 0.45) x.fillRect(wx, wy, 2, 2.4);
        bx += bw + 4;
      }
      // Mazar-e-Quaid: white marble, curved dome
      const mx = 360;
      x.fillStyle = LG(x, mx - 30, 0, mx + 30, 0, [[0, '#ffffff'], [0.6, '#e8eef2'], [1, '#b9c7d2']]); x.fillRect(mx - 30, h - 34, 60, 34);
      x.beginPath(); x.moveTo(mx - 7, h - 6); x.lineTo(mx - 7, h - 26); x.arc(mx, h - 26, 7, Math.PI, 0); x.lineTo(mx + 7, h - 6); x.closePath();
      x.fillStyle = LG(x, 0, h - 33, 0, h - 6, [[0, '#7d93a6'], [1, '#a7b8c6']]); x.fill();
      x.beginPath(); x.moveTo(mx - 22, h - 34); x.quadraticCurveTo(mx - 20, h - 74, mx, h - 76); x.quadraticCurveTo(mx + 20, h - 74, mx + 22, h - 34); x.closePath();
      x.fillStyle = RG(x, mx, h - 50, 30, [[0, '#ffffff'], [0.6, '#eef3f6'], [1, '#aebfcc']], mx - 8, h - 66, 2); x.fill();
      x.fillStyle = '#c7d3dc'; x.fillRect(mx - 34, h - 4, 68, 4);
      hazeOver(x, w, h, 0.45);
    });
    makeTex(scene, `mid-${id}`, 480, 84, (x, w, h) => {
      const top = 14;
      x.fillStyle = LG(x, 0, top, 0, h, [[0, '#7fd0ec'], [0.15, '#47a9d4'], [1, '#155f8c']]); x.fillRect(0, top, w, h - top);
      x.fillStyle = 'rgba(255,255,255,0.75)'; x.fillRect(0, top, w, 1);
      for (let i = 0; i < 90; i++) {
        const wx = r() * w, wy = top + 4 + r() * (h - top - 8), len = 3 + r() * 8;
        x.strokeStyle = `rgba(255,255,255,${0.25 + r() * 0.45})`; x.lineWidth = 0.6;
        x.beginPath(); x.moveTo(wx, wy); x.quadraticCurveTo(wx + len / 2, wy - 1, wx + len, wy); x.stroke();
      }
      for (let i = 0; i < 25; i++) ellipse(x, r() * w, top + 3 + r() * 30, 0.6, 0.6, 'rgba(255,255,240,0.9)', 0);
      // cargo ship
      x.beginPath(); x.moveTo(138, top - 3); x.lineTo(176, top - 3); x.lineTo(172, top + 2); x.lineTo(142, top + 2); x.closePath();
      paint(x, LG(x, 0, top - 3, 0, top + 2, [[0, '#546e7a'], [1, '#263238']]), 0.4);
      x.fillStyle = '#c62828'; x.fillRect(141, top - 0.5, 32, 1);
      rrect(x, 150, top - 9, 14, 6, 0.6); paint(x, LG(x, 150, 0, 164, 0, [[0, '#ffffff'], [1, '#b0bec5']]), 0.4);
      rrect(x, 157.5, top - 14, 3, 5, 0.4); paint(x, '#e53935', 0.3);
    });
    makeTex(scene, `near-${id}`, 480, 90, (x, w, h) => {
      drawPalm(x, 40, h, 1.4); drawPalm(x, 72, h, 1.1); drawPalm(x, 262, h, 1.5);
      drawCamel(x, 326, h, '#a07850');
      [[150, '#e53935'], [400, '#1e88e5']].forEach(([ux, uc]) => {
        limb(x, ux, h, ux, h - 30, 1.2, '#6d4c41');
        x.beginPath(); x.moveTo(ux - 15, h - 27); x.quadraticCurveTo(ux, h - 40, ux + 15, h - 27); x.closePath();
        x.save(); x.clip();
        for (let i = -15; i < 15; i += 6) { x.fillStyle = (i / 6) % 2 ? uc : '#ffffff'; x.fillRect(ux + i, h - 42, 3, 16); x.fillStyle = (i / 6) % 2 ? '#ffffff' : uc; x.fillRect(ux + i + 3, h - 42, 3, 16); }
        x.fillStyle = LG(x, ux - 15, 0, ux + 15, 0, [[0, 'rgba(255,255,255,0.25)'], [1, 'rgba(0,0,0,0.3)']]); x.fillRect(ux - 15, h - 42, 30, 16);
        x.restore();
        x.beginPath(); x.moveTo(ux - 15, h - 27); x.quadraticCurveTo(ux, h - 40, ux + 15, h - 27); x.closePath(); x.lineWidth = 0.6; x.strokeStyle = OUT; x.stroke();
      });
    });
  } else {
    makeTex(scene, `far-${id}`, 480, 150, (x, w, h) => {
      x.beginPath(); x.moveTo(0, h);
      for (let px = 0; px <= w; px += 2) x.lineTo(px, h - 40 - Math.sin(px * Math.PI * 2 / 240) * 18 - Math.sin(px * Math.PI * 2 / 160 + 1) * 10);
      x.lineTo(w, h); x.closePath();
      x.fillStyle = LG(x, 0, h - 70, 0, h, [[0, '#f8d7a6'], [1, '#e8b47a']]); x.fill();
      hazeOver(x, w, h, 0.45);
    });
    makeTex(scene, `mid-${id}`, 480, 110, (x, w, h) => {
      const dune = px => h - 26 - Math.sin(px * Math.PI * 2 / 480) * 14 - Math.sin(px * Math.PI * 2 / 96) * 4;
      x.beginPath(); x.moveTo(0, h); for (let px = 0; px <= w; px += 2) x.lineTo(px, dune(px)); x.lineTo(w, h); x.closePath();
      x.fillStyle = LG(x, 0, h - 45, 0, h, [[0, '#f0bd7c'], [1, '#d39557']]); x.fill();
      for (let px = 0; px < w; px += 2) {                                 // shaded lee sides of the dunes
        const slope = dune(px + 2) - dune(px);
        if (slope > 0) { x.fillStyle = `rgba(150,80,30,${Math.min(0.28, slope * 0.3)})`; x.fillRect(px, dune(px), 2, h - dune(px)); }
      }
      // Mohenjo-daro style mound + stupa
      const sx = 250, base = h - 22;
      x.save();
      x.beginPath(); x.moveTo(sx - 70, base); x.lineTo(sx - 40, base - 34); x.lineTo(sx + 40, base - 34); x.lineTo(sx + 70, base); x.closePath();
      x.fillStyle = LG(x, sx - 70, 0, sx + 70, 0, [[0, '#d4835a'], [0.6, '#b5653f'], [1, '#8a4627']]); x.fill(); x.clip();
      for (let y = base - 32; y < base; y += 4) {
        x.fillStyle = 'rgba(80,30,10,0.35)'; x.fillRect(sx - 70, y, 140, 0.7);
        for (let bx = sx - 70; bx < sx + 70; bx += 8) x.fillRect(bx + ((y / 4) % 2) * 4, y, 0.7, 4);
      }
      x.restore();
      x.beginPath(); x.arc(sx, base - 34, 18, Math.PI, 0); x.fillStyle = RG(x, sx, base - 36, 19, [[0, '#e49a70'], [1, '#9c5230']], sx - 7, base - 46, 1); x.fill();
      x.fillStyle = '#94502f'; x.fillRect(sx - 1, base - 58, 2, 6);
      for (let i = 0; i < 6; i++) bevelBlock(x, 60 + i * 14, base - 6 - (i % 3) * 5, 10, 8 + (i % 3) * 5, '#c4703f', 1.2);
      drawKikar(x, 410, base + 4, '#7b8a46');
      drawCamel(x, 140, base - 2, '#a07850');
      hazeOver(x, w, h, 0.1);
    });
    makeTex(scene, `near-${id}`, 480, 60, (x, w, h) => {
      const dune = px => h - 16 - Math.sin(px * Math.PI * 2 / 240 + 2) * 9;
      x.beginPath(); x.moveTo(0, h); for (let px = 0; px <= w; px += 2) x.lineTo(px, dune(px)); x.lineTo(w, h); x.closePath();
      x.fillStyle = LG(x, 0, h - 26, 0, h, [[0, '#e6aa62'], [1, '#c4874a']]); x.fill();
      [70, 190, 330, 440].forEach(cx => {                                 // cacti
        const g = LG(x, cx - 1.6, 0, cx + 1.6, 0, [[0, '#8bc34a'], [1, '#33691e']]);
        rrect(x, cx - 1.6, h - 30, 3.2, 16, 1.6); paint(x, g, 0.5);
        rrect(x, cx - 5, h - 26, 2.4, 6, 1.2); paint(x, g, 0.5); rrect(x, cx - 5, h - 22, 4, 2, 1); paint(x, g, 0);
        rrect(x, cx + 3, h - 28, 2.4, 6, 1.2); paint(x, g, 0.5); rrect(x, cx + 1.4, h - 23, 4, 2, 1); paint(x, g, 0);
      });
    });
  }
}

function buildTextures(scene) {

    addSheet(scene, h.id, FW, FH, frames);
  });
  addSheet(scene, 'goon', 16, 16, [drawGoon(0), drawGoon(1)]);
  addSheet(scene, 'machhar', 16, 16, [drawMachhar(0), drawMachhar(1)]);
  addSheet(scene, 'kawwa', 20, 16, [drawKawwa(0), drawKawwa(1)]);

  makeTex(scene, 'jalebi', 13, 13, x => {
    const path = () => { x.beginPath(); for (let t = 0; t < 2.25 * Math.PI * 2; t += 0.08) { const rr = 0.7 + t * 0.36, px = 6.5 + Math.cos(t) * rr, py = 6.5 + Math.sin(t) * rr; t ? x.lineTo(px, py) : x.moveTo(px, py); } };
    path(); x.strokeStyle = '#7a3300'; x.lineWidth = 2.5; x.stroke();
    path(); x.strokeStyle = LG(x, 0, 0, 13, 13, [[0, '#ffcc5c'], [0.5, '#f39c12'], [1, '#d35400']]); x.lineWidth = 1.6; x.stroke();
    path(); x.strokeStyle = 'rgba(255,255,220,0.55)'; x.lineWidth = 0.45; x.save(); x.translate(-0.35, -0.35); x.stroke(); x.restore();

}

function createAnimations(scene) {
  HEROES.forEach(h => {
    const make = (name, frames, rate, repeat = -1) => {
      const key = `${h.id}-${name}`;
      if (scene.anims.exists(key)) return;
      scene.anims.create({ key, frameRate: rate, repeat, frames: frames.map(f => ({ key: h.id, frame: f })) });
    };
    make('idle', [0, 1], 3);
    make('walk', [2, 3, 4, 5], 10);
    make('jump', [6], 1, 0);
    make('fall', [7], 1, 0);
  });
  [['goon', 5], ['machhar', 14], ['kawwa', 7], ['pkflag', 7]].forEach(([k, rate]) => {
    if (!scene.anims.exists(`${k}-move`)) scene.anims.create({ key: `${k}-move`, frameRate: rate, repeat: -1, frames: scene.anims.generateFrameNumbers(k) });
  });
}

/* ---- display helpers: hi-res textures are shown at 1/S scale ---- */
/** scale a hi-res image/sprite to its world size (times an optional extra factor) */
function hi(obj, k = 1) { obj.setScale(k / S); obj.hiK = k; return obj; }
/** tileSprite whose hi-res texture tiles at world size */
function hiTile(scene, x, y, w, h, key) { return scene.add.tileSprite(x, y, w, h, key).setTileScale(1 / S); }

/* ---- particle effects ---- */
class FX {
  constructor(scene, dustTint = 0xe0c9a0) {
    const P = (key, cfg, depth) => scene.add.particles(0, 0, key, Object.assign({ emitting: false }, cfg)).setDepth(depth);
    this.dustE = P('p-dust', { lifespan: { min: 300, max: 500 }, speed: { min: 10, max: 40 }, angle: { min: 200, max: 340 },
      scale: { start: 1.1 / S, end: 0.3 / S }, alpha: { start: 0.7, end: 0 }, gravityY: -40, tint: dustTint }, 9);
    this.sparkE = P('p-spark', { lifespan: 550, speed: { min: 40, max: 120 }, scale: { start: 1.1 / S, end: 0 },
      alpha: { start: 1, end: 0 }, gravityY: 120, tint: [0xffd54f, 0xffffff, 0xffb300], blendMode: 'ADD' }, 20);
    this.poofE = P('p-dust', { lifespan: 420, speed: { min: 30, max: 80 }, scale: { start: 1.6 / S, end: 0.2 / S },
      alpha: { start: 0.9, end: 0 }, tint: 0xffffff }, 20);
    this.confE = P('p-confetti', { lifespan: 1800, speedX: { min: -90, max: 90 }, speedY: { min: -280, max: -120 },
      gravityY: 320, rotate: { min: 0, max: 360 }, scale: 1 / S, tint: [0x01411c, 0xffffff, 0x43a047, 0xffd54f, 0xe91e63] }, 30);
  }
  dust(x, y, n = 4) { this.dustE.explode(n, x, y); }
  spark(x, y, n = 8) { this.sparkE.explode(n, x, y); }
  poof(x, y) { this.poofE.explode(8, x, y); }
  confetti(x, y, n = 40) { this.confE.explode(n, x, y); }
}

/* ------------------------------ 4. AUDIO (synth) --------------------------- */
const Sfx = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
  },
  tone(freq, dur = 0.1, type = 'square', vol = 0.07) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  seq(notes, gap = 70, type = 'square', vol = 0.06) {
    notes.forEach((f, i) => setTimeout(() => this.tone(f, 0.11, type, vol), i * gap));
  },
  jump()  { this.tone(520, 0.10, 'square'); setTimeout(() => this.tone(780, 0.07, 'square'), 45); },

/* ------------------------------ 5. SAVE ----------------------------------- */
const SaveManager = {
  KEY: 'desi-dash-save-v1',
  DEFAULT() { return { unlocked: ['1-1'], best: {}, stars: {}, hero: 'ali', muted: false }; },
  load() {
    try { return Object.assign(this.DEFAULT(), JSON.parse(localStorage.getItem(this.KEY) || '{}')); }
    catch (e) { return this.DEFAULT(); }
  },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) { } },
  complete(id, score, stars, next) {
    const d = this.load();
    d.best[id] = Math.max(d.best[id] || 0, score);
    d.stars[id] = Math.max(d.stars[id] || 0, stars);
    if (next && !d.unlocked.includes(next)) d.unlocked.push(next);
    this.save(d);
  },
  setHero(id) { const d = this.load(); d.hero = id; this.save(d); }
};

/* ------------------------------ 6. PURE LOGIC ------------------------------ */
const levelScore = ({ jalebis, enemies, timeLeft, stars }) =>
  jalebis * 10 + enemies * 100 + Math.floor(timeLeft) * 5 + stars * 1000;

/* ------------------------------ 7. STATE MACHINE --------------------------- */
class StateMachine {
  constructor(owner) { this.owner = owner; this.states = {}; this.current = null; }
  add(name, def = {}) { this.states[name] = def; return this; }
  set(name) {
    if (this.current === name || !this.states[name]) return;
    const prev = this.states[this.current];
    if (prev && prev.exit) prev.exit.call(this.owner);
    this.current = name;
    const next = this.states[name];
    if (next && next.enter) next.enter.call(this.owner);
  }
  update(dt) {
    const s = this.states[this.current];
    if (s && s.update) s.update.call(this.owner, dt);
  }
}

/* ------------------------------ 8. INPUT ---------------------------------- */
class InputManager {
  constructor(scene) {
    this.scene = scene;
    this.keys = scene.input.keyboard.addKeys('LEFT,RIGHT,UP,SPACE,A,D,W,J,SHIFT,ESC,P,ENTER');
    this.touch = TOUCH;
    this.pad = null;
    if (scene.input.gamepad) {
      scene.input.gamepad.once('connected', p => { this.pad = p; });
    }
    this.prevJump = false;
    this.prevAction = false;
    this.jumpPressed = false;
    this.actionPressed = false;
    this.pausePressed = false;
  }
  stickX() { return this.pad && this.pad.leftStick ? this.pad.leftStick.x : 0; }
  padBtn(i) {
    const b = this.pad && this.pad.buttons && this.pad.buttons[i];
    return !!(b && b.pressed);
  }
  get left()  { const k = this.keys; return !!(k.LEFT.isDown || k.A.isDown || this.touch.left  || this.padBtn(14) || this.stickX() < -0.4); }
  get right() { const k = this.keys; return !!(k.RIGHT.isDown || k.D.isDown || this.touch.right || this.padBtn(15) || this.stickX() > 0.4); }
  get run()   {
    const k = this.keys;
    return !!(k.SHIFT.isDown || k.J.isDown || this.touch.action || this.padBtn(2));
  }
  get jumpHeld() {
    const k = this.keys;
    return !!(k.SPACE.isDown || k.UP.isDown || k.W.isDown || this.touch.jump || this.padBtn(0) ||
              performance.now() < TOUCH_META.jumpHoldUntil);
  }
  get actionHeld() {
    const k = this.keys;
    return !!(k.J.isDown || k.SHIFT.isDown || this.touch.action || this.padBtn(2));
  }
  update() {
    const j = this.jumpHeld;
    this.jumpPressed = (j && !this.prevJump) || TOUCH_TAP.jump;
    this.prevJump = j;
    TOUCH_TAP.jump = false;

    const a = this.keys.J.isDown || this.padBtn(2) || this.touch.action;
    this.actionPressed = (a && !this.prevAction) || TOUCH_TAP.action;
    this.prevAction = a;
    TOUCH_TAP.action = false;
  }
}

/* ------------------------------ 9. ENTITIES ------------------------------- */
class Player extends Phaser.Physics.Arcade.Sprite {
  constructor(scene, x, y, hero, inputMgr) {
    super(scene, x, y, hero.id, 0);
    scene.add.existing(this);
    scene.physics.add.existing(this);
    hi(this);

    this.hero = hero;
    this.inputMgr = inputMgr;
    this.setDepth(10);
    this.body.setSize(12 * S, 26 * S).setOffset(6 * S, 6 * S);
    this.setCollideWorldBounds(true);
    this.body.setMaxVelocityY(MAX_FALL_SPEED);

    this.facing = 1;
    this.isBig = false;
    this.hasBall = false;
    this.invulnUntil = 0;
    this.cooldown = 0;
    this.extraJumps = 0;
    this.lastGrounded = -99999;
    this.lastJumpPressed = -99999;
    this.wallLockUntil = 0;
    this.speedUntil = 0;
    this.glideUntil = 0;
    this.dead = false;
    this.frozen = false;
    this.wasGround = true;
    this.prevVy = 0;
    this.dustAt = 0;

    this.fsm = new StateMachine(this)
      .add('idle', { enter() { this.playAnim('idle'); } })
      .add('run',  { enter() { this.playAnim('walk'); } })
      .add('jump', { enter() { this.playAnim('jump'); } })
      .add('fall', { enter() { this.playAnim('fall'); } });
    this.fsm.set('idle');

    // Hamza is strong: he starts every life already "big"
    if (hero.ability === 'brickBreaker') this.grow();
  }

  playAnim(name) {
    const key = `${this.hero.id}-${name}`;
    if (!this.anims.currentAnim || this.anims.currentAnim.key !== key) this.play(key, true);
  }

  maxExtraJumps() { return this.hero.ability === 'doubleJump' ? 1 : 0; }
  canGlide(time)  { return this.hero.ability === 'glide' || time < this.glideUntil; }
  canThrow()      { return this.hero.ability === 'fastThrow' || this.hasBall; }

  grow() {
    if (this.isBig) return;
    this.isBig = true;
    hi(this, 1.25);
    this.y -= 4;
  }

  shrink() {
    this.isBig = false;
    hi(this, 1);
  }

  update(time) {
    if (this.dead || this.frozen) return;
    const inp = this.inputMgr;
    const st = this.hero.stats;
    const body = this.body;
    const onGround = body.blocked.down || body.touching.down;

    /* ---- dust when landing or sprinting ---- */
    if (onGround && !this.wasGround && this.prevVy > 220) this.scene.fx.dust(this.x, body.bottom, 6);
    if (onGround && Math.abs(body.velocity.x) > 190 && time > this.dustAt) {
      this.scene.fx.dust(this.x - this.facing * 4, body.bottom, 1);
      this.dustAt = time + 110;
    }

    /* ---- horizontal movement (acceleration + drag) ---- */
    const speedMul = time < this.speedUntil ? 1.5 : 1;
    const maxSpeed = (inp.run ? st.runSpeed : st.walkSpeed) * speedMul;
    let dir = 0;
    if (time >= this.wallLockUntil) {
      if (inp.left) dir -= 1;
      if (inp.right) dir += 1;
    }
    if (dir !== 0) {
      const turning = Math.sign(body.velocity.x) === -dir;
      body.setAccelerationX(dir * st.accel * (turning ? 2.2 : 1) * (onGround ? 1 : 0.8));
      body.setDragX(0);
      this.facing = dir;
    } else {
      body.setAccelerationX(0);
      body.setDragX(onGround ? 1400 : 300);
    }
    body.setMaxVelocityX(maxSpeed);
    this.setFlipX(this.facing < 0);

    /* ---- jumping: coyote time + jump buffer + abilities ---- */
    if (onGround) {
      this.lastGrounded = time;
      this.extraJumps = this.maxExtraJumps();
    }
    if (inp.jumpPressed) this.lastJumpPressed = time;

    const buffered = time - this.lastJumpPressed <= JUMP_BUFFER_MS;
    const coyote = time - this.lastGrounded <= COYOTE_MS;
    const wallDir = (!onGround && this.hero.ability === 'wallJump')
      ? (body.blocked.left ? -1 : body.blocked.right ? 1 : 0) : 0;

    if (buffered) {
      if (onGround || coyote) {
        this.doJump(st.jump + Math.abs(body.velocity.x) * 0.12);   // running jumps go higher
      } else if (wallDir !== 0) {
        body.setVelocityX(-wallDir * st.walkSpeed * 1.2);
        this.doJump(st.jump * 0.95);
        this.facing = -wallDir;
        this.wallLockUntil = time + 170;
      } else if (this.extraJumps > 0) {
        this.extraJumps--;
        this.doJump(st.jump * 0.9);
      }
    }

    // Jump arc: brief hang at the top, quicker fall, and an early release ends the rise smoothly
    const vy = body.velocity.y;
    let extraG = 0;
    if (!onGround) {
      if (vy < 0 && !inp.jumpHeld) extraG = 1500;           // let go early -> shorter hop
      else if (Math.abs(vy) < 70 && inp.jumpHeld) extraG = -500; // apex hang while holding
      else if (vy > 0) extraG = 300;                          // fall a little faster than the rise
    }
    body.setGravityY(extraG);

    // Wall slide (Bilal)
    if (wallDir !== 0 && body.velocity.y > 70 && ((wallDir < 0 && inp.left) || (wallDir > 0 && inp.right))) {
      body.setVelocityY(70);
    }

    // Glide (Mahnoor, or anyone holding a patang power-up)
    if (!onGround && inp.jumpHeld && body.velocity.y > 55 && this.canGlide(time)) {
      body.setVelocityY(55);
    }

    /* ---- throwing cricket balls ---- */
    if (inp.actionPressed && this.canThrow() && time > this.cooldown) {
      this.scene.throwBall(this);
      this.cooldown = time + (this.hero.ability === 'fastThrow' ? 260 : 420);
    }

    /* ---- invulnerability flicker ---- */
    this.setAlpha(time < this.invulnUntil ? (Math.floor(time / 70) % 2 ? 0.35 : 1) : 1);

    /* ---- animation state ---- */
    if (!onGround) this.fsm.set(body.velocity.y < 0 ? 'jump' : 'fall');
    else this.fsm.set(Math.abs(body.velocity.x) > 12 ? 'run' : 'idle');
    this.wasGround = onGround;
    this.prevVy = body.velocity.y;
    if (this.fsm.current === 'run') this.anims.timeScale = Math.max(0.6, Math.abs(body.velocity.x) / 160);
    else this.anims.timeScale = 1;
  }

  doJump(power) {
    this.body.setVelocityY(-power);
    this.y -= 2;                 // show the take-off on this very frame
    this.fsm.set('jump');
    this.scene.fx.dust(this.x, this.body.bottom, 3);
    this.lastJumpPressed = -99999;
    this.lastGrounded = -99999;
    Sfx.jump();
  }

  hurt(time) {
    if (this.dead || this.frozen || time < this.invulnUntil) return;
    if (this.isBig || this.hasBall) {
      this.shrink();
      this.hasBall = false;
      this.speedUntil = 0;
      this.invulnUntil = time + 1600;
      Sfx.hurt();
      this.scene.cameras.main.shake(120, 0.006 / Z);
    } else {
      this.scene.playerDie();
    }
  }
}

class Enemy extends Phaser.Physics.Arcade.Sprite {
  constructor(scene, x, y, key) {
    super(scene, x, y, key, 0);
    scene.add.existing(this);
    scene.physics.add.existing(this);
    hi(this);
    this.setDepth(6);
    if (scene.anims.exists(`${key}-move`)) this.play({ key: `${key}-move`, startFrame: Math.floor(Math.random() * 2) });
    this.alive = true;
    this.awake = false;
  }
  wake(time) {
    const cam = this.scene.cameras.main;
    if (!this.awake && Math.abs(this.x - (cam.scrollX + GAME_WIDTH / 2)) < GAME_WIDTH / 2 + 48) {
      this.awake = true;
      this.onWake(time);
    }
    return this.awake;
  }
  onWake() {}
  stomp() {
    if (!this.alive) return;
    this.alive = false;
    this.body.enable = false;
    this.anims.stop();
    this.scene.fx.poof(this.x, this.y);
    this.setScale(1.15 / S, 0.35 / S);
    this.y += this.displayHeight;
    this.scene.tweens.add({ targets: this, alpha: 0, delay: 250, duration: 200, onComplete: () => this.destroy() });
  }
  knockOut(dir = 1) {
    if (!this.alive) return;
    this.alive = false;
    this.body.enable = false;
    this.anims.stop();
    this.scene.fx.spark(this.x, this.y, 6);
    this.setFlipY(true);
    this.scene.tweens.add({ targets: this, x: this.x + dir * 30, y: this.y - 24, duration: 180, ease: 'Quad.out',
      onComplete: () => this.scene.tweens.add({ targets: this, y: this.y + 260, duration: 600, ease: 'Quad.in',
        onComplete: () => this.destroy() }) });
  }
}

/** Gol Gappa Goon: walks, turns at walls and ledges */
class Goon extends Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'goon');
    this.body.setSize(14 * S, 12 * S).setOffset(1 * S, 4 * S);
    this.speed = 40;
    this.dir = -1;
  }
  update(time) {
    if (!this.alive || !this.wake(time)) return;
    const b = this.body;
    if (b.blocked.left) this.dir = 1;
    else if (b.blocked.right) this.dir = -1;
    else if (b.blocked.down && !this.scene.isSolidAt(this.x + this.dir * 9, b.bottom + 4)) this.dir *= -1;
    b.setVelocityX(this.dir * this.speed);
    this.setFlipX(this.dir > 0);
    if (this.y > WORLD_H - 10) this.destroy();
  }
}

/** Machhar: hovers in a figure-of-eight */
class Machhar extends Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'machhar');
    this.body.setAllowGravity(false);
    this.body.setSize(12 * S, 12 * S).setOffset(2 * S, 2 * S);
    this.baseX = x; this.baseY = y;
    this.phase = Math.random() * Math.PI * 2;
  }
  update(time) {
    if (!this.alive) return;
    const t = time / 1000 + this.phase;
    this.x = this.baseX + Math.sin(t * 0.8) * 26;
    this.y = this.baseY + Math.sin(t * 3) * 10;
    this.setFlipX(Math.cos(t * 0.8) > 0);
  }
}

/** Shararti Kawwa: cruises, then swoops at the player */
class Kawwa extends Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'kawwa');
    this.body.setAllowGravity(false);
    this.body.setSize(16 * S, 10 * S).setOffset(2 * S, 4 * S);
    this.baseY = y;
    this.mode = 'cruise';
    this.nextDive = 0;
    this.modeUntil = 0;
  }
  update(time) {
    if (!this.alive || !this.wake(time)) return;
    const p = this.scene.player;
    const b = this.body;
    const floorY = this.scene.L.groundTop * TILE - 14;
    if (this.mode === 'cruise') {
      b.setVelocity(-45, Math.sin(time / 300) * 20);
      if (p && !p.dead && time > this.nextDive && Math.abs(p.x - this.x) < 110 && p.y > this.y + 10) {
        this.mode = 'dive';
        this.modeUntil = time + 650;
        b.setVelocity(Math.sign(p.x - this.x) * 110, 150);
      }
    } else if (this.mode === 'dive') {
      if (time > this.modeUntil || this.y >= floorY) {
        this.mode = 'rise';
        b.setVelocity(Math.sign(b.velocity.x || -1) * 60, -110);
      }
    } else if (this.mode === 'rise') {
      if (this.y <= this.baseY) {
        this.y = this.baseY;
        this.mode = 'cruise';
        this.nextDive = time + 1500;
      }
    }
    this.setFlipX(b.velocity.x < 0);
    if (this.x < -40) this.destroy();
  }
}

/* ------------------------------ 10. UI HELPERS ---------------------------- */
const TXT = (size = 10, color = '#ffffff', extra = {}) =>
  Object.assign({ fontFamily: '"Baloo 2", "Trebuchet MS", Verdana, sans-serif', fontSize: `${size}px`, color, resolution: Math.max(3, Z) }, extra);

function makeButton(scene, x, y, label, onClick, w = 110, h = 22) {
  const g = scene.add.graphics();
  const draw = (hover, down) => {
    g.clear();
    const oy = down ? 1.5 : 0;
    g.fillStyle(0x000000, 0.35).fillRoundedRect(x - w / 2 + 1, y - h / 2 + 3, w, h, 7);          // drop shadow
    g.fillStyle(0x00290f, 1).fillRoundedRect(x - w / 2, y - h / 2 + 2, w, h, 7);                  // 3D base
    g.fillGradientStyle(hover ? 0x3d9b56 : 0x2e7d32, hover ? 0x3d9b56 : 0x2e7d32, 0x0b4d22, 0x0b4d22, 1);
    g.fillRoundedRect(x - w / 2, y - h / 2 + oy, w, h - 1, 7);
    g.fillStyle(0xffffff, 0.22).fillRoundedRect(x - w / 2 + 3, y - h / 2 + oy + 2, w - 6, h * 0.32, 5);  // gloss
    g.lineStyle(1.5, 0xffd54f, 1).strokeRoundedRect(x - w / 2, y - h / 2 + oy, w, h - 1, 7);
  };
  draw(false, false);
  const t = scene.add.text(x, y - 0.5, label, TXT(11, '#ffffff', { fontStyle: 'bold', stroke: '#0b3d1c', strokeThickness: 3 })).setOrigin(0.5);
  const bg = scene.add.zone(x, y, w, h).setInteractive({ useHandCursor: true });
  bg.on('pointerover', () => draw(true, false));
  bg.on('pointerout', () => { draw(false, false); t.y = y - 0.5; });
  bg.on('pointerdown', () => { draw(true, true); t.y = y + 1; Sfx.init(); onClick(); });
  return { bg, t };
}

/** glossy 3D gradient lettering for screen titles */
function glossyTitle(t, top = '#fff8d0', mid = '#ffd54f', low = '#ffb300', bottom = '#e65100') {
  const g = t.context.createLinearGradient(0, 0, 0, t.height);
  g.addColorStop(0, top); g.addColorStop(0.45, mid); g.addColorStop(0.55, low); g.addColorStop(1, bottom);
  return t.setFill(g).setStroke('#4a1f00', Math.max(4, t.style.strokeThickness || 0)).setShadow(0, 2, '#2a1000', 0, true, false);
}

// truck-art style border
function truckBorder(scene) {
  const g = scene.add.graphics();

  return g;
}

    const prompt = this.add.text(GAME_WIDTH / 2, 250, 'PRESS ENTER / TAP TO START',
      TXT(11, '#ffffff', { fontStyle: 'bold', stroke: '#000000', strokeThickness: 4 })).setOrigin(0.5);
    this.tweens.add({ targets: prompt, alpha: 0.25, duration: 650, yoyo: true, repeat: -1 });
    const mute = this.add.text(GAME_WIDTH - 8, 6, Sfx.muted ? 'SOUND: OFF (M)' : 'SOUND: ON (M)',
      TXT(8, '#ffffff', { fontStyle: 'bold', backgroundColor: '#01411c', padding: { x: 4, y: 2 } })).setOrigin(1, 0)
      .setInteractive({ useHandCursor: true });
    const toggle = () => {
      Sfx.muted = !Sfx.muted;
      const d = SaveManager.load(); d.muted = Sfx.muted; SaveManager.save(d);
      mute.setText(Sfx.muted ? 'SOUND: OFF (M)' : 'SOUND: ON (M)');
    };
    mute.on('pointerdown', (p, x, y, e) => { e.stopPropagation(); toggle(); });
    this.input.keyboard.on('keydown-M', toggle);

    const go = () => { Sfx.init(); Sfx.coin(); this.scene.start('CharacterSelect'); };
    this.input.keyboard.once('keydown-ENTER', go);
    this.input.keyboard.once('keydown-SPACE', go);
    this.input.once('pointerup', (p, over) => { if (!over.includes(mute)) { goFullscreen(this); go(); } });
  }
  update(t, dt) {
    this.bgFar.tilePositionX += dt * 0.004;
    this.bgMid.tilePositionX += dt * 0.012;
    this.ground.tilePositionX += dt * 0.045;
    this.groundFill.tilePositionX += dt * 0.045;
  }
}

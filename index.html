  html, body { margin:0; padding:0; width:100%; height:100%; background:#0b0f14; overflow:hidden;

               font-family: monospace; -webkit-tap-highlight-color: transparent;
               -webkit-user-select:none; user-select:none; }
  /* 100dvh = the height actually visible (excludes the mobile browser's address bar).
     JS below also sets the exact pixel size, for browsers without dvh support. */
  #app { position:fixed; inset:0; background:#0b0f14; }
  #game { position:fixed; left:0; top:0; width:100vw; height:100vh; height:100dvh;
          display:flex; align-items:center; justify-content:center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  #rotate { display:none; position:fixed; inset:0; z-index:10; background:#01411c; color:#ffd54f;
            font: bold 20px monospace; text-align:center; flex-direction:column;
            align-items:center; justify-content:center; gap:18px; padding:24px; }
  #rotate .icon { font-size:64px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%,30% { transform: rotate(0deg); } 60%,100% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display:flex; } }

  /* On-screen controls: HTML buttons in the screen corners, so on wide phones they sit
     in the empty side strips instead of covering the game. Shown only while playing. */
  #pad { display:none; position:fixed; inset:0; pointer-events:none; z-index:5;
         --s: clamp(54px, 19vh, 84px); --gap: calc(var(--s) * 0.18); }
  body.touch.playing #pad { display:block; }
  #pad .grp { position:absolute; bottom: max(14px, env(safe-area-inset-bottom)); display:flex; gap:var(--gap);
              align-items:flex-end; pointer-events:auto; }
  #pad .l { left: max(14px, env(safe-area-inset-left)); }
  #pad .r { right: max(14px, env(safe-area-inset-right)); flex-direction:column; align-items:center; }
  #pad .b { width:var(--s); height:var(--s); border-radius:50%; box-sizing:border-box;

/** Touch button state, shared by the HTML pad and the InputManager */
const TOUCH = { left: false, right: false, jump: false, action: false };
(function setupPad() {
  if (IS_TOUCH) document.body.classList.add('touch');
  const held = new Map();                                       // pointerId -> button key
  const keyAt = (x, y) => { const el = document.elementFromPoint(x, y); const b = el && el.closest && el.closest('#pad [data-k]'); return b ? b.dataset.k : null; };
  const sync = () => {
    Object.keys(TOUCH).forEach(k => { TOUCH[k] = false; });
    held.forEach(k => { if (k) TOUCH[k] = true; });
    document.querySelectorAll('#pad [data-k]').forEach(b => b.classList.toggle('on', TOUCH[b.dataset.k]));
  };
  document.addEventListener('pointerdown', e => {
    const k = keyAt(e.clientX, e.clientY);
    if (!k) return;
    held.set(e.pointerId, k); sync(); e.preventDefault();
  }, { passive: false });
  document.addEventListener('pointermove', e => {
    if (!held.has(e.pointerId)) return;
    held.set(e.pointerId, keyAt(e.clientX, e.clientY)); sync();   // slide from ◀ to ▶
  });
  const end = e => { if (held.delete(e.pointerId)) sync(); };
  ['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, end));
  window.addEventListener('blur', () => { held.clear(); sync(); });
  document.addEventListener('contextmenu', e => { if (keyAt(e.clientX, e.clientY)) e.preventDefault(); });
  window.__resetTouch = () => { held.clear(); sync(); };
})();

/** On phones: go fullscreen (hides the browser bar) and lock to landscape where supported.
    Must be called from a pointerup handler, since browsers only allow it after a tap. */
function goFullscreen(scene) {
  if (!IS_TOUCH || !scene.scale.fullscreen.available || scene.scale.isFullscreen) return;
  scene.scale.once('enterfullscreen', () => {
    try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) { }
  });
  try { scene.scale.startFullscreen(); } catch (e) { }
}

/* ------------------------------ 3. ART (procedural pixel art) -------------- */
/* Everything is drawn in code on small canvases, then given a 1px dark outline,
   so the game needs no image files at all. */

function makeTex(scene, key, w, h, draw) {
  if (scene.textures.exists(key)) return;
  const t = scene.textures.createCanvas(key, w, h);
  const ctx = t.getContext();
  draw(ctx, w, h);
  t.refresh();
}

/* ---- colour + canvas helpers ---- */
function hexRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function shade(hex, f) {                       // f > 0 lighten, f < 0 darken
  const [r, g, b] = hexRgb(hex);
  const m = v => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f));
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function mix(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function rng(seed) {                            // deterministic random (mulberry32)
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function painter(ctx) {
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  R.px = (x, y, c) => R(x, y, 1, 1, c);
  R.ctx = ctx;
  return R;
}
/** add a 1px outline around every opaque pixel */
function outline(src, color = '#2a1a14') {
  const w = src.width, h = src.height;
  const d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const out = newCanvas(w, h);
  const o = out.getContext('2d');
  o.fillStyle = color;
  const a = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : d[(y * w + x) * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (a(x, y) > 40) continue;
    if (a(x - 1, y) > 40 || a(x + 1, y) > 40 || a(x, y - 1) > 40 || a(x, y + 1) > 40) o.fillRect(x, y, 1, 1);
  }
  o.drawImage(src, 0, 0);
  return out;
}
function sprite(w, h, draw, outlineColor = '#2a1a14') {
  const c = newCanvas(w, h);
  draw(painter(c.getContext('2d')), c.getContext('2d'), w, h);
  return outlineColor ? outline(c, outlineColor) : c;
}
function addSheet(scene, key, fw, fh, frames) {
  if (scene.textures.exists(key)) return;
  const t = scene.textures.createCanvas(key, fw * frames.length, fh);
  const ctx = t.getContext();
  frames.forEach((f, i) => { ctx.drawImage(f, i * fw, 0); t.add(i, 0, i * fw, 0, fw, fh); });
  t.refresh();
}
function addImage(scene, key, canvas) {
  if (!scene.textures.exists(key)) scene.textures.addCanvas(key, canvas);
}

/* ---- heroes ---- */
const FW = 24, FH = 32, HERO_FRAMES = 8;

const HERO_STYLE = {

  ayesha:  { cut: 'long', dupatta: true, girl: true, dupattaColor: '#fff3e0' },

function drawHero(p, s, frame) {
  return sprite(FW, FH, R => {
    const sk = p.skin, skD = shade(sk, -0.2);
    const top = s.top || p.top, topD = shade(top, -0.25), topL = shade(top, 0.18);
    const bot = p.bottom, botD = shade(bot, -0.22);
    const hair = p.hair, hairL = shade(hair, 0.28);
    const scarf = p.scarf || top;

    // pose for each frame: back/front leg x-offset & lift, arm swing, body bob, cloth sway
    let lb = 0, lf = 0, yb = 0, yf = 0, b = 0, aB = 0, aF = 0, sway = 0, armUp = false, armsOut = false;
    switch (frame) {
      case 1: b = 1; break;
      case 2: lb = -2; lf = 2; aB = 1; aF = -1; sway = 1; break;
      case 3: yb = -1; b = -1; break;
      case 4: lb = 2; lf = -2; aB = -1; aF = 1; sway = -1; break;
      case 5: yf = -1; b = -1; break;
      case 6: lb = -1; lf = 2; yf = -3; armUp = true; sway = 2; break;
      case 7: lb = -2; lf = 2; yb = -1; armsOut = true; sway = -2; break;
    }
    const cutY = s.cut === 'long' ? 24 : s.cut === 'mid' ? 22 : 21;

    /* --- things behind the body --- */
    if (s.girl) {                                   // long hair falls behind the shoulders
      R(7, 4 + b, 3, 14, hair);
      R(6 + (sway > 0 ? -1 : 0), 10 + b, 2, 9, hair);
      R(7, 5 + b, 1, 6, hairL);
    }
    if (s.bat) {                                    // cricket bat slung on the back
      R(4, 12 + b, 3, 10, '#e2c08d'); R(4, 12 + b, 1, 10, '#f3dcb0'); R(6, 12 + b, 1, 10, '#b8925a');
      R(5, 7 + b, 2, 5, '#5d4037'); R(5, 6 + b, 2, 1, '#8d6e63');
    }
    if (s.dupatta) {                                // dupatta tail flowing behind
      const dc = s.ajrak ? '#b71c1c' : (s.dupattaColor || scarf);
      R(5 - Math.max(0, sway), 13 + b, 2, 8 + Math.abs(sway), dc);
      R(4 - Math.max(0, sway), 18 + b, 2, 4, shade(dc, -0.15));
    }

    /* --- back arm + legs --- */
    if (armsOut) R(4, 13 + b, 4, 2, topD);
    else R(6, 13 + b + aB, 2, 6, topD), R(6, 19 + b + aB, 2, 2, skD);
    R(9 + lb, 21, 3, 8 + yb, botD);
    R(9 + lb, 29 + yb, 4, 2, shade(p.shoe, -0.25));
    R(12 + lf, 21, 3, 8 + yf, bot);
    R(12 + lf, 29 + yf, 4, 2, p.shoe);
    R(12 + lf, 28 + yf, 3, 1, shade(bot, 0.12));       // shalwar cuff highlight

    /* --- torso (kameez / shirt) --- */
    R(8, 12 + b, 8, cutY - 12, top);
    if (s.cut === 'long') { R(7, 20 + b, 10, cutY - 20, top); R(7, 23 + b, 10, 1, topD); }
    R(8, 12 + b, 1, cutY - 12, topL);                    // light from the left
    R(15, 12 + b, 1, cutY - 12, topD);
    R(11, 12 + b, 2, 2, sk);                              // neckline
    R(11, 14 + b, 1, 1, sk);
    if (s.trim) { R(8, 12 + b, 8, 1, s.trim); R(8, cutY - 1 + b, 8, 1, s.trim); R(12, 15 + b, 2, 2, '#ffffff'); }
    if (s.vest) { R(8, 13 + b, 3, 8, s.vest); R(13, 13 + b, 3, 8, s.vest); R(8, 13 + b, 1, 8, shade(s.vest, 0.2)); }
    if (s.buttons) for (let y = 15; y < 21; y += 2) R(12, y + b, 1, 1, shade(top, 0.4));
    if (s.dupatta) {                                      // dupatta over the shoulders
      const dc = s.ajrak ? '#b71c1c' : (s.dupattaColor || scarf);
      R(7, 12 + b, 10, 2, dc);
      R(14, 14 + b, 2, 4, dc);
      if (s.ajrak) for (let x = 7; x < 17; x += 2) R(x, 12 + b, 1, 1, '#1a237e'), R(x + 1, 13 + b, 1, 1, '#ffffff');
    }

    /* --- front arm --- */
    if (armUp) { R(15, 7 + b, 2, 6, top); R(15, 6 + b, 2, 2, sk); }
    else if (armsOut) { R(15, 12 + b, 5, 2, top); R(20, 12 + b, 2, 2, sk); }
    else { R(16, 13 + b + aF, 2, 6, top); R(16, 19 + b + aF, 2, 2, sk); }

    /* --- head --- */
    R(9, 3 + b, 6, 1, sk);
    R(8, 4 + b, 8, 7, sk);
    R(9, 11 + b, 6, 1, sk);
    R(15, 5 + b, 1, 5, skD);                              // jaw shadow
    R(11, 12 + b, 2, 1, skD);                             // neck
    // face (looking right)
    R(11, 7 + b, 1, 2, '#1d1d1d'); R(14, 7 + b, 1, 2, '#1d1d1d');
    R(11, 7 + b, 1, 1, '#4a4a4a'); R(14, 7 + b, 1, 1, '#4a4a4a');
    R(13, 10 + b, 2, 1, '#7b3328');

    R(9, 2 + b, 6, 1, hair);

    if (s.cap === 'cricket') {

/* ---- Pakistan flag (waving) ---- */
function drawPkFlag(phase) {
  const w = 30, h = 20;
  const flat = newCanvas(w, h);
  const c = flat.getContext('2d');
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, 8, h);
  c.fillStyle = '#01411c'; c.fillRect(8, 0, w - 8, h);
  c.fillStyle = '#ffffff'; c.beginPath(); c.arc(19, 10, 6, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#01411c'; c.beginPath(); c.arc(21, 8.5, 5.2, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#ffffff'; c.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 1.1 : 2.6, a = -Math.PI / 2 + i * Math.PI / 5 + 0.5;
    const x = 23 + Math.cos(a) * r, y = 7 + Math.sin(a) * r;
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  c.fill();
  const out = newCanvas(w + 2, h + 6);
  const o = out.getContext('2d');
  for (let x = 0; x < w; x++) {
    const off = Math.sin(phase + x * 0.32) * 2 * (x / w);
    const lit = Math.cos(phase + x * 0.32);
    o.drawImage(flat, x, 0, 1, h, x, 3 + off, 1, h);
    o.fillStyle = lit > 0 ? `rgba(255,255,255,${lit * 0.12})` : `rgba(0,0,0,${-lit * 0.18})`;
    o.fillRect(x, 3 + off, 1, h);
  }
  return out;
}

/* silhouettes used by the backgrounds */
function drawPalm(R, x, y, s = 1) {
  for (let i = 0; i < 34 * s; i++) R(x + Math.round(Math.sin(i / 14) * 4), y - i, 3, 1, i % 4 ? '#7b5a3a' : '#5d4128');
  const tx = x + Math.round(Math.sin(34 * s / 14) * 4), ty = y - 34 * s;
  [[-14, 4], [-10, 8], [12, 5], [9, 9], [0, -4], [-4, 10]].forEach(([dx, dy]) => {
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      R(tx + dx * t, ty + dy * t * t - 2, 3, 2, t > 0.6 ? '#2e7d32' : '#388e3c');
    }
  });
}
function drawCamel(R, x, y, col) {
  R(x, y - 12, 18, 6, col); R(x + 4, y - 15, 6, 3, col); R(x + 16, y - 20, 3, 10, col);
  R(x + 16, y - 22, 6, 3, col);
  [1, 5, 12, 15].forEach(dx => R(x + dx, y - 6, 2, 6, col));
  R(x + 3, y - 12, 12, 2, '#c62828'); R(x + 3, y - 10, 2, 2, '#fdd835');   // decorated saddle
}
function drawKikar(R, x, y, col) {
  R(x, y - 20, 2, 20, col);
  R(x - 3, y - 18, 2, 2, col); R(x + 3, y - 16, 2, 2, col);
  R(x - 12, y - 24, 26, 4, shade(col, 0.1)); R(x - 8, y - 27, 18, 3, shade(col, 0.15));
}

function buildLevelArt(scene, L) {
  const id = L.id, th = themeOf(L);
  if (scene.textures.exists(`sky-${id}`)) return;
  drawTiles(scene, L);
  const r = rng(L.world * 131);

  // sky: banded gradient (pixel-art style)
  makeTex(scene, `sky-${id}`, GAME_WIDTH, CAM_H, (c, w, h) => {
    const topC = mix(L.sky, '#2b4c7e', th === 'thar' ? 0.15 : 0.45);
    const botC = mix(L.sky, '#fff3d6', 0.55);
    for (let y = 0; y < h; y += 4) { c.fillStyle = mix(topC, botC, Math.pow(y / h, 1.3)); c.fillRect(0, y, w, 4); }
  });

  if (th === 'lahore') {
    makeTex(scene, `far-${id}`, 480, 150, (c, w, h) => {
      const R = painter(c), col = '#a596c4', dk = '#8e7fb0';
      for (let x = 0; x < w; x += 12) R(x, h - 14 - Math.floor(r() * 14), 12, 40, col);
      // Minar-e-Pakistan
      const mx = 330, base = h - 14;
      R(mx - 26, base - 6, 52, 8, col); R(mx - 18, base - 12, 36, 6, col);
      for (let y = 0; y < 110; y++) { const half = Math.round(8 - (y / 110) * 5); R(mx - half, base - 12 - y, half * 2, 1, col); }
      [30, 62, 92].forEach(y => R(mx - 8, base - 12 - y, 16, 3, dk));
      c.fillStyle = col; c.beginPath(); c.arc(mx, base - 123, 5, Math.PI, 0); c.fill();
      R(mx, base - 134, 1, 8, col);
      // Mughal-style monument with domes and minarets
      const fx = 110;
      R(fx - 40, base - 30, 80, 30, col);
      for (let i = -3; i <= 3; i++) { R(fx + i * 10 - 3, base - 22, 6, 16, dk); c.fillStyle = dk; c.beginPath(); c.arc(fx + i * 10, base - 22, 3, Math.PI, 0); c.fill(); }
      c.fillStyle = col; c.beginPath(); c.ellipse(fx, base - 44, 17, 16, 0, Math.PI, 0); c.fill();
      R(fx - 15, base - 44, 30, 14, col); R(fx, base - 66, 1, 8, col);
      [-28, 28].forEach(dx => { c.beginPath(); c.arc(fx + dx, base - 36, 6, Math.PI, 0); c.fill(); R(fx + dx - 5, base - 36, 10, 6, col); });
      [-44, 44].forEach(dx => { R(fx + dx - 3, base - 72, 6, 72, col); c.beginPath(); c.arc(fx + dx, base - 72, 4, Math.PI, 0); c.fill(); R(fx + dx - 4, base - 52, 8, 2, dk); });
    });
    makeTex(scene, `mid-${id}`, 480, 110, (c, w, h) => {
      const R = painter(c);
      const cols = ['#c9785d', '#d9a066', '#b5655a', '#e0b98a', '#c98d6b', '#a8634f'];
      let x = 0;
      while (x < w) {
        let bw = 36 + Math.floor(r() * 34);
        if (w - x - bw < 30) bw = w - x;
        const bh = 40 + Math.floor(r() * 50), col = cols[Math.floor(r() * cols.length)];
        const y0 = h - bh;
        R(x, y0, bw, bh, col); R(x + bw - 3, y0, 3, bh, shade(col, -0.15)); R(x, y0, bw, 2, shade(col, 0.2));
        for (let cx = x + 2; cx < x + bw - 3; cx += 6) R(cx, y0 - 3, 3, 3, col);       // parapet
        for (let wy = y0 + 8; wy < h - 10; wy += 16)
          for (let wx = x + 6; wx < x + bw - 10; wx += 12) {
            const lit = r() > 0.75;
            R(wx, wy + 2, 6, 8, lit ? '#ffcc66' : '#4a2f2a'); R(wx + 1, wy, 4, 2, lit ? '#ffcc66' : '#4a2f2a');
            R(wx - 1, wy + 10, 8, 1, shade(col, 0.25));
          }
        if (bw > 44 && r() > 0.35) {                                                    // jharoka balcony
          const jx = x + Math.floor(bw / 2) - 8, jy = y0 + 18;
          R(jx, jy, 16, 12, '#6d4128'); R(jx + 2, jy + 2, 12, 7, '#3b2418'); R(jx - 1, jy + 12, 18, 2, '#8a5636');
          c.fillStyle = '#8a5636'; c.beginPath(); c.arc(jx + 8, jy, 8, Math.PI, 0); c.fill();
        }
        if (r() > 0.5) { R(x + 6, y0 - 9, 8, 7, '#2f3b40'); R(x + 6, y0 - 9, 8, 1, '#4f5f66'); } // water tank
        x += bw;
      }
    });
  } else if (th === 'karachi') {
    makeTex(scene, `far-${id}`, 480, 150, (c, w, h) => {
      const R = painter(c), col = '#86a3bd';
      for (let x = 0; x < w;) {
        const bw = 14 + Math.floor(r() * 18), bh = 30 + Math.floor(r() * 70);
        if (x + bw > 300 && x < 420) { x = 420; continue; }
        R(x, h - bh, Math.min(bw, w - x), bh, col);
        for (let wy = h - bh + 4; wy < h - 4; wy += 5) for (let wx = x + 2; wx < x + bw - 2; wx += 4) if (r() > 0.4) R(wx, wy, 2, 2, '#a9c2d6');
        x += bw + 2;
      }
      // Mazar-e-Quaid
      const mx = 360, white = '#eef3f6';
      R(mx - 30, h - 34, 60, 34, white); R(mx - 30, h - 34, 60, 2, '#ffffff');
      R(mx - 7, h - 26, 14, 20, '#9fb3c2'); c.fillStyle = '#9fb3c2'; c.beginPath(); c.arc(mx, h - 26, 7, Math.PI, 0); c.fill();
      c.fillStyle = white; c.beginPath(); c.moveTo(mx - 22, h - 34); c.quadraticCurveTo(mx - 20, h - 74, mx, h - 76);
      c.quadraticCurveTo(mx + 20, h - 74, mx + 22, h - 34); c.fill();
      R(mx - 34, h - 4, 68, 4, '#c7d3dc');
    });
    makeTex(scene, `mid-${id}`, 480, 84, (c, w, h) => {
      const R = painter(c), top = 14;
      for (let y = top; y < h; y += 3) R(0, y, w, 3, mix('#5bb0d6', '#1f6f99', (y - top) / (h - top)));
      R(0, top, w, 2, '#bfe6f5');
      for (let i = 0; i < 70; i++) { const x = Math.floor(r() * w), y = top + 6 + Math.floor(r() * (h - top - 10)); R(x, y, 4 + Math.floor(r() * 6), 1, 'rgba(255,255,255,0.55)'); }
      // cargo ship on the horizon
      R(140, top - 3, 34, 5, '#37474f'); R(142, top - 1, 30, 1, '#c62828');
      R(150, top - 9, 14, 6, '#eceff1'); R(158, top - 14, 3, 5, '#e53935');
    });
    makeTex(scene, `near-${id}`, 480, 90, (c, w, h) => {
      const R = painter(c);
      drawPalm(R, 40, h, 1.4); drawPalm(R, 70, h, 1.1); drawPalm(R, 260, h, 1.5);
      drawCamel(R, 330, h, '#8d6e4a');
      [[150, '#e53935'], [400, '#1e88e5']].forEach(([ux, uc]) => {
        R(ux, h - 30, 2, 30, '#5d4037');
        for (let i = 0; i < 14; i++) R(ux - i, h - 32 + Math.floor(i / 3), i * 2 + 2, 1, i % 4 < 2 ? uc : '#ffffff');
      });
    });
  } else {
    makeTex(scene, `far-${id}`, 480, 150, (c, w, h) => {
      c.fillStyle = '#f5d3a1'; c.beginPath(); c.moveTo(0, h);
      for (let x = 0; x <= w; x += 2) c.lineTo(x, h - 40 - Math.sin(x * Math.PI * 2 / 240) * 18 - Math.sin(x * Math.PI * 2 / 160 + 1) * 10);
      c.lineTo(w, h); c.fill();
    });
    makeTex(scene, `mid-${id}`, 480, 110, (c, w, h) => {
      const R = painter(c);
      c.fillStyle = '#e3ab6c'; c.beginPath(); c.moveTo(0, h);

      c.lineTo(w, h); c.fill();
      // Mohenjo-daro style mound + stupa
      const sx = 250, base = h - 22;
      c.save();
      c.fillStyle = '#b5653f'; c.beginPath(); c.moveTo(sx - 70, base); c.lineTo(sx - 40, base - 34); c.lineTo(sx + 40, base - 34); c.lineTo(sx + 70, base); c.closePath(); c.fill();
      c.clip();
      for (let y = base - 32; y < base; y += 4) { R(sx - 70, y, 140, 1, '#a35a37'); for (let x = sx - 70; x < sx + 70; x += 8) R(x + ((y / 4) % 2) * 4, y, 1, 4, '#94502f'); }
      c.restore();
      c.fillStyle = '#c47549'; c.beginPath(); c.arc(sx, base - 34, 18, Math.PI, 0); c.fill();
      R(sx - 1, base - 58, 2, 6, '#94502f');

    });
  }
}

function createAnimations(scene) {

/* ------------------------------ 4. AUDIO (synth) --------------------------- */
const Sfx = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
  },
  tone(freq, dur = 0.1, type = 'square', vol = 0.07) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  seq(notes, gap = 70, type = 'square', vol = 0.06) {
    notes.forEach((f, i) => setTimeout(() => this.tone(f, 0.11, type, vol), i * gap));
  },
  jump()  { this.tone(520, 0.10, 'square'); setTimeout(() => this.tone(780, 0.07, 'square'), 45); },
  coin()  { this.tone(1046, 0.06, 'square', 0.05); setTimeout(() => this.tone(1568, 0.08, 'square', 0.05), 55); },
  stomp() { this.tone(180, 0.09, 'sawtooth', 0.08); },
  hurt()  { this.tone(220, 0.18, 'sawtooth', 0.09); setTimeout(() => this.tone(110, 0.22, 'sawtooth', 0.09), 90); },
  power() { this.seq([523, 659, 784, 1046], 65, 'triangle', 0.07); },
  star()  { this.seq([1318, 1568, 2093], 75, 'triangle', 0.06); },
  flag()  { this.seq([523, 659, 784, 1046, 1318], 100, 'square', 0.06); },
  throwB(){ this.tone(700, 0.05, 'triangle', 0.05); }
};

/* ------------------------------ 5. SAVE ----------------------------------- */
const SaveManager = {
  KEY: 'desi-dash-save-v1',
  DEFAULT() { return { unlocked: ['1-1'], best: {}, stars: {}, hero: 'ali', muted: false }; },
  load() {
    try { return Object.assign(this.DEFAULT(), JSON.parse(localStorage.getItem(this.KEY) || '{}')); }
    catch (e) { return this.DEFAULT(); }
  },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) { } },
  complete(id, score, stars, next) {
    const d = this.load();
    d.best[id] = Math.max(d.best[id] || 0, score);
    d.stars[id] = Math.max(d.stars[id] || 0, stars);
    if (next && !d.unlocked.includes(next)) d.unlocked.push(next);
    this.save(d);
  },
  setHero(id) { const d = this.load(); d.hero = id; this.save(d); }
};

/* ------------------------------ 6. PURE LOGIC ------------------------------ */
const levelScore = ({ jalebis, enemies, timeLeft, stars }) =>
  jalebis * 10 + enemies * 100 + Math.floor(timeLeft) * 5 + stars * 1000;

/* ------------------------------ 7. STATE MACHINE --------------------------- */
class StateMachine {
  constructor(owner) { this.owner = owner; this.states = {}; this.current = null; }
  add(name, def = {}) { this.states[name] = def; return this; }
  set(name) {
    if (this.current === name || !this.states[name]) return;
    const prev = this.states[this.current];
    if (prev && prev.exit) prev.exit.call(this.owner);
    this.current = name;
    const next = this.states[name];
    if (next && next.enter) next.enter.call(this.owner);
  }
  update(dt) {
    const s = this.states[this.current];
    if (s && s.update) s.update.call(this.owner, dt);
  }
}

/* ------------------------------ 8. INPUT ---------------------------------- */
class InputManager {
  constructor(scene) {
    this.scene = scene;
    this.keys = scene.input.keyboard.addKeys('LEFT,RIGHT,UP,SPACE,A,D,W,J,SHIFT,ESC,P,ENTER');
    this.touch = TOUCH;
    this.pad = null;
    if (scene.input.gamepad) {
      scene.input.gamepad.once('connected', p => { this.pad = p; });
    }
    this.prevJump = false;
    this.prevAction = false;
    this.jumpPressed = false;
    this.actionPressed = false;
    this.pausePressed = false;
  }
  stickX() { return this.pad && this.pad.leftStick ? this.pad.leftStick.x : 0; }
  padBtn(i) {
    const b = this.pad && this.pad.buttons && this.pad.buttons[i];
    return !!(b && b.pressed);
  }
  get left()  { const k = this.keys; return !!(k.LEFT.isDown || k.A.isDown || this.touch.left  || this.padBtn(14) || this.stickX() < -0.4); }
  get right() { const k = this.keys; return !!(k.RIGHT.isDown || k.D.isDown || this.touch.right || this.padBtn(15) || this.stickX() > 0.4); }
  get run()   { const k = this.keys; return !!(k.SHIFT.isDown || k.J.isDown || this.touch.action || this.padBtn(2)); }
  get jumpHeld() {
    const k = this.keys;
    return !!(k.SPACE.isDown || k.UP.isDown || k.W.isDown || this.touch.jump || this.padBtn(0));
  }
  get actionHeld() {
    const k = this.keys;
    return !!(k.J.isDown || k.SHIFT.isDown || this.touch.action || this.padBtn(2));
  }
  update() {
    const j = this.jumpHeld;
    this.jumpPressed = j && !this.prevJump;
    this.prevJump = j;

    const a = this.keys.J.isDown || this.padBtn(2) || this.touch.action;
    this.actionPressed = a && !this.prevAction;
    this.prevAction = a;
  }
}

/* ------------------------------ 9. ENTITIES ------------------------------- */
class Player extends Phaser.Physics.Arcade.Sprite {
  constructor(scene, x, y, hero, inputMgr) {
    super(scene, x, y, hero.id, 0);
    scene.add.existing(this);
    scene.physics.add.existing(this);

    this.hero = hero;
    this.inputMgr = inputMgr;
    this.setDepth(10);
    this.body.setSize(12, 26).setOffset(6, 6);
    this.setCollideWorldBounds(true);
    this.body.setMaxVelocityY(MAX_FALL_SPEED);

    this.facing = 1;
    this.isBig = false;
    this.hasBall = false;
    this.invulnUntil = 0;
    this.cooldown = 0;
    this.extraJumps = 0;
    this.lastGrounded = -99999;
    this.lastJumpPressed = -99999;
    this.wallLockUntil = 0;
    this.speedUntil = 0;
    this.glideUntil = 0;
    this.dead = false;
    this.frozen = false;
    this.wasGround = true;
    this.prevVy = 0;
    this.dustAt = 0;

    this.fsm = new StateMachine(this)
      .add('idle', { enter() { this.playAnim('idle'); } })
      .add('run',  { enter() { this.playAnim('walk'); } })
      .add('jump', { enter() { this.playAnim('jump'); } })
      .add('fall', { enter() { this.playAnim('fall'); } });
    this.fsm.set('idle');

    // Hamza is strong: he starts every life already "big"
    if (hero.ability === 'brickBreaker') this.grow();
  }

  playAnim(name) {
    const key = `${this.hero.id}-${name}`;
    if (!this.anims.currentAnim || this.anims.currentAnim.key !== key) this.play(key, true);
  }

  maxExtraJumps() { return this.hero.ability === 'doubleJump' ? 1 : 0; }
  canGlide(time)  { return this.hero.ability === 'glide' || time < this.glideUntil; }
  canThrow()      { return this.hero.ability === 'fastThrow' || this.hasBall; }

  grow() {
    if (this.isBig) return;
    this.isBig = true;
    this.setScale(1.25);
    this.y -= 4;
  }

  shrink() {
    this.isBig = false;
    this.setScale(1);
  }

  update(time) {
    if (this.dead || this.frozen) return;
    const inp = this.inputMgr;
    const st = this.hero.stats;
    const body = this.body;
    const onGround = body.blocked.down || body.touching.down;

    /* ---- dust when landing or sprinting ---- */
    if (onGround && !this.wasGround && this.prevVy > 220) this.scene.fx.dust(this.x, body.bottom, 6);
    if (onGround && Math.abs(body.velocity.x) > 190 && time > this.dustAt) {
      this.scene.fx.dust(this.x - this.facing * 4, body.bottom, 1);
      this.dustAt = time + 110;
    }

    /* ---- horizontal movement (acceleration + drag) ---- */
    const speedMul = time < this.speedUntil ? 1.5 : 1;
    const maxSpeed = (inp.run ? st.runSpeed : st.walkSpeed) * speedMul;
    let dir = 0;
    if (time >= this.wallLockUntil) {
      if (inp.left) dir -= 1;
      if (inp.right) dir += 1;
    }
    if (dir !== 0) {
      const turning = Math.sign(body.velocity.x) === -dir;
      body.setAccelerationX(dir * st.accel * (turning ? 2.2 : 1) * (onGround ? 1 : 0.8));
      body.setDragX(0);
      this.facing = dir;
    } else {
      body.setAccelerationX(0);
      body.setDragX(onGround ? 1400 : 300);
    }
    body.setMaxVelocityX(maxSpeed);
    this.setFlipX(this.facing < 0);

    /* ---- jumping: coyote time + jump buffer + abilities ---- */
    if (onGround) {
      this.lastGrounded = time;
      this.extraJumps = this.maxExtraJumps();
    }
    if (inp.jumpPressed) this.lastJumpPressed = time;

    const buffered = time - this.lastJumpPressed <= JUMP_BUFFER_MS;
    const coyote = time - this.lastGrounded <= COYOTE_MS;
    const wallDir = (!onGround && this.hero.ability === 'wallJump')
      ? (body.blocked.left ? -1 : body.blocked.right ? 1 : 0) : 0;

    if (buffered) {
      if (onGround || coyote) {
        this.doJump(st.jump);
      } else if (wallDir !== 0) {
        body.setVelocityX(-wallDir * st.walkSpeed * 1.2);
        this.doJump(st.jump * 0.95);
        this.facing = -wallDir;
        this.wallLockUntil = time + 170;
      } else if (this.extraJumps > 0) {
        this.extraJumps--;
        this.doJump(st.jump * 0.9);
      }
    }

    // Variable jump height: releasing the button early cuts the jump short
    if (!inp.jumpHeld && body.velocity.y < -140) body.setVelocityY(-140);

    // Wall slide (Bilal)
    if (wallDir !== 0 && body.velocity.y > 70 && ((wallDir < 0 && inp.left) || (wallDir > 0 && inp.right))) {
      body.setVelocityY(70);
    }

    // Glide (Mahnoor, or anyone holding a patang power-up)
    if (!onGround && inp.jumpHeld && body.velocity.y > 55 && this.canGlide(time)) {
      body.setVelocityY(55);
    }

    /* ---- throwing cricket balls ---- */
    if (inp.actionPressed && this.canThrow() && time > this.cooldown) {
      this.scene.throwBall(this);
      this.cooldown = time + (this.hero.ability === 'fastThrow' ? 260 : 420);
    }

    /* ---- invulnerability flicker ---- */
    this.setAlpha(time < this.invulnUntil ? (Math.floor(time / 70) % 2 ? 0.35 : 1) : 1);

    /* ---- animation state ---- */
    if (!onGround) this.fsm.set(body.velocity.y < 0 ? 'jump' : 'fall');
    else this.fsm.set(Math.abs(body.velocity.x) > 12 ? 'run' : 'idle');
    this.wasGround = onGround;
    this.prevVy = body.velocity.y;
    if (this.fsm.current === 'run') this.anims.timeScale = Math.max(0.6, Math.abs(body.velocity.x) / 160);
    else this.anims.timeScale = 1;
  }

  doJump(power) {
    this.body.setVelocityY(-power);
    this.scene.fx.dust(this.x, this.body.bottom, 3);
    this.lastJumpPressed = -99999;
    this.lastGrounded = -99999;
    Sfx.jump();
  }

  hurt(time) {
    if (this.dead || this.frozen || time < this.invulnUntil) return;
    if (this.isBig || this.hasBall) {
      this.shrink();
      this.hasBall = false;
      this.speedUntil = 0;
      this.invulnUntil = time + 1600;
      Sfx.hurt();
      this.scene.cameras.main.shake(120, 0.006);
    } else {
      this.scene.playerDie();
    }
  }
}

class Enemy extends Phaser.Physics.Arcade.Sprite {
  constructor(scene, x, y, key) {
    super(scene, x, y, key, 0);
    scene.add.existing(this);
    scene.physics.add.existing(this);
    this.setDepth(6);
    if (scene.anims.exists(`${key}-move`)) this.play({ key: `${key}-move`, startFrame: Math.floor(Math.random() * 2) });
    this.alive = true;
    this.awake = false;
  }
  wake(time) {
    const cam = this.scene.cameras.main;
    if (!this.awake && Math.abs(this.x - (cam.scrollX + cam.width / 2)) < cam.width / 2 + 48) {
      this.awake = true;
      this.onWake(time);
    }
    return this.awake;
  }
  onWake() {}
  stomp() {
    if (!this.alive) return;
    this.alive = false;
    this.body.enable = false;
    this.anims.stop();
    this.scene.fx.poof(this.x, this.y);
    this.setScale(1.15, 0.35);
    this.y += this.displayHeight;
    this.scene.tweens.add({ targets: this, alpha: 0, delay: 250, duration: 200, onComplete: () => this.destroy() });
  }
  knockOut(dir = 1) {
    if (!this.alive) return;
    this.alive = false;
    this.body.enable = false;
    this.anims.stop();
    this.scene.fx.spark(this.x, this.y, 6);
    this.setFlipY(true);
    this.scene.tweens.add({ targets: this, x: this.x + dir * 30, y: this.y - 24, duration: 180, ease: 'Quad.out',
      onComplete: () => this.scene.tweens.add({ targets: this, y: this.y + 260, duration: 600, ease: 'Quad.in',
        onComplete: () => this.destroy() }) });
  }
}

/** Gol Gappa Goon: walks, turns at walls and ledges */
class Goon extends Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'goon');
    this.body.setSize(14, 12).setOffset(1, 4);
    this.speed = 40;
    this.dir = -1;
  }
  update(time) {
    if (!this.alive || !this.wake(time)) return;
    const b = this.body;
    if (b.blocked.left) this.dir = 1;
    else if (b.blocked.right) this.dir = -1;
    else if (b.blocked.down && !this.scene.isSolidAt(this.x + this.dir * 9, b.bottom + 4)) this.dir *= -1;
    b.setVelocityX(this.dir * this.speed);
    this.setFlipX(this.dir > 0);
    if (this.y > WORLD_H - 10) this.destroy();
  }
}

/** Machhar: hovers in a figure-of-eight */
class Machhar extends Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'machhar');
    this.body.setAllowGravity(false);
    this.body.setSize(12, 12).setOffset(2, 2);
    this.baseX = x; this.baseY = y;
    this.phase = Math.random() * Math.PI * 2;
  }
  update(time) {
    if (!this.alive) return;
    const t = time / 1000 + this.phase;
    this.x = this.baseX + Math.sin(t * 0.8) * 26;
    this.y = this.baseY + Math.sin(t * 3) * 10;
    this.setFlipX(Math.cos(t * 0.8) > 0);
  }
}

/** Shararti Kawwa: cruises, then swoops at the player */
class Kawwa extends Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'kawwa');
    this.body.setAllowGravity(false);
    this.body.setSize(16, 10).setOffset(2, 4);
    this.baseY = y;
    this.mode = 'cruise';
    this.nextDive = 0;
    this.modeUntil = 0;
  }
  update(time) {
    if (!this.alive || !this.wake(time)) return;
    const p = this.scene.player;
    const b = this.body;
    const floorY = this.scene.L.groundTop * TILE - 14;
    if (this.mode === 'cruise') {
      b.setVelocity(-45, Math.sin(time / 300) * 20);
      if (p && !p.dead && time > this.nextDive && Math.abs(p.x - this.x) < 110 && p.y > this.y + 10) {
        this.mode = 'dive';
        this.modeUntil = time + 650;
        b.setVelocity(Math.sign(p.x - this.x) * 110, 150);
      }
    } else if (this.mode === 'dive') {
      if (time > this.modeUntil || this.y >= floorY) {
        this.mode = 'rise';
        b.setVelocity(Math.sign(b.velocity.x || -1) * 60, -110);
      }
    } else if (this.mode === 'rise') {
      if (this.y <= this.baseY) {
        this.y = this.baseY;
        this.mode = 'cruise';
        this.nextDive = time + 1500;
      }
    }
    this.setFlipX(b.velocity.x < 0);
    if (this.x < -40) this.destroy();
  }
}

const ENEMY_TYPES = { goon: Goon, machhar: Machhar, kawwa: Kawwa };

/* ------------------------------ 10. UI HELPERS ---------------------------- */
const TXT = (size = 10, color = '#ffffff', extra = {}) =>
  Object.assign({ fontFamily: 'monospace', fontSize: `${size}px`, color, resolution: 3 }, extra);

function makeButton(scene, x, y, label, onClick, w = 110, h = 22) {
  const bg = scene.add.rectangle(x, y, w, h, 0x01411c).setStrokeStyle(2, 0xffd54f).setInteractive({ useHandCursor: true });
  const t = scene.add.text(x, y, label, TXT(10, '#ffffff', { fontStyle: 'bold' })).setOrigin(0.5);
  bg.on('pointerover', () => bg.setFillStyle(0x2e7d32));
  bg.on('pointerout', () => bg.setFillStyle(0x01411c));
  bg.on('pointerdown', () => { Sfx.init(); onClick(); });
  return { bg, t };
}

// truck-art style border
function truckBorder(scene) {
  const g = scene.add.graphics();
  const cols = [0xe91e63, 0xffd54f, 0x00bcd4, 0x8bc34a];
  for (let i = 0; i < GAME_WIDTH; i += 12) {
    g.fillStyle(cols[(i / 12) % 4], 1);
    g.fillTriangle(i, 0, i + 12, 0, i + 6, 8);
    g.fillTriangle(i, GAME_HEIGHT, i + 12, GAME_HEIGHT, i + 6, GAME_HEIGHT - 8);
  }
  return g;
}

class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init(data) {
    this.levelId = data.levelId || '1-1';
    this.respawnX = data.respawnX || null;
    this.L = LEVELS[this.levelId];
    const heroId = SaveManager.load().hero;
    this.hero = HEROES.find(h => h.id === heroId) || HEROES[0];
  }

  create() {
    const L = this.L;
    const W = L.width * TILE;
    const gt = L.groundTop * TILE;
    this.solid = new Set();
    this.timeLeft = LEVEL_TIME;
    this.stats = { jalebis: 0, enemies: 0, stars: new Set() };
    this.ending = false;
    this.checkpointHit = !!this.respawnX;

    buildLevelArt(this, L);
    this.cameras.main.fadeIn(250);

    /* world + camera */
    this.physics.world.setBounds(0, 0, W, WORLD_H);
    this.physics.world.setBoundsCollision(true, true, false, false);
    this.cameras.main.setBounds(0, 0, W, CAM_H).setBackgroundColor(L.sky).setRoundPixels(true);

    this.buildBackground();
    this.fx = new FX(this, { lahore: 0xd8b48a, karachi: 0xf1deb0, thar: 0xf0c98a }[this.themeName]);

    /* solid ground */
    this.groundGroup = this.physics.add.staticGroup();
    L.ground.forEach(([sx, len]) => {
      const x = sx * TILE, w = len * TILE, h = CAM_H + 32 - gt;
      this.add.tileSprite(x, gt, w, TILE, `gtop-${L.id}`).setOrigin(0).setDepth(2);
      this.add.tileSprite(x, gt + TILE, w, h - TILE, `gfill-${L.id}`).setOrigin(0).setDepth(2);
      const z = this.add.zone(x + w / 2, gt + h / 2, w, h);
      this.physics.add.existing(z, true);
      this.groundGroup.add(z);
      for (let c = sx; c < sx + len; c++) for (let r = L.groundTop; r < L.groundTop + 6; r++) this.solid.add(`${c},${r}`);
    });

    /* one-way platforms */
    this.platformGroup = this.physics.add.staticGroup();
    L.platforms.forEach(([sx, row, len]) => {
      const x = sx * TILE, y = row * TILE, w = len * TILE;
      this.add.tileSprite(x, y, w, TILE, `plat-${L.id}`).setOrigin(0).setDepth(2);
      const z = this.add.zone(x + w / 2, y + TILE / 2, w, TILE);
      this.physics.add.existing(z, true);
      z.body.checkCollision.down = false;
      z.body.checkCollision.left = false;
      z.body.checkCollision.right = false;
      this.platformGroup.add(z);
      for (let c = sx; c < sx + len; c++) this.solid.add(`${c},${row}`);
    });

    /* matka blocks */
    this.matkas = this.physics.add.staticGroup();
    L.matkas.forEach(([tx, ty], i) => {
      const m = this.matkas.create(tx * TILE + 8, ty * TILE + 8, 'matka').setDepth(3);
      m.used = false;
      m.idx = i;
      this.solid.add(`${tx},${ty}`);
    });

    /* collectibles */
    this.coins = this.physics.add.staticGroup();
    L.coins.forEach(([tx, ty]) => {
      const c = this.coins.create(tx * TILE + 8, ty * TILE + 8, 'jalebi').setDepth(4);
      this.tweens.add({ targets: c, scaleX: 0.4, duration: 420, yoyo: true, repeat: -1, delay: (tx * 37) % 400 });
    });
    this.starsGroup = this.physics.add.staticGroup();
    L.stars.forEach(([tx, ty], i) => {
      const s = this.starsGroup.create(tx * TILE + 8, ty * TILE + 8, 'star').setDepth(4);
      s.idx = i;
      this.tweens.add({ targets: s, angle: 360, duration: 2400, repeat: -1 });
    });
    this.items = this.physics.add.group({ allowGravity: false, immovable: true });

    /* checkpoint + flag */
    const cpX = L.checkpoint * TILE + 8;
    this.checkpoint = this.add.image(cpX, gt, this.checkpointHit ? 'cp-on' : 'cp-off').setOrigin(0.25, 1).setDepth(3);
    this.cpZone = this.add.zone(cpX, gt / 2, 16, gt);
    this.physics.add.existing(this.cpZone, true);
    const fX = L.flag * TILE + 8;
    this.add.image(fX, gt, 'pole').setOrigin(0.5, 1).setDepth(3);
    this.flagSprite = this.add.sprite(fX + 2, gt - 84, 'pkflag', 0).setOrigin(0, 0.5).setDepth(3).play('pkflag-move');
    this.flagZone = this.add.zone(fX, gt / 2, 10, gt);
    this.physics.add.existing(this.flagZone, true);

    /* enemies */
    this.walkers = this.physics.add.group({ runChildUpdate: true });
    this.flyers = this.physics.add.group({ runChildUpdate: true, allowGravity: false });
    L.enemies.forEach(e => {
      const Cls = ENEMY_TYPES[e.t];
      if (!Cls) return;
      if (this.respawnX && e.x * TILE < this.respawnX + 40) return; // keep checkpoint start fair
      const x = e.x * TILE + 8;
      if (e.t === 'goon') this.walkers.add(new Cls(this, x, gt - 8));
      else {
        const en = new Cls(this, x, (e.y || 9) * TILE + 8);
        this.flyers.add(en);
        en.body.setAllowGravity(false);
      }
    });

    /* player */
    this.inputMgr = new InputManager(this);
    const startX = this.respawnX || 3 * TILE;
    this.player = new Player(this, startX, gt - 24, this.hero, this.inputMgr);
    this.cameras.main.startFollow(this.player, true, 0.15, 0.15).setDeadzone(40, 60);

    /* cricket balls (object pool) */
    this.balls = this.physics.add.group({ maxSize: 3 });

    /* colliders & overlaps */
    const solids = [this.groundGroup, this.platformGroup, this.matkas];
    solids.forEach(s => {
      this.physics.add.collider(this.walkers, s);
      this.physics.add.collider(this.balls, s, b => this.ballBounce(b));
    });
    this.physics.add.collider(this.player, this.groundGroup);
    this.physics.add.collider(this.player, this.platformGroup);
    this.physics.add.collider(this.player, this.matkas, (p, m) => this.hitMatka(p, m));
    this.physics.add.overlap(this.player, [this.walkers, this.flyers], (p, e) => this.touchEnemy(p, e));
    this.physics.add.overlap(this.balls, [this.walkers, this.flyers], (b, e) => this.ballHit(b, e));
    this.physics.add.overlap(this.player, this.coins, (p, c) => this.getCoin(c));
    this.physics.add.overlap(this.player, this.starsGroup, (p, s) => this.getStar(s));
    this.physics.add.overlap(this.player, this.items, (p, it) => this.getItem(it));
    this.physics.add.overlap(this.player, this.cpZone, () => this.reachCheckpoint());
    this.physics.add.overlap(this.player, this.flagZone, () => this.reachFlag());

    /* HUD + level intro */
    this.registry.set({ time: LEVEL_TIME, levelName: L.name, levelId: L.id, starsGot: 0, power: '' });
    this.scene.launch('HUD', { inputMgr: this.inputMgr });
    this.scene.bringToTop('HUD');
    this.showBanner(`${L.id}  ${L.name}`);

    this.keyPause = [this.inputMgr.keys.ESC, this.inputMgr.keys.P];
    this.events.on('resume', () => window.__resetTouch());
    document.body.classList.add('playing');
    this.events.once('shutdown', () => { document.body.classList.remove('playing'); window.__resetTouch(); });

    if (EXPOSE) window.__game = this;
  }

  buildBackground() {
    const L = this.L, gt = L.groundTop * TILE, th = themeOf(L);
    this.themeName = th;
    this.add.image(0, 0, `sky-${L.id}`).setOrigin(0).setScrollFactor(0).setDepth(-10);
    this.add.image(th === 'thar' ? 370 : 405, th === 'thar' ? 54 : 44, 'sun').setScrollFactor(0).setDepth(-9).setScale(th === 'thar' ? 1.5 : 1);

    // clouds (and kites over Lahore) drift with slow parallax
    for (let i = 0; i < Math.ceil(L.width / 18); i++) {
      const x = i * 280 + (i * 97) % 140, y = 16 + (i * 53) % 52;
      this.add.image(x, y, 'cloud').setScrollFactor(0.1 + (i % 3) * 0.05).setDepth(-8)
        .setAlpha(th === 'thar' ? 0.55 : 0.95).setScale(i % 2 ? 1 : 0.7);
      if (th === 'lahore' && i % 2 === 0) {
        const k = this.add.image(x + 110, y + 34, 'patang').setScrollFactor(0.22).setDepth(-7.5)
          .setTint([0xffffff, 0xa5d6a7, 0x90caf9, 0xf8bbd0][i % 4]);
        this.tweens.add({ targets: k, y: k.y - 8, angle: 12, duration: 1400 + i * 90, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
      }
    }

    const layer = (key, bottom, depth) => {
      if (!this.textures.exists(key)) return null;
      const h = this.textures.get(key).getSourceImage().height;
      return this.add.tileSprite(0, bottom - h, GAME_WIDTH, h, key).setOrigin(0).setScrollFactor(0).setDepth(depth);
    };
    this.far = layer(`far-${L.id}`, th === 'karachi' ? gt - 54 : gt + 22, -7);
    const pit = { lahore: 0x4a2f2a, karachi: 0x1d5f85, thar: 0xa8733f }[th];
    this.add.rectangle(0, gt + 4, GAME_WIDTH, CAM_H - gt, pit).setOrigin(0).setScrollFactor(0).setDepth(-4.5);
    this.add.rectangle(0, gt + 4, GAME_WIDTH, 6, 0x000000, 0.18).setOrigin(0).setScrollFactor(0).setDepth(-4.4);
    this.mid = layer(`mid-${L.id}`, gt + (th === 'lahore' ? 6 : 12), -6);
    this.near = layer(`near-${L.id}`, gt + 4, -5);
  }

  isSolidAt(px, py) {
    return this.solid.has(`${Math.floor(px / TILE)},${Math.floor(py / TILE)}`);
  }

  showBanner(text) {
    const t = this.add.text(GAME_WIDTH / 2, 70, text, TXT(14, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }))
      .setOrigin(0.5).setScrollFactor(0).setDepth(50);
    this.tweens.add({ targets: t, alpha: 0, delay: 1400, duration: 500, onComplete: () => t.destroy() });
  }

  floatText(x, y, str, color = '#ffffff') {
    const t = this.add.text(x, y, str, TXT(8, color, { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 })).setOrigin(0.5).setDepth(40);
    this.tweens.add({ targets: t, y: y - 18, alpha: 0, duration: 700, onComplete: () => t.destroy() });
  }

  addScore(n) { this.registry.inc('score', n); }

  /* ---------- interactions ---------- */
  touchEnemy(p, e) {
    if (!e.alive || p.dead || this.ending) return;
    const falling = p.body.velocity.y > 0 && p.body.bottom <= e.body.top + 10;
    if (falling) {
      e.stomp();
      p.body.setVelocityY(this.inputMgr.jumpHeld ? -360 : -240);
      this.stats.enemies++;
      this.addScore(100);
      this.floatText(e.x, e.y - 8, '100');
      Sfx.stomp();
    } else {
      p.hurt(this.time.now);
    }
  }

  hitMatka(p, m) {
    if (m.used || this.ending) return;
    const fromBelow = (p.body.touching.up || p.body.blocked.up) && p.body.top >= m.body.bottom - 4 &&
      Math.abs(p.x - m.x) < 14;
    if (!fromBelow) return;
    m.used = true;
    m.setTexture('matka-used');
    this.fx.spark(m.x, m.y - 8, 6);
    this.tweens.add({ targets: m, y: m.y - 5, duration: 70, yoyo: true });
    const kind = !p.isBig ? 'samosa' : ['ball', 'chai', 'patang'][m.idx % 3];
    const it = this.items.create(m.x, m.y, kind).setDepth(2);
    it.kind = kind;
    it.body.enable = false;
    this.tweens.add({ targets: it, y: m.y - 16, duration: 300, onComplete: () => {
      if (!it.active) return;
      it.body.enable = true;
      this.tweens.add({ targets: it, y: it.y - 3, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    } });
    Sfx.coin();
  }

  getItem(it) {
    if (!it.active) return;
    const p = this.player;
    const now = this.time.now;
    const label = { samosa: 'SAMOSA! BIG', chai: 'CHAI! SPEED', patang: 'PATANG! GLIDE', ball: 'CRICKET BALL! (J)' }[it.kind];
    if (it.kind === 'samosa') p.grow();
    if (it.kind === 'chai') p.speedUntil = now + 10000;
    if (it.kind === 'patang') p.glideUntil = now + 10000;
    if (it.kind === 'ball') { p.hasBall = true; if (!p.isBig) p.grow(); }
    this.floatText(it.x, it.y - 10, label, '#ffd54f');
    this.fx.spark(p.x, p.y, 14);
    it.destroy();
    Sfx.power();
  }

  getCoin(c) {
    c.disableBody(true, true);
    this.fx.spark(c.x, c.y, 5);
    this.stats.jalebis++;
    this.addScore(10);
    this.registry.inc('jalebis', 1);
    if (this.registry.get('jalebis') >= 100) {
      this.registry.inc('jalebis', -100);
      this.registry.inc('lives', 1);
      this.floatText(this.player.x, this.player.y - 20, '1UP!', '#76ff03');
      Sfx.power();
    } else Sfx.coin();
  }

  getStar(s) {
    s.disableBody(true, true);
    this.fx.spark(s.x, s.y, 18);
    this.stats.stars.add(s.idx);
    this.registry.set('starsGot', this.stats.stars.size);
    this.addScore(1000);
    this.floatText(s.x, s.y - 10, 'TAARA! 1000', '#ffd54f');
    Sfx.star();
  }

  reachCheckpoint() {
    if (this.checkpointHit) return;
    this.checkpointHit = true;
    this.respawnX = this.L.checkpoint * TILE + 8;
    this.checkpoint.setTexture('cp-on');
    this.fx.spark(this.checkpoint.x + 6, this.checkpoint.y - 30, 12);
    this.floatText(this.checkpoint.x, this.checkpoint.y - 44, 'CHECKPOINT', '#76ff03');
    Sfx.power();
  }

  throwBall(p) {
    const b = this.balls.get(p.x + p.facing * 10, p.y - 2, 'ball');
    if (!b) return;
    b.setActive(true).setVisible(true).setDepth(9);
    b.body.enable = true;
    b.body.reset(p.x + p.facing * 10, p.y - 2);
    b.body.setAllowGravity(true);
    b.body.setCircle(4, 1, 1);
    b.setBounce(0.65, 0.65);
    const speed = p.hero.ability === 'fastThrow' ? 340 : 280;
    b.setVelocity(p.facing * speed, -80);
    b.dir = p.facing;
    b.dieAt = this.time.now + 1600;
    Sfx.throwB();
  }

  ballBounce(b) {
    if (b.body.blocked.left || b.body.blocked.right) this.killBall(b);
    else if (b.body.blocked.down) b.setVelocityY(-200);
  }

  ballHit(b, e) {
    if (!b.active || !e.alive) return;
    e.knockOut(b.dir);
    this.killBall(b);
    this.stats.enemies++;
    this.addScore(100);
    this.floatText(e.x, e.y - 8, '100');
    Sfx.stomp();
  }

  killBall(b) {
    b.setActive(false).setVisible(false);
    b.body.enable = false;
  }

  playerDie() {
    const p = this.player;
    if (p.dead || this.ending) return;
    p.dead = true;
    p.body.enable = false;
    p.setAlpha(1).setFrame(7).anims.stop();
    Sfx.hurt();
    this.cameras.main.stopFollow();
    this.tweens.add({ targets: p, y: p.y - 40, duration: 350, ease: 'Quad.out',
      onComplete: () => this.tweens.add({ targets: p, y: p.y + 320, duration: 800, ease: 'Quad.in' }) });
    this.time.delayedCall(1500, () => {
      this.registry.inc('lives', -1);
      if (this.registry.get('lives') <= 0) {
        this.scene.stop('HUD');
        this.scene.start('GameOver', { levelId: this.levelId });
      } else {
        this.scene.restart({ levelId: this.levelId, respawnX: this.checkpointHit ? this.respawnX : null });
      }
    });
  }

  reachFlag() {
    if (this.ending || this.player.dead) return;
    this.ending = true;
    const p = this.player;
    p.frozen = true;
    p.body.setVelocity(0, 0).setAcceleration(0, 0);
    p.setAlpha(1);
    Sfx.flag();
    this.fx.confetti(this.flagSprite.x + 14, this.flagSprite.y, 50);
    this.time.delayedCall(500, () => this.fx.confetti(p.x, p.y - 20, 40));
    const timeLeft = Math.max(0, Math.floor(this.timeLeft));
    const levelPts = levelScore({ jalebis: this.stats.jalebis, enemies: this.stats.enemies, timeLeft, stars: this.stats.stars.size });
    this.addScore(timeLeft * 5);
    SaveManager.complete(this.levelId, levelPts, this.stats.stars.size, this.L.next);
    this.time.delayedCall(1800, () => {
      this.scene.stop('HUD');
      this.scene.start('LevelComplete', {
        levelId: this.levelId, jalebis: this.stats.jalebis, enemies: this.stats.enemies,
        timeLeft, stars: this.stats.stars.size, levelPts
      });
    });
  }

  update(time, delta) {
    this.inputMgr.update();
    const p = this.player;

    if (!this.ending && !p.dead) {
      if (this.keyPause.some(k => Phaser.Input.Keyboard.JustDown(k)) || this.inputMgr.pausePressed) {
        this.inputMgr.pausePressed = false;
        this.scene.launch('Pause');
        this.scene.pause();
        return;
      }
      this.timeLeft -= delta / 1000;
      this.registry.set('time', Math.max(0, Math.ceil(this.timeLeft)));
      if (this.timeLeft <= 0) this.playerDie();
      if (p.y > CAM_H + 24) this.playerDie();
    }
    p.update(time, delta);

    // power-up label for the HUD
    const pw = [];
    if (p.canThrow()) pw.push('BALL');
    if (time < p.speedUntil) pw.push(`CHAI ${Math.ceil((p.speedUntil - time) / 1000)}`);
    if (time < p.glideUntil) pw.push(`PATANG ${Math.ceil((p.glideUntil - time) / 1000)}`);
    this.registry.set('power', pw.join('  '));

    // balls lifetime
    this.balls.getChildren().forEach(b => { if (b.active && (time > b.dieAt || b.y > CAM_H + 20)) this.killBall(b); });

    // parallax
    const cam = this.cameras.main;
    if (this.far) this.far.tilePositionX = cam.scrollX * 0.12;
    if (this.mid) this.mid.tilePositionX = cam.scrollX * 0.3 + (this.themeName === 'karachi' ? time * 0.004 : 0);
    if (this.near) this.near.tilePositionX = cam.scrollX * 0.55;
  }
}

class HUDScene extends Phaser.Scene {
  constructor() { super('HUD'); }
  init(data) { this.inputMgr = data.inputMgr; }
  create() {
    const g = this.add.graphics();
    g.fillStyle(0x01411c, 0.95).fillRect(0, 0, GAME_WIDTH, 22);
    g.fillStyle(0xffd54f, 1).fillRect(0, 22, GAME_WIDTH, 1);
    const cols = [0xe91e63, 0xffd54f, 0x00bcd4, 0x8bc34a];
    for (let i = 0; i < GAME_WIDTH; i += 10) g.fillStyle(cols[(i / 10) % 4], 0.9).fillTriangle(i, 23, i + 10, 23, i + 5, 27);

    const s = TXT(9, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 });
    const heroId = SaveManager.load().hero;
    this.add.image(0, -1, heroId, 0).setOrigin(0).setCrop(5, 0, 14, 13);
    this.livesT = this.add.text(21, 6, '', s);
    this.scoreT = this.add.text(52, 6, '', s);
    this.add.image(156, 11, 'jalebi');
    this.coinT = this.add.text(165, 6, '', s);
    this.starImgs = [0, 1, 2].map(i => this.add.image(214 + i * 15, 11, 'star').setScale(0.85));
    this.levelT = this.add.text(268, 6, '', TXT(9, '#c8e6c9', { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }));
    this.timeT = this.add.text(GAME_WIDTH - 98, 6, '', s);
    this.powerT = this.add.text(8, 30, '', TXT(8, '#80deea', { fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }));

    const pauseBtn = this.add.text(GAME_WIDTH - 8, 4, 'II', TXT(11, '#01411c', { fontStyle: 'bold', backgroundColor: '#ffd54f', padding: { x: 4, y: 1 } }))
      .setOrigin(1, 0).setInteractive({ useHandCursor: true });
    pauseBtn.on('pointerdown', () => { if (this.inputMgr) this.inputMgr.pausePressed = true; });
    if (IS_TOUCH && this.scale.fullscreen.available) {
      const fs = this.add.text(GAME_WIDTH - 34, 4, '⛶', TXT(11, '#01411c', { fontStyle: 'bold', backgroundColor: '#ffd54f', padding: { x: 3, y: 1 } }))
        .setOrigin(1, 0).setInteractive({ useHandCursor: true });
      fs.on('pointerup', () => { if (this.scale.isFullscreen) this.scale.stopFullscreen(); else goFullscreen(this); });
      this.timeT.x -= 22;
    }


  }

  update() {
    const r = this.registry;
    this.scoreT.setText(String(r.get('score') || 0).padStart(7, '0'));
    this.coinT.setText(`x${r.get('jalebis') || 0}`);
    const got = r.get('starsGot') || 0;
    this.starImgs.forEach((im, i) => im.setAlpha(i < got ? 1 : 0.28));
    this.livesT.setText(`x${r.get('lives')}`);
    this.levelT.setText(`WORLD ${r.get('levelId')}`);
    const t = r.get('time');
    this.timeT.setText(`TIME ${t}`).setColor(t <= 50 ? '#ff8a80' : '#ffffff');
    this.powerT.setText(r.get('power') || '');
  }
}

class PauseScene extends Phaser.Scene {
  constructor() { super('Pause'); }
  create() {
    this.add.rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.6).setOrigin(0);
    this.add.text(GAME_WIDTH / 2, 70, 'PAUSED', TXT(24, '#ffd54f', { fontStyle: 'bold' })).setOrigin(0.5);
    makeButton(this, GAME_WIDTH / 2, 120, 'RESUME', () => this.resumeGame(), 140);
    makeButton(this, GAME_WIDTH / 2, 150, Sfx.muted ? 'SOUND: OFF' : 'SOUND: ON', () => {
      Sfx.muted = !Sfx.muted;
      const d = SaveManager.load(); d.muted = Sfx.muted; SaveManager.save(d);
      this.scene.restart();
    }, 140);
    makeButton(this, GAME_WIDTH / 2, 180, 'QUIT TO LEVELS', () => {
      this.scene.stop('HUD'); this.scene.stop('Game'); this.scene.start('LevelSelect');
    }, 140);
    this.input.keyboard.on('keydown-ESC', () => this.resumeGame());
    this.input.keyboard.on('keydown-P', () => this.resumeGame());
    this.input.keyboard.on('keydown-ENTER', () => this.resumeGame());
  }
  resumeGame() { this.scene.resume('Game'); this.scene.stop(); }
}

class LevelCompleteScene extends Phaser.Scene {
  constructor() { super('LevelComplete'); }
  init(d) { this.d = d; }
  create() {
    this.cameras.main.fadeIn(250);
    const d = this.d;
    const L = LEVELS[d.levelId];
    const last = !L.next;
    this.cameras.main.setBackgroundColor('#01411c');
    truckBorder(this);
    this.add.text(GAME_WIDTH / 2, 36, last ? 'KITE RECOVERED!' : 'SHABAASH!', TXT(24, '#ffd54f', { fontStyle: 'bold', stroke: '#000', strokeThickness: 4 })).setOrigin(0.5);
    this.add.text(GAME_WIDTH / 2, 62, `${L.id}  ${L.name} complete`, TXT(10)).setOrigin(0.5);
    const lines = [
      ['Jalebis', `${d.jalebis} x 10`, d.jalebis * 10],
      ['Enemies', `${d.enemies} x 100`, d.enemies * 100],
      ['Time left', `${d.timeLeft} x 5`, d.timeLeft * 5],
      ['Taaray', `${d.stars} x 1000`, d.stars * 1000]
    ];
    lines.forEach(([a, b, c], i) => {
      const y = 88 + i * 18;
      this.add.text(120, y, a, TXT(10)).setOrigin(0, 0.5);
      this.add.text(250, y, b, TXT(10, '#c8e6c9')).setOrigin(0.5);
      this.add.text(360, y, String(c), TXT(10, '#ffd54f', { fontStyle: 'bold' })).setOrigin(1, 0.5);
    });
    this.add.text(120, 170, 'LEVEL SCORE', TXT(11, '#ffffff', { fontStyle: 'bold' })).setOrigin(0, 0.5);
    this.add.text(360, 170, String(d.levelPts), TXT(11, '#ffd54f', { fontStyle: 'bold' })).setOrigin(1, 0.5);
    if (last) this.add.text(GAME_WIDTH / 2, 192, 'The festival sky is colourful again. Thank you, hero!', TXT(9, '#80deea')).setOrigin(0.5);

    const next = () => {
      if (last) this.scene.start('LevelSelect');
      else this.scene.start('Game', { levelId: L.next });
    };
    makeButton(this, GAME_WIDTH / 2 - 70, 226, 'LEVELS', () => this.scene.start('LevelSelect'), 110);
    makeButton(this, GAME_WIDTH / 2 + 70, 226, last ? 'FINISH' : 'NEXT >', next, 110);
    this.input.keyboard.once('keydown-ENTER', next);
    this.input.keyboard.once('keydown-SPACE', next);
  }
}

class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOver'); }
  init(d) { this.d = d; }
  create() {
    this.cameras.main.fadeIn(250);
    this.cameras.main.setBackgroundColor('#1a1a1a');
    this.add.text(GAME_WIDTH / 2, 80, 'GAME OVER', TXT(28, '#e53935', { fontStyle: 'bold', stroke: '#000', strokeThickness: 4 })).setOrigin(0.5);
    this.add.text(GAME_WIDTH / 2, 116, `Final score: ${this.registry.get('score') || 0}`, TXT(12)).setOrigin(0.5);
    this.add.text(GAME_WIDTH / 2, 136, 'Himmat na haaro! Try again.', TXT(10, '#a5d6a7')).setOrigin(0.5);
    const retry = () => {
      this.registry.set({ score: 0, lives: START_LIVES, jalebis: 0 });
      this.scene.start('Game', { levelId: this.d.levelId });
    };
    makeButton(this, GAME_WIDTH / 2 - 70, 190, 'RETRY', retry, 110);
    makeButton(this, GAME_WIDTH / 2 + 70, 190, 'LEVELS', () => this.scene.start('LevelSelect'), 110);
    this.input.keyboard.once('keydown-ENTER', retry);
    this.input.keyboard.once('keydown-SPACE', retry);
  }
}

/* ------------------------------ 12. BOOTSTRAP ----------------------------- */
const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: GAME_WIDTH,
  height: GAME_HEIGHT,
  pixelArt: true,
  backgroundColor: '#0b0f14',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, fullscreenTarget: 'app' },
  physics: { default: 'arcade', arcade: { gravity: { y: GRAVITY }, debug: DEBUG } },
  input: { gamepad: true, activePointers: 4 },
  scene: [BootScene, MenuScene, CharacterSelectScene, LevelSelectScene, GameScene, HUDScene,
          PauseScene, LevelCompleteScene, GameOverScene]
});
if (EXPOSE) window.__phaser = game;

// Keep the game exactly the size of the *visible* screen (mobile address bars change it).
function fitToScreen() {
  const el = document.getElementById('game');
  const vv = window.visualViewport;
  el.style.width = Math.round(vv ? vv.width : window.innerWidth) + 'px';
  el.style.height = Math.round(vv ? vv.height : window.innerHeight) + 'px';
  if (game.canvas && game.isBooted) game.scale.refresh();
  // size the touch buttons to fit the empty strips beside the game where possible
  const w = vv ? vv.width : window.innerWidth, h = vv ? vv.height : window.innerHeight;
  const strip = (w - Math.min(w, h * GAME_WIDTH / GAME_HEIGHT)) / 2;
  const size = strip >= 80 ? Math.max(52, Math.min(84, h * 0.2, (strip - 28) / 2.18))
                           : Math.max(60, Math.min(96, h * 0.13, w * 0.09));   // no side strips (tablets)
  document.getElementById('pad').style.setProperty('--s', Math.round(size) + 'px');
}
window.addEventListener('resize', fitToScreen);
window.addEventListener('orientationchange', () => setTimeout(fitToScreen, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitToScreen);
game.events.once('ready', fitToScreen);
fitToScreen();
</script>

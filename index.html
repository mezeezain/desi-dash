/* ------------------------------ 3. TEXTURES -------------------------------- */
function makeTex(scene, key, w, h, draw) {
  if (scene.textures.exists(key)) return;
  const t = scene.textures.createCanvas(key, w, h);
  const ctx = t.getContext();
  draw(ctx, w, h);
  t.refresh();
}

const FW = 24, FH = 32, HERO_FRAMES = 8;

function drawHeroFrame(ctx, ox, oy, p, frame) {
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(ox + x, oy + y, w, h); };

  let legA = 0, legB = 0, bob = 0;
  if (frame === 2 || frame === 4) { legA = -2; legB = 2; bob = -1; }
  else if (frame === 3 || frame === 5) { legA = 2; legB = -2; }
  else if (frame === 6) { legA = -3; legB = 2; }        // jump
  else if (frame === 7) { legA = 2; legB = -3; }        // fall

  // legs + shoes
  R(7 + legA, 24, 4, 8, p.bottom);
  R(13 + legB, 24, 4, 8, p.bottom);
  R(6 + legA, 30, 6, 2, p.shoe);
  R(12 + legB, 30, 6, 2, p.shoe);
  // long hair (girls): drawn first so body, arms and dupatta sit in front
  if (p.longHair) {
    R(5, 2 + bob, 14, 4, p.hair);
    R(5, 2 + bob, 3, 16, p.hair);
    R(16, 2 + bob, 3, 16, p.hair);
  }
  // body
  R(6, 13 + bob, 12, 11, p.top);
  // arms
  R(3, 14 + bob, 3, 8, p.skin);
  R(18, 14 + bob, 3, 8, p.skin);
  // scarf / dupatta
  if (p.scarf) R(4, 12 + bob, 16, 3, p.scarf);
  // head
  R(7, 3 + bob, 10, 10, p.skin);
  // hair / cap
  R(6, 1 + bob, 12, 4, p.hair);
  if (p.cap) R(5, 2 + bob, 14, 2, p.cap);
  // eyes + mouth
  R(9, 7 + bob, 2, 2, '#222');
  R(13, 7 + bob, 2, 2, '#222');
  R(11, 10 + bob, 2, 1, '#8d5524');
}

  makeTex(scene, 'bg-far', 480, 140, (c, w, h) => {

function createAnimations(scene) {
  HEROES.forEach(h => {
    const make = (name, frames, rate, repeat = -1) => {
      const key = `${h.id}-${name}`;
      if (scene.anims.exists(key)) return;
      scene.anims.create({
        key, frameRate: rate, repeat,
        frames: frames.map(f => ({ key: h.id, frame: f }))
      });
    };
    make('idle', [0, 1], 4);
    make('walk', [2, 3, 4, 5], 10);
    make('jump', [6], 1, 0);
    make('fall', [7], 1, 0);
  });
}

/* ------------------------------ 4. AUDIO (synth) --------------------------- */
const Sfx = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
  },
  tone(freq, dur = 0.1, type = 'square', vol = 0.07) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  seq(notes, gap = 70, type = 'square', vol = 0.06) {
    notes.forEach((f, i) => setTimeout(() => this.tone(f, 0.11, type, vol), i * gap));
  },
  jump()  { this.tone(520, 0.10, 'square'); setTimeout(() => this.tone(780, 0.07, 'square'), 45); },
  coin()  { this.tone(1046, 0.06, 'square', 0.05); setTimeout(() => this.tone(1568, 0.08, 'square', 0.05), 55); },
  stomp() { this.tone(180, 0.09, 'sawtooth', 0.08); },
  hurt()  { this.tone(220, 0.18, 'sawtooth', 0.09); setTimeout(() => this.tone(110, 0.22, 'sawtooth', 0.09), 90); },
  power() { this.seq([523, 659, 784, 1046], 65, 'triangle', 0.07); },
  star()  { this.seq([1318, 1568, 2093], 75, 'triangle', 0.06); },
  flag()  { this.seq([523, 659, 784, 1046, 1318], 100, 'square', 0.06); },
  throwB(){ this.tone(700, 0.05, 'triangle', 0.05); }
};

/* ------------------------------ 5. SAVE ----------------------------------- */
const SaveManager = {
  KEY: 'desi-dash-save-v1',
  DEFAULT() { return { unlocked: ['1-1'], best: {}, stars: {}, hero: 'ali', muted: false }; },
  load() {
    try { return Object.assign(this.DEFAULT(), JSON.parse(localStorage.getItem(this.KEY) || '{}')); }
    catch (e) { return this.DEFAULT(); }
  },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) { } },
  complete(id, score, stars, next) {
    const d = this.load();
    d.best[id] = Math.max(d.best[id] || 0, score);
    d.stars[id] = Math.max(d.stars[id] || 0, stars);
    if (next && !d.unlocked.includes(next)) d.unlocked.push(next);
    this.save(d);
  },
  setHero(id) { const d = this.load(); d.hero = id; this.save(d); }
};

/* ------------------------------ 7. STATE MACHINE --------------------------- */
class StateMachine {
  constructor(owner) { this.owner = owner; this.states = {}; this.current = null; }
  add(name, def = {}) { this.states[name] = def; return this; }
  set(name) {
    if (this.current === name || !this.states[name]) return;
    const prev = this.states[this.current];
    if (prev && prev.exit) prev.exit.call(this.owner);
    this.current = name;
    const next = this.states[name];
    if (next && next.enter) next.enter.call(this.owner);
  }
  update(dt) {
    const s = this.states[this.current];
    if (s && s.update) s.update.call(this.owner, dt);
  }
}

/* ------------------------------ 8. INPUT ---------------------------------- */
class InputManager {
  constructor(scene) {
    this.scene = scene;
    this.keys = scene.input.keyboard.addKeys('LEFT,RIGHT,UP,SPACE,A,D,W,J,SHIFT,ESC,P,ENTER');
    this.touch = { left: false, right: false, jump: false, action: false };
    this.pad = null;
    if (scene.input.gamepad) {
      scene.input.gamepad.once('connected', p => { this.pad = p; });
    }
    this.prevJump = false;
    this.prevAction = false;
    this.jumpPressed = false;
    this.actionPressed = false;
    this.pausePressed = false;
  }
  stickX() { return this.pad && this.pad.leftStick ? this.pad.leftStick.x : 0; }
  padBtn(i) {
    const b = this.pad && this.pad.buttons && this.pad.buttons[i];
    return !!(b && b.pressed);
  }
  get left()  { const k = this.keys; return !!(k.LEFT.isDown || k.A.isDown || this.touch.left  || this.padBtn(14) || this.stickX() < -0.4); }
  get right() { const k = this.keys; return !!(k.RIGHT.isDown || k.D.isDown || this.touch.right || this.padBtn(15) || this.stickX() > 0.4); }
  get run()   { const k = this.keys; return !!(k.SHIFT.isDown || k.J.isDown || this.touch.action || this.padBtn(2)); }
  get jumpHeld() {
    const k = this.keys;
    return !!(k.SPACE.isDown || k.UP.isDown || k.W.isDown || this.touch.jump || this.padBtn(0));
  }
  get actionHeld() {
    const k = this.keys;
    return !!(k.J.isDown || k.SHIFT.isDown || this.touch.action || this.padBtn(2));
  }
  update() {
    const j = this.jumpHeld;
    this.jumpPressed = j && !this.prevJump;
    this.prevJump = j;

    const a = this.keys.J.isDown || this.padBtn(2) || this.touch.action;
    this.actionPressed = a && !this.prevAction;
    this.prevAction = a;
  }
}

/* ------------------------------ 9. ENTITIES ------------------------------- */
class Player extends Phaser.Physics.Arcade.Sprite {
  constructor(scene, x, y, hero, inputMgr) {
    super(scene, x, y, hero.id, 0);
    scene.add.existing(this);
    scene.physics.add.existing(this);

    this.hero = hero;
    this.inputMgr = inputMgr;
    this.setDepth(10);
    this.body.setSize(12, 26).setOffset(6, 6);
    this.setCollideWorldBounds(true);
    this.body.setMaxVelocityY(MAX_FALL_SPEED);

    this.facing = 1;
    this.isBig = false;
    this.hasBall = false;
    this.invulnUntil = 0;
    this.cooldown = 0;
    this.extraJumps = 0;
    this.lastGrounded = -99999;
    this.lastJumpPressed = -99999;
    this.wallLockUntil = 0;
    this.speedUntil = 0;
    this.glideUntil = 0;
    this.dead = false;
    this.frozen = false;

    this.fsm = new StateMachine(this)
      .add('idle', { enter() { this.playAnim('idle'); } })
      .add('run',  { enter() { this.playAnim('walk'); } })
      .add('jump', { enter() { this.playAnim('jump'); } })
      .add('fall', { enter() { this.playAnim('fall'); } });
    this.fsm.set('idle');

    // Hamza is strong: he starts every life already "big"
    if (hero.ability === 'brickBreaker') this.grow();
  }

  playAnim(name) {
    const key = `${this.hero.id}-${name}`;
    if (!this.anims.currentAnim || this.anims.currentAnim.key !== key) this.play(key, true);
  }

  maxExtraJumps() { return this.hero.ability === 'doubleJump' ? 1 : 0; }
  canGlide(time)  { return this.hero.ability === 'glide' || time < this.glideUntil; }
  canThrow()      { return this.hero.ability === 'fastThrow' || this.hasBall; }

  grow() {
    if (this.isBig) return;
    this.isBig = true;
    this.setScale(1.25);
    this.y -= 4;
  }

  shrink() {
    this.isBig = false;
    this.setScale(1);
  }

  update(time) {
    if (this.dead || this.frozen) return;
    const inp = this.inputMgr;
    const st = this.hero.stats;
    const body = this.body;
    const onGround = body.blocked.down || body.touching.down;

    /* ---- horizontal movement (acceleration + drag) ---- */
    const speedMul = time < this.speedUntil ? 1.5 : 1;
    const maxSpeed = (inp.run ? st.runSpeed : st.walkSpeed) * speedMul;
    let dir = 0;
    if (time >= this.wallLockUntil) {
      if (inp.left) dir -= 1;
      if (inp.right) dir += 1;
    }
    if (dir !== 0) {
      const turning = Math.sign(body.velocity.x) === -dir;
      body.setAccelerationX(dir * st.accel * (turning ? 2.2 : 1) * (onGround ? 1 : 0.8));
      body.setDragX(0);
      this.facing = dir;
    } else {
      body.setAccelerationX(0);
      body.setDragX(onGround ? 1400 : 300);
    }
    body.setMaxVelocityX(maxSpeed);
    this.setFlipX(this.facing < 0);

    /* ---- jumping: coyote time + jump buffer + abilities ---- */
    if (onGround) {
      this.lastGrounded = time;
      this.extraJumps = this.maxExtraJumps();
    }
    if (inp.jumpPressed) this.lastJumpPressed = time;

    const buffered = time - this.lastJumpPressed <= JUMP_BUFFER_MS;
    const coyote = time - this.lastGrounded <= COYOTE_MS;
    const wallDir = (!onGround && this.hero.ability === 'wallJump')
      ? (body.blocked.left ? -1 : body.blocked.right ? 1 : 0) : 0;

    if (buffered) {
      if (onGround || coyote) {
        this.doJump(st.jump);
      } else if (wallDir !== 0) {
        body.setVelocityX(-wallDir * st.walkSpeed * 1.2);
        this.doJump(st.jump * 0.95);
        this.facing = -wallDir;
        this.wallLockUntil = time + 170;
      } else if (this.extraJumps > 0) {
        this.extraJumps--;
        this.doJump(st.jump * 0.9);
      }
    }

    // Variable jump height: releasing the button early cuts the jump short
    if (!inp.jumpHeld && body.velocity.y < -140) body.setVelocityY(-140);

    // Wall slide (Bilal)
    if (wallDir !== 0 && body.velocity.y > 70 && ((wallDir < 0 && inp.left) || (wallDir > 0 && inp.right))) {
      body.setVelocityY(70);
    }

    // Glide (Mahnoor, or anyone holding a patang power-up)
    if (!onGround && inp.jumpHeld && body.velocity.y > 55 && this.canGlide(time)) {
      body.setVelocityY(55);
    }

    /* ---- throwing cricket balls ---- */
    if (inp.actionPressed && this.canThrow() && time > this.cooldown) {
      this.scene.throwBall(this);
      this.cooldown = time + (this.hero.ability === 'fastThrow' ? 260 : 420);
    }

    /* ---- invulnerability flicker ---- */
    this.setAlpha(time < this.invulnUntil ? (Math.floor(time / 70) % 2 ? 0.35 : 1) : 1);

    /* ---- animation state ---- */
    if (!onGround) this.fsm.set(body.velocity.y < 0 ? 'jump' : 'fall');
    else this.fsm.set(Math.abs(body.velocity.x) > 12 ? 'run' : 'idle');
    if (this.fsm.current === 'run') this.anims.timeScale = Math.max(0.6, Math.abs(body.velocity.x) / 160);
    else this.anims.timeScale = 1;
  }

  doJump(power) {
    this.body.setVelocityY(-power);
    this.lastJumpPressed = -99999;
    this.lastGrounded = -99999;
    Sfx.jump();
  }

  hurt(time) {
    if (this.dead || this.frozen || time < this.invulnUntil) return;
    if (this.isBig || this.hasBall) {
      this.shrink();
      this.hasBall = false;
      this.speedUntil = 0;
      this.invulnUntil = time + 1600;
      Sfx.hurt();
      this.scene.cameras.main.shake(120, 0.006);
    } else {
      this.scene.playerDie();
    }
  }
}

class Enemy extends Phaser.Physics.Arcade.Sprite {
  constructor(scene, x, y, key) {
    super(scene, x, y, key);
    scene.add.existing(this);
    scene.physics.add.existing(this);
    this.setDepth(6);
    this.alive = true;
    this.awake = false;
  }
  wake(time) {
    const cam = this.scene.cameras.main;
    if (!this.awake && Math.abs(this.x - (cam.scrollX + cam.width / 2)) < cam.width / 2 + 48) {
      this.awake = true;
      this.onWake(time);
    }
    return this.awake;
  }
  onWake() {}
  stomp() {
    if (!this.alive) return;
    this.alive = false;
    this.body.enable = false;
    this.setScale(1.15, 0.35);
    this.y += this.displayHeight;
    this.scene.tweens.add({ targets: this, alpha: 0, delay: 250, duration: 200, onComplete: () => this.destroy() });
  }
  knockOut(dir = 1) {
    if (!this.alive) return;
    this.alive = false;
    this.body.enable = false;
    this.setFlipY(true);
    this.scene.tweens.add({ targets: this, x: this.x + dir * 30, y: this.y - 24, duration: 180, ease: 'Quad.out',
      onComplete: () => this.scene.tweens.add({ targets: this, y: this.y + 260, duration: 600, ease: 'Quad.in',
        onComplete: () => this.destroy() }) });
  }
}

/** Gol Gappa Goon: walks, turns at walls and ledges */
class Goon extends Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'goon');
    this.body.setSize(14, 12).setOffset(1, 4);
    this.speed = 40;
    this.dir = -1;
    this.flipTimer = 0;
  }
  update(time) {
    if (!this.alive || !this.wake(time)) return;
    const b = this.body;
    if (b.blocked.left) this.dir = 1;
    else if (b.blocked.right) this.dir = -1;
    else if (b.blocked.down && !this.scene.isSolidAt(this.x + this.dir * 9, b.bottom + 4)) this.dir *= -1;
    b.setVelocityX(this.dir * this.speed);
    if (time > this.flipTimer) { this.setFlipX(!this.flipX); this.flipTimer = time + 220; } // little waddle
    if (this.y > WORLD_H - 10) this.destroy();
  }
}

/** Machhar: hovers in a figure-of-eight */
class Machhar extends Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'machhar');
    this.body.setAllowGravity(false);
    this.body.setSize(12, 12).setOffset(2, 2);
    this.baseX = x; this.baseY = y;
    this.phase = Math.random() * Math.PI * 2;
  }
  update(time) {
    if (!this.alive) return;
    const t = time / 1000 + this.phase;
    this.x = this.baseX + Math.sin(t * 0.8) * 26;
    this.y = this.baseY + Math.sin(t * 3) * 10;
    this.setFlipX(Math.cos(t * 0.8) > 0);
  }
}

/** Shararti Kawwa: cruises, then swoops at the player */
class Kawwa extends Enemy {
  constructor(scene, x, y) {
    super(scene, x, y, 'kawwa');
    this.body.setAllowGravity(false);
    this.body.setSize(16, 10).setOffset(2, 4);
    this.baseY = y;
    this.mode = 'cruise';
    this.nextDive = 0;
    this.modeUntil = 0;
  }
  update(time) {
    if (!this.alive || !this.wake(time)) return;
    const p = this.scene.player;
    const b = this.body;
    const floorY = this.scene.L.groundTop * TILE - 14;
    if (this.mode === 'cruise') {
      b.setVelocity(-45, Math.sin(time / 300) * 20);
      if (p && !p.dead && time > this.nextDive && Math.abs(p.x - this.x) < 110 && p.y > this.y + 10) {
        this.mode = 'dive';
        this.modeUntil = time + 650;
        b.setVelocity(Math.sign(p.x - this.x) * 110, 150);
      }
    } else if (this.mode === 'dive') {
      if (time > this.modeUntil || this.y >= floorY) {
        this.mode = 'rise';
        b.setVelocity(Math.sign(b.velocity.x || -1) * 60, -110);
      }
    } else if (this.mode === 'rise') {
      if (this.y <= this.baseY) {
        this.y = this.baseY;
        this.mode = 'cruise';
        this.nextDive = time + 1500;
      }
    }
    this.setFlipX(b.velocity.x < 0);
    if (this.x < -40) this.destroy();
  }
}

const TXT = (size = 10, color = '#ffffff', extra = {}) =>
  Object.assign({ fontFamily: 'monospace', fontSize: `${size}px`, color, resolution: 3 }, extra);

function makeButton(scene, x, y, label, onClick, w = 110, h = 22) {
  const bg = scene.add.rectangle(x, y, w, h, 0x01411c).setStrokeStyle(2, 0xffd54f).setInteractive({ useHandCursor: true });
  const t = scene.add.text(x, y, label, TXT(10, '#ffffff', { fontStyle: 'bold' })).setOrigin(0.5);
  bg.on('pointerover', () => bg.setFillStyle(0x2e7d32));
  bg.on('pointerout', () => bg.setFillStyle(0x01411c));
  bg.on('pointerdown', () => { Sfx.init(); onClick(); });
  return { bg, t };
}

// truck-art style border
function truckBorder(scene) {
  const g = scene.add.graphics();
  const cols = [0xe91e63, 0xffd54f, 0x00bcd4, 0x8bc34a];
  for (let i = 0; i < GAME_WIDTH; i += 12) {
    g.fillStyle(cols[(i / 12) % 4], 1);
    g.fillTriangle(i, 0, i + 12, 0, i + 6, 8);
    g.fillTriangle(i, GAME_HEIGHT, i + 12, GAME_HEIGHT, i + 6, GAME_HEIGHT - 8);
  }
  return g;
}

class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init(data) {
    this.levelId = data.levelId || '1-1';
    this.respawnX = data.respawnX || null;
    this.L = LEVELS[this.levelId];
    const heroId = SaveManager.load().hero;
    this.hero = HEROES.find(h => h.id === heroId) || HEROES[0];
  }

  create() {
    const L = this.L;
    const W = L.width * TILE;
    const gt = L.groundTop * TILE;
    this.solid = new Set();
    this.timeLeft = LEVEL_TIME;
    this.stats = { jalebis: 0, enemies: 0, stars: new Set() };
    this.ending = false;
    this.checkpointHit = !!this.respawnX;

    this.buildLevelTextures();

    /* world + camera */
    this.physics.world.setBounds(0, 0, W, WORLD_H);
    this.physics.world.setBoundsCollision(true, true, false, false);
    this.cameras.main.setBounds(0, 0, W, CAM_H).setBackgroundColor(L.sky).setRoundPixels(true);

    this.buildBackground();

    /* solid ground */
    this.groundGroup = this.physics.add.staticGroup();
    L.ground.forEach(([sx, len]) => {
      const x = sx * TILE, w = len * TILE, h = CAM_H + 32 - gt;
      this.add.tileSprite(x, gt, w, TILE, `gtop-${L.id}`).setOrigin(0).setDepth(2);
      this.add.tileSprite(x, gt + TILE, w, h - TILE, `gfill-${L.id}`).setOrigin(0).setDepth(2);
      const z = this.add.zone(x + w / 2, gt + h / 2, w, h);
      this.physics.add.existing(z, true);
      this.groundGroup.add(z);
      for (let c = sx; c < sx + len; c++) for (let r = L.groundTop; r < L.groundTop + 6; r++) this.solid.add(`${c},${r}`);
    });

    /* one-way platforms */
    this.platformGroup = this.physics.add.staticGroup();
    L.platforms.forEach(([sx, row, len]) => {
      const x = sx * TILE, y = row * TILE, w = len * TILE;
      this.add.tileSprite(x, y, w, TILE, `plat-${L.id}`).setOrigin(0).setDepth(2);
      const z = this.add.zone(x + w / 2, y + TILE / 2, w, TILE);
      this.physics.add.existing(z, true);
      z.body.checkCollision.down = false;
      z.body.checkCollision.left = false;
      z.body.checkCollision.right = false;
      this.platformGroup.add(z);
      for (let c = sx; c < sx + len; c++) this.solid.add(`${c},${row}`);
    });

    /* matka blocks */
    this.matkas = this.physics.add.staticGroup();
    L.matkas.forEach(([tx, ty], i) => {
      const m = this.matkas.create(tx * TILE + 8, ty * TILE + 8, 'matka').setDepth(3);
      m.used = false;
      m.idx = i;
      this.solid.add(`${tx},${ty}`);
    });

    /* collectibles */
    this.coins = this.physics.add.staticGroup();
    L.coins.forEach(([tx, ty]) => {
      const c = this.coins.create(tx * TILE + 8, ty * TILE + 8, 'jalebi').setDepth(4);
      this.tweens.add({ targets: c, scaleX: 0.4, duration: 420, yoyo: true, repeat: -1, delay: (tx * 37) % 400 });
    });
    this.starsGroup = this.physics.add.staticGroup();
    L.stars.forEach(([tx, ty], i) => {
      const s = this.starsGroup.create(tx * TILE + 8, ty * TILE + 8, 'star').setDepth(4);
      s.idx = i;
      this.tweens.add({ targets: s, angle: 360, duration: 2400, repeat: -1 });
    });
    this.items = this.physics.add.group({ allowGravity: false, immovable: true });

    /* checkpoint + flag */
    const cpX = L.checkpoint * TILE + 8;
    this.checkpoint = this.add.image(cpX, gt, 'checkpoint').setOrigin(0.5, 1).setDepth(3);
    if (this.checkpointHit) this.checkpoint.setTint(0x66bb6a);
    this.cpZone = this.add.zone(cpX, gt / 2, 16, gt);
    this.physics.add.existing(this.cpZone, true);
    const fX = L.flag * TILE + 8;
    this.add.image(fX, gt, 'flag').setOrigin(0.3, 1).setDepth(3).setScale(1, 1.6);
    this.flagZone = this.add.zone(fX, gt / 2, 10, gt);
    this.physics.add.existing(this.flagZone, true);

    /* enemies */
    this.walkers = this.physics.add.group({ runChildUpdate: true });
    this.flyers = this.physics.add.group({ runChildUpdate: true, allowGravity: false });
    L.enemies.forEach(e => {
      const Cls = ENEMY_TYPES[e.t];
      if (!Cls) return;
      if (this.respawnX && e.x * TILE < this.respawnX + 40) return; // keep checkpoint start fair
      const x = e.x * TILE + 8;
      if (e.t === 'goon') this.walkers.add(new Cls(this, x, gt - 8));
      else {
        const en = new Cls(this, x, (e.y || 9) * TILE + 8);
        this.flyers.add(en);
        en.body.setAllowGravity(false);
      }
    });

    /* player */
    this.inputMgr = new InputManager(this);
    const startX = this.respawnX || 3 * TILE;
    this.player = new Player(this, startX, gt - 24, this.hero, this.inputMgr);
    this.cameras.main.startFollow(this.player, true, 0.15, 0.15).setDeadzone(40, 60);

    /* cricket balls (object pool) */
    this.balls = this.physics.add.group({ maxSize: 3 });

    /* colliders & overlaps */
    const solids = [this.groundGroup, this.platformGroup, this.matkas];
    solids.forEach(s => {
      this.physics.add.collider(this.walkers, s);
      this.physics.add.collider(this.balls, s, b => this.ballBounce(b));
    });
    this.physics.add.collider(this.player, this.groundGroup);
    this.physics.add.collider(this.player, this.platformGroup);
    this.physics.add.collider(this.player, this.matkas, (p, m) => this.hitMatka(p, m));
    this.physics.add.overlap(this.player, [this.walkers, this.flyers], (p, e) => this.touchEnemy(p, e));
    this.physics.add.overlap(this.balls, [this.walkers, this.flyers], (b, e) => this.ballHit(b, e));
    this.physics.add.overlap(this.player, this.coins, (p, c) => this.getCoin(c));
    this.physics.add.overlap(this.player, this.starsGroup, (p, s) => this.getStar(s));
    this.physics.add.overlap(this.player, this.items, (p, it) => this.getItem(it));
    this.physics.add.overlap(this.player, this.cpZone, () => this.reachCheckpoint());
    this.physics.add.overlap(this.player, this.flagZone, () => this.reachFlag());

    /* HUD + level intro */
    this.registry.set({ time: LEVEL_TIME, levelName: L.name, levelId: L.id, starsGot: 0, power: '' });
    this.scene.launch('HUD', { inputMgr: this.inputMgr });
    this.scene.bringToTop('HUD');
    this.showBanner(`${L.id}  ${L.name}`);

    this.keyPause = [this.inputMgr.keys.ESC, this.inputMgr.keys.P];
    this.events.on('resume', () => { this.inputMgr.touch = { left: false, right: false, jump: false, action: false }; });

    if (DEBUG) window.__game = this;
  }

  buildLevelTextures() {
    const L = this.L;
    makeTex(this, `gtop-${L.id}`, 16, 16, c => {
      c.fillStyle = L.groundColor; c.fillRect(0, 0, 16, 16);
      c.fillStyle = L.groundTopColor; c.fillRect(0, 0, 16, 5);
      c.fillStyle = 'rgba(255,255,255,0.25)'; c.fillRect(0, 0, 16, 1);
      c.fillStyle = 'rgba(0,0,0,0.18)'; c.fillRect(0, 5, 16, 1); c.fillRect(3, 9, 2, 2); c.fillRect(11, 12, 2, 2);
    });
    makeTex(this, `gfill-${L.id}`, 16, 16, c => {
      c.fillStyle = L.groundColor; c.fillRect(0, 0, 16, 16);
      c.fillStyle = 'rgba(0,0,0,0.18)';
      c.fillRect(0, 7, 16, 1); c.fillRect(0, 15, 16, 1); c.fillRect(7, 0, 1, 7); c.fillRect(15, 8, 1, 7);
    });
    makeTex(this, `plat-${L.id}`, 16, 16, c => {
      c.fillStyle = L.platformColor; c.fillRect(0, 0, 16, 16);
      c.fillStyle = 'rgba(255,255,255,0.3)'; c.fillRect(0, 0, 16, 2);
      c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(0, 15, 16, 1); c.fillRect(7, 2, 1, 6); c.fillRect(15, 8, 1, 7); c.fillRect(0, 8, 16, 1);
    });
  }

  buildBackground() {
    const L = this.L;
    const gt = L.groundTop * TILE;
    const toCol = s => Phaser.Display.Color.HexStringToColor(s).color;

    // world-specific sky decoration
    if (L.world === 3) this.add.circle(380, 60, 26, 0xfff3c4).setScrollFactor(0).setDepth(-5);
    else this.add.circle(400, 48, 16, 0xfffde7, 0.9).setScrollFactor(0).setDepth(-5);

    this.far = this.add.tileSprite(0, gt - 110, GAME_WIDTH, 140, 'bg-far').setOrigin(0).setScrollFactor(0).setTint(toCol(L.farColor)).setDepth(-4);
    if (L.world === 2) this.add.rectangle(0, gt - 30, GAME_WIDTH, 80, 0x2e86ab).setOrigin(0).setScrollFactor(0).setDepth(-3.5);
    this.near = this.add.tileSprite(0, gt - 80, GAME_WIDTH, 120, 'bg-near').setOrigin(0).setScrollFactor(0).setTint(toCol(L.nearColor)).setDepth(-3);
    if (L.world === 2) this.near.setVisible(false);

    // clouds and (in Lahore) kites in the sky
    for (let i = 0; i < Math.ceil(L.width / 20); i++) {
      const x = i * 330 + (i * 97) % 120;
      const y = 20 + (i * 53) % 60;
      this.add.ellipse(x, y, 54, 16, 0xffffff, 0.8).setScrollFactor(0.3).setDepth(-4.5);
      this.add.ellipse(x + 14, y - 6, 30, 14, 0xffffff, 0.8).setScrollFactor(0.3).setDepth(-4.5);
      if (L.world === 1 && i % 2 === 0) {
        const k = this.add.image(x + 100, y + 30, 'patang').setScrollFactor(0.4).setDepth(-4.4).setAlpha(0.85)
          .setTint([0xe53935, 0x43a047, 0xfdd835, 0x8e24aa][i % 4]);
        this.tweens.add({ targets: k, y: k.y - 8, angle: 12, duration: 1400 + i * 90, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
      }
    }
  }

  isSolidAt(px, py) {
    return this.solid.has(`${Math.floor(px / TILE)},${Math.floor(py / TILE)}`);
  }

  showBanner(text) {
    const t = this.add.text(GAME_WIDTH / 2, 70, text, TXT(14, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }))
      .setOrigin(0.5).setScrollFactor(0).setDepth(50);
    this.tweens.add({ targets: t, alpha: 0, delay: 1400, duration: 500, onComplete: () => t.destroy() });
  }

  floatText(x, y, str, color = '#ffffff') {
    const t = this.add.text(x, y, str, TXT(8, color, { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 })).setOrigin(0.5).setDepth(40);
    this.tweens.add({ targets: t, y: y - 18, alpha: 0, duration: 700, onComplete: () => t.destroy() });
  }

  addScore(n) { this.registry.inc('score', n); }

  /* ---------- interactions ---------- */
  touchEnemy(p, e) {
    if (!e.alive || p.dead || this.ending) return;
    const falling = p.body.velocity.y > 0 && p.body.bottom <= e.body.top + 10;
    if (falling) {
      e.stomp();
      p.body.setVelocityY(this.inputMgr.jumpHeld ? -360 : -240);
      this.stats.enemies++;
      this.addScore(100);
      this.floatText(e.x, e.y - 8, '100');
      Sfx.stomp();
    } else {
      p.hurt(this.time.now);
    }
  }

  hitMatka(p, m) {
    if (m.used || this.ending) return;
    const fromBelow = (p.body.touching.up || p.body.blocked.up) && p.body.top >= m.body.bottom - 4 &&
      Math.abs(p.x - m.x) < 14;
    if (!fromBelow) return;
    m.used = true;
    m.setTint(0x8a8a8a);
    this.tweens.add({ targets: m, y: m.y - 5, duration: 70, yoyo: true });
    const kind = !p.isBig ? 'samosa' : ['ball', 'chai', 'patang'][m.idx % 3];
    const it = this.items.create(m.x, m.y, kind).setDepth(2);
    it.kind = kind;
    it.body.enable = false;
    this.tweens.add({ targets: it, y: m.y - 16, duration: 300, onComplete: () => {
      if (!it.active) return;
      it.body.enable = true;
      this.tweens.add({ targets: it, y: it.y - 3, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    } });
    Sfx.coin();
  }

  getItem(it) {
    if (!it.active) return;
    const p = this.player;
    const now = this.time.now;
    const label = { samosa: 'SAMOSA! BIG', chai: 'CHAI! SPEED', patang: 'PATANG! GLIDE', ball: 'CRICKET BALL! (J)' }[it.kind];
    if (it.kind === 'samosa') p.grow();
    if (it.kind === 'chai') p.speedUntil = now + 10000;
    if (it.kind === 'patang') p.glideUntil = now + 10000;
    if (it.kind === 'ball') { p.hasBall = true; if (!p.isBig) p.grow(); }
    this.floatText(it.x, it.y - 10, label, '#ffd54f');
    it.destroy();
    Sfx.power();
  }

  getCoin(c) {
    c.disableBody(true, true);
    this.stats.jalebis++;
    this.addScore(10);
    this.registry.inc('jalebis', 1);
    if (this.registry.get('jalebis') >= 100) {
      this.registry.inc('jalebis', -100);
      this.registry.inc('lives', 1);
      this.floatText(this.player.x, this.player.y - 20, '1UP!', '#76ff03');
      Sfx.power();
    } else Sfx.coin();
  }

  getStar(s) {
    s.disableBody(true, true);
    this.stats.stars.add(s.idx);
    this.registry.set('starsGot', this.stats.stars.size);
    this.addScore(1000);
    this.floatText(s.x, s.y - 10, 'TAARA! 1000', '#ffd54f');
    Sfx.star();
  }

  reachCheckpoint() {
    if (this.checkpointHit) return;
    this.checkpointHit = true;
    this.respawnX = this.L.checkpoint * TILE + 8;
    this.checkpoint.setTint(0x66bb6a);
    this.floatText(this.checkpoint.x, this.checkpoint.y - 44, 'CHECKPOINT', '#76ff03');
    Sfx.power();
  }

  throwBall(p) {
    const b = this.balls.get(p.x + p.facing * 10, p.y - 2, 'ball');
    if (!b) return;
    b.setActive(true).setVisible(true).setDepth(9);
    b.body.enable = true;
    b.body.reset(p.x + p.facing * 10, p.y - 2);
    b.body.setAllowGravity(true);
    b.body.setCircle(4, 1, 1);
    b.setBounce(0.65, 0.65);
    const speed = p.hero.ability === 'fastThrow' ? 340 : 280;
    b.setVelocity(p.facing * speed, -80);
    b.dir = p.facing;
    b.dieAt = this.time.now + 1600;
    Sfx.throwB();
  }

  ballBounce(b) {
    if (b.body.blocked.left || b.body.blocked.right) this.killBall(b);
    else if (b.body.blocked.down) b.setVelocityY(-200);
  }

  ballHit(b, e) {
    if (!b.active || !e.alive) return;
    e.knockOut(b.dir);
    this.killBall(b);
    this.stats.enemies++;
    this.addScore(100);
    this.floatText(e.x, e.y - 8, '100');
    Sfx.stomp();
  }

  killBall(b) {
    b.setActive(false).setVisible(false);
    b.body.enable = false;
  }

  playerDie() {
    const p = this.player;
    if (p.dead || this.ending) return;
    p.dead = true;
    p.body.enable = false;
    p.setAlpha(1).setFrame(7).anims.stop();
    Sfx.hurt();
    this.cameras.main.stopFollow();
    this.tweens.add({ targets: p, y: p.y - 40, duration: 350, ease: 'Quad.out',
      onComplete: () => this.tweens.add({ targets: p, y: p.y + 320, duration: 800, ease: 'Quad.in' }) });
    this.time.delayedCall(1500, () => {
      this.registry.inc('lives', -1);
      if (this.registry.get('lives') <= 0) {
        this.scene.stop('HUD');
        this.scene.start('GameOver', { levelId: this.levelId });
      } else {
        this.scene.restart({ levelId: this.levelId, respawnX: this.checkpointHit ? this.respawnX : null });
      }
    });
  }

  reachFlag() {
    if (this.ending || this.player.dead) return;
    this.ending = true;
    const p = this.player;
    p.frozen = true;
    p.body.setVelocity(0, 0).setAcceleration(0, 0);
    p.setAlpha(1);
    Sfx.flag();
    const timeLeft = Math.max(0, Math.floor(this.timeLeft));
    const levelPts = levelScore({ jalebis: this.stats.jalebis, enemies: this.stats.enemies, timeLeft, stars: this.stats.stars.size });
    this.addScore(timeLeft * 5);
    SaveManager.complete(this.levelId, levelPts, this.stats.stars.size, this.L.next);
    this.time.delayedCall(1800, () => {
      this.scene.stop('HUD');
      this.scene.start('LevelComplete', {
        levelId: this.levelId, jalebis: this.stats.jalebis, enemies: this.stats.enemies,
        timeLeft, stars: this.stats.stars.size, levelPts
      });
    });
  }

  update(time, delta) {
    this.inputMgr.update();
    const p = this.player;

    if (!this.ending && !p.dead) {
      if (this.keyPause.some(k => Phaser.Input.Keyboard.JustDown(k)) || this.inputMgr.pausePressed) {
        this.inputMgr.pausePressed = false;
        this.scene.launch('Pause');
        this.scene.pause();
        return;
      }
      this.timeLeft -= delta / 1000;
      this.registry.set('time', Math.max(0, Math.ceil(this.timeLeft)));
      if (this.timeLeft <= 0) this.playerDie();
      if (p.y > CAM_H + 24) this.playerDie();
    }
    p.update(time, delta);

    // power-up label for the HUD
    const pw = [];
    if (p.canThrow()) pw.push('BALL');
    if (time < p.speedUntil) pw.push(`CHAI ${Math.ceil((p.speedUntil - time) / 1000)}`);
    if (time < p.glideUntil) pw.push(`PATANG ${Math.ceil((p.glideUntil - time) / 1000)}`);
    this.registry.set('power', pw.join('  '));

    // balls lifetime
    this.balls.getChildren().forEach(b => { if (b.active && (time > b.dieAt || b.y > CAM_H + 20)) this.killBall(b); });

    // parallax
    const cam = this.cameras.main;
    this.far.tilePositionX = cam.scrollX * 0.15;
    this.near.tilePositionX = cam.scrollX * 0.35;
  }
}

class HUDScene extends Phaser.Scene {
  constructor() { super('HUD'); }
  init(data) { this.inputMgr = data.inputMgr; }
  create() {
    this.add.rectangle(0, 0, GAME_WIDTH, 22, 0x000000, 0.35).setOrigin(0);
    const s = TXT(9, '#ffffff', { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 });
    this.scoreT = this.add.text(8, 6, '', s);
    this.coinIcon = this.add.image(112, 11, 'jalebi');
    this.coinT = this.add.text(121, 6, '', s);
    this.starT = this.add.text(166, 6, '', TXT(9, '#ffd54f', { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }));
    this.livesT = this.add.text(220, 6, '', s);
    this.timeT = this.add.text(GAME_WIDTH - 108, 6, '', s);
    this.powerT = this.add.text(8, 26, '', TXT(8, '#80deea', { fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }));

    const pauseBtn = this.add.text(GAME_WIDTH - 10, 5, 'II', TXT(11, '#ffffff', { fontStyle: 'bold', backgroundColor: '#01411c', padding: { x: 4, y: 1 } }))
      .setOrigin(1, 0).setInteractive({ useHandCursor: true });
    pauseBtn.on('pointerdown', () => { if (this.inputMgr) this.inputMgr.pausePressed = true; });

    const isTouch = this.sys.game.device.input.touch || new URLSearchParams(location.search).has('touch');
    if (isTouch && this.inputMgr) this.buildTouch();
  }

  buildTouch() {
    this.input.addPointer(3);
    const im = this.inputMgr;
    const make = (x, y, r, label, flag) => {
      const c = this.add.circle(x, y, r, 0xffffff, 0.22).setStrokeStyle(2, 0xffffff, 0.5).setInteractive();
      this.add.text(x, y, label, TXT(14, '#ffffff', { fontStyle: 'bold' })).setOrigin(0.5).setAlpha(0.8);
      const on = () => { im.touch[flag] = true; c.setFillStyle(0xffffff, 0.45); };
      const off = () => { im.touch[flag] = false; c.setFillStyle(0xffffff, 0.22); };
      c.on('pointerdown', on); c.on('pointerover', (p) => { if (p.isDown) on(); });
      c.on('pointerup', off); c.on('pointerout', off);
    };
    make(36, GAME_HEIGHT - 34, 24, '◀', 'left');
    make(94, GAME_HEIGHT - 34, 24, '▶', 'right');
    make(GAME_WIDTH - 38, GAME_HEIGHT - 40, 26, 'A', 'jump');
    make(GAME_WIDTH - 96, GAME_HEIGHT - 28, 20, 'B', 'action');
  }

  update() {
    const r = this.registry;
    this.scoreT.setText(`SCORE ${String(r.get('score') || 0).padStart(6, '0')}`);
    this.coinT.setText(`x${r.get('jalebis') || 0}`);
    this.starT.setText('★'.repeat(r.get('starsGot') || 0) + '☆'.repeat(3 - (r.get('starsGot') || 0)));
    this.livesT.setText(`LIVES ${r.get('lives')}   ${r.get('levelId')}`);
    this.timeT.setText(`TIME ${r.get('time')}`);
    this.powerT.setText(r.get('power') || '');
  }
}

class PauseScene extends Phaser.Scene {
  constructor() { super('Pause'); }
  create() {
    this.add.rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.6).setOrigin(0);
    this.add.text(GAME_WIDTH / 2, 70, 'PAUSED', TXT(24, '#ffd54f', { fontStyle: 'bold' })).setOrigin(0.5);
    makeButton(this, GAME_WIDTH / 2, 120, 'RESUME', () => this.resumeGame(), 140);
    makeButton(this, GAME_WIDTH / 2, 150, Sfx.muted ? 'SOUND: OFF' : 'SOUND: ON', () => {
      Sfx.muted = !Sfx.muted;
      const d = SaveManager.load(); d.muted = Sfx.muted; SaveManager.save(d);
      this.scene.restart();
    }, 140);
    makeButton(this, GAME_WIDTH / 2, 180, 'QUIT TO LEVELS', () => {
      this.scene.stop('HUD'); this.scene.stop('Game'); this.scene.start('LevelSelect');
    }, 140);
    this.input.keyboard.on('keydown-ESC', () => this.resumeGame());
    this.input.keyboard.on('keydown-P', () => this.resumeGame());
    this.input.keyboard.on('keydown-ENTER', () => this.resumeGame());
  }
  resumeGame() { this.scene.resume('Game'); this.scene.stop(); }
}

class LevelCompleteScene extends Phaser.Scene {
  constructor() { super('LevelComplete'); }
  init(d) { this.d = d; }
  create() {
    const d = this.d;
    const L = LEVELS[d.levelId];
    const last = !L.next;
    this.cameras.main.setBackgroundColor('#01411c');
    truckBorder(this);
    this.add.text(GAME_WIDTH / 2, 36, last ? 'KITE RECOVERED!' : 'SHABAASH!', TXT(24, '#ffd54f', { fontStyle: 'bold', stroke: '#000', strokeThickness: 4 })).setOrigin(0.5);
    this.add.text(GAME_WIDTH / 2, 62, `${L.id}  ${L.name} complete`, TXT(10)).setOrigin(0.5);
    const lines = [
      ['Jalebis', `${d.jalebis} x 10`, d.jalebis * 10],
      ['Enemies', `${d.enemies} x 100`, d.enemies * 100],
      ['Time left', `${d.timeLeft} x 5`, d.timeLeft * 5],
      ['Taaray', `${d.stars} x 1000`, d.stars * 1000]
    ];
    lines.forEach(([a, b, c], i) => {
      const y = 88 + i * 18;
      this.add.text(120, y, a, TXT(10)).setOrigin(0, 0.5);
      this.add.text(250, y, b, TXT(10, '#c8e6c9')).setOrigin(0.5);
      this.add.text(360, y, String(c), TXT(10, '#ffd54f', { fontStyle: 'bold' })).setOrigin(1, 0.5);
    });
    this.add.text(120, 170, 'LEVEL SCORE', TXT(11, '#ffffff', { fontStyle: 'bold' })).setOrigin(0, 0.5);
    this.add.text(360, 170, String(d.levelPts), TXT(11, '#ffd54f', { fontStyle: 'bold' })).setOrigin(1, 0.5);
    if (last) this.add.text(GAME_WIDTH / 2, 192, 'The festival sky is colourful again. Thank you, hero!', TXT(9, '#80deea')).setOrigin(0.5);

    const next = () => {
      if (last) this.scene.start('LevelSelect');
      else this.scene.start('Game', { levelId: L.next });
    };
    makeButton(this, GAME_WIDTH / 2 - 70, 226, 'LEVELS', () => this.scene.start('LevelSelect'), 110);
    makeButton(this, GAME_WIDTH / 2 + 70, 226, last ? 'FINISH' : 'NEXT >', next, 110);
    this.input.keyboard.once('keydown-ENTER', next);
    this.input.keyboard.once('keydown-SPACE', next);
  }
}

class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOver'); }
  init(d) { this.d = d; }
  create() {
    this.cameras.main.setBackgroundColor('#1a1a1a');
    this.add.text(GAME_WIDTH / 2, 80, 'GAME OVER', TXT(28, '#e53935', { fontStyle: 'bold', stroke: '#000', strokeThickness: 4 })).setOrigin(0.5);
    this.add.text(GAME_WIDTH / 2, 116, `Final score: ${this.registry.get('score') || 0}`, TXT(12)).setOrigin(0.5);
    this.add.text(GAME_WIDTH / 2, 136, 'Himmat na haaro! Try again.', TXT(10, '#a5d6a7')).setOrigin(0.5);
    const retry = () => {
      this.registry.set({ score: 0, lives: START_LIVES, jalebis: 0 });
      this.scene.start('Game', { levelId: this.d.levelId });
    };
    makeButton(this, GAME_WIDTH / 2 - 70, 190, 'RETRY', retry, 110);
    makeButton(this, GAME_WIDTH / 2 + 70, 190, 'LEVELS', () => this.scene.start('LevelSelect'), 110);
    this.input.keyboard.once('keydown-ENTER', retry);
    this.input.keyboard.once('keydown-SPACE', retry);
  }
}

/* ------------------------------ 12. BOOTSTRAP ----------------------------- */
const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: GAME_WIDTH,
  height: GAME_HEIGHT,
  pixelArt: true,
  backgroundColor: '#0b0f14',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade', arcade: { gravity: { y: GRAVITY }, debug: DEBUG } },
  input: { gamepad: true, activePointers: 4 },
  scene: [BootScene, MenuScene, CharacterSelectScene, LevelSelectScene, GameScene, HUDScene,
          PauseScene, LevelCompleteScene, GameOverScene]
});
if (DEBUG) window.__phaser = game;
</script>
</body>
</html>
